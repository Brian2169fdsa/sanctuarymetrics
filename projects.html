<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanctuary Recovery Centers — Project Tracking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="report.css">
<style>
/* ── projects table ── */
.ptools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0 8px}
.ptools .chips{margin:0}
.ptable td{vertical-align:top}
.ptable .pchk input{width:18px;height:18px;cursor:pointer;margin-top:2px}
.ptable .pitem{min-width:240px;max-width:460px}
.ptitle{all:unset;cursor:pointer;font-weight:600;color:var(--ink);line-height:1.35}
.ptitle:hover{color:var(--blue);text-decoration:underline}
.ptitle:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:3px}
.pnotes{font-size:12.5px;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.pevent{font-size:12.5px;margin-top:6px}
.pevent a{color:var(--blue)}
.pdone{opacity:.6}
.pdone .ptitle{text-decoration:line-through}
.pedit{color:var(--teal)!important}
.pedit:hover{background:#eef5f8!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ── add / edit popover ── */
#pmodal{border:0;padding:0;border-radius:16px;width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 32px);
  box-shadow:0 24px 60px rgba(22,38,59,.28);color:var(--ink);background:#fff}
#pmodal::backdrop{background:rgba(22,38,59,.42);backdrop-filter:blur(2px)}
.pm{padding:22px 24px 20px;font-family:Inter,sans-serif}
.pm-tabs{display:flex;gap:4px;margin:16px 0 0;border-bottom:1px solid var(--line);overflow-x:auto}
.pm-tab{all:unset;cursor:pointer;padding:9px 12px;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.pm-tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue)}
.pm-tab:focus-visible{outline:2px solid var(--blue);outline-offset:-2px;border-radius:6px}
.pm-pane{margin-top:16px}
.pm-note,.pm-empty{font-size:13px;color:var(--muted);margin:0;padding:12px;border:1px dashed var(--line);border-radius:10px;list-style:none}
.thread{max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:2px}
.msg{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fbfdfe}
.msg-h{display:flex;align-items:center;gap:8px;font-size:12.5px}
.msg-h span{color:var(--muted)}
.msg-b{font-size:14px;margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg-x{all:unset;cursor:pointer;margin-left:auto;color:var(--muted);font-size:18px;line-height:1;padding:0 6px;border-radius:6px}
.msg-x:hover{background:#fbeae6;color:#8f2f1b}
.composer{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.composer-f{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.fine{font-size:12px;color:var(--muted)}
ul.files{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.files li{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.ftype{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:#f1f5f7;border-radius:6px;padding:3px 7px}
.fmain{display:flex;flex-direction:column;min-width:0;flex:1}
.fmain a,.file-dl{color:var(--blue);font-weight:600;font-size:14px;overflow-wrap:anywhere;text-align:left}
.file-dl{all:unset;cursor:pointer;color:var(--blue);font-weight:600;font-size:14px}
.file-dl:hover,.fmain a:hover{text-decoration:underline}
.fmeta{font-size:12px;color:var(--muted)}
.addlink{display:grid;grid-template-columns:2fr 1.4fr auto;gap:10px;align-items:end;margin-top:16px}
.upload{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.upload label.btn{cursor:pointer}
.pmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pmeta-b{all:unset;cursor:pointer;font-size:11.5px;font-weight:600;color:var(--teal);background:#eef5f8;border-radius:999px;padding:2px 9px}
.pmeta-b:hover{background:#e0eef4}
.pm-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pm-head h3{font-family:Fraunces,serif;font-size:22px;font-weight:600;margin:0}
.pm-x{all:unset;cursor:pointer;font-size:26px;line-height:1;color:var(--muted);padding:2px 8px;border-radius:8px}
.pm-x:hover{background:#f1f5f7;color:var(--ink)}
.pm-sub{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.pm-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin-top:18px}
.pm-wide{grid-column:1/-1}
.pm-f{display:flex;flex-direction:column;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.pm-f input,.pm-f select,.pm-f textarea{font-family:inherit;font-size:14px;text-transform:none;letter-spacing:0;font-weight:400;
  color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.pm-f textarea{resize:vertical;min-height:96px;line-height:1.45}
.pm-f input[readonly]{background:#f6f9fa;color:var(--muted)}
.pm-f input:focus,.pm-f select:focus,.pm-f textarea:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:transparent}
.pm-check{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;cursor:pointer;padding:10px 12px;
  border:1px solid var(--line);border-radius:10px;background:#fbfdfe}
.pm-check input{width:18px;height:18px;cursor:pointer}
.pm-event{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px 16px;padding:14px;border-radius:10px;background:#f3f8fb;border:1px solid #dbe8ef}
.pm-event[hidden]{display:none}
.pm-ev-wide{grid-column:1/-1}
.pm-meet{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pm-teams{background:#5B5FC7!important}
.pm-teams:hover{background:#4a4eb0!important}
.pm-hint{flex-basis:100%;margin:2px 0 0;font-size:12px;color:var(--muted);line-height:1.45}
.pinv{font-size:12px;color:var(--muted)}
.pm-err{margin-top:14px;padding:10px 12px;border-radius:9px;background:#fbeae6;color:#8f2f1b;font-size:13px}
.pm-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.pm-foot > div{display:flex;gap:8px}
.pm-cancel{background:transparent!important;color:var(--ink)!important;border:1px solid var(--line)!important}
.pm-cancel:hover{background:#f1f5f7!important}
@media (max-width:600px){
  .pm{padding:18px 16px}
  .addlink{grid-template-columns:1fr}
  .pm-grid,.pm-event{grid-template-columns:1fr}
  .pm-foot{flex-direction:column-reverse;align-items:stretch}
  .pm-foot > div{justify-content:flex-end}
}
</style>
</head>
<body><div class="sheet" id="sheet"></div>
<script src="data.js"></script>
<script src="ui.js"></script>
<script src="chat.js" defer></script>
<script>
/* ── project tracker ──────────────────────────────────────────────────────
   One shared list for the whole team, stored in Supabase through
   /api/projects (see api/projects.js). The page asks for the team password
   once and keeps it in this browser.

   L10 rocks come from data.js (the L10 object — last column is the current
   status). Edits made here to a rock (tick-off, importance, date) are stored
   as a separate row keyed by the rock's title, so a new L10 import never
   loses them. Projects added here are ordinary rows.

   The first time a browser connects, anything it saved under the old
   browser-only tracker (localStorage) is copied up once.                  */
var STATUSES = ['On-track', 'Off Track', 'In Progress', 'On Hold', 'New', 'Complete'];
var IMPORTANCE = ['Hot', 'Med', 'Cold'];
var API = '/api/projects';
var PW_KEY = 'src_projects_pw';
var OLD_LIST_KEY = 'src_projects_v1';       /* old browser-only store */
var OLD_META_KEY = 'src_projects_meta_v1';
var MIGRATED_KEY = 'src_projects_migrated_v1';

var ROWS = [];          /* rows from the server */
var THREADS = null;     /* {comments, attachments} — null until their tables exist */
var NAME_KEY = 'src_projects_name';
var STATE = 'loading';  /* loading | password | error | ready */
var ERROR = '';
var BUSY = false;

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* private mode */ } }

/* ── server calls ─────────────────────────────────────────────────────── */
function api(method, query, body) {
  return fetch(API + (query || ''), {
    method: method,
    headers: { 'Content-Type': 'application/json', 'X-Projects-Password': lsGet(PW_KEY) || '' },
    body: body ? JSON.stringify(body) : undefined
  }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (!r.ok) { var e = new Error(j.message || ('Request failed (' + r.status + ')')); e.code = j.error; e.status = r.status; throw e; }
      return j;
    });
  });
}
function load() {
  return api('GET').then(function (j) { ROWS = j.rows || []; THREADS = j.threads || null; STATE = 'ready'; });
}
function fail(e) {
  if (e.code === 'password') { lsDel(PW_KEY); STATE = 'password'; ERROR = 'That password didn\'t work — check it and try again.'; }
  else { STATE = 'error'; ERROR = e.message; }
  render();
}
/* run a change, then re-read the list so everyone's edits show */
function act(promise) {
  BUSY = true; render();
  return promise.then(load).then(function () { BUSY = false; render(); }, function (e) { BUSY = false; fail(e); });
}

/* ── one-time copy of the old browser-only data ───────────────────────── */
function migrateOld() {
  if (lsGet(MIGRATED_KEY)) { return Promise.resolve(); }
  var list = [], meta = {};
  try { list = JSON.parse(lsGet(OLD_LIST_KEY)) || []; } catch (e) { /* none */ }
  try { meta = JSON.parse(lsGet(OLD_META_KEY)) || {}; } catch (e) { /* none */ }
  var have = {};
  ROWS.forEach(function (r) { if (!r.seed_key) { have[r.title + '|' + (r.owner || '')] = 1; } });
  var jobs = [];
  list.forEach(function (it) {
    if (!it.title || have[it.title + '|' + (it.owner || '')]) { return; }   /* already copied by another tab */
    jobs.push(function () {
      return api('POST', '', { title: it.title, owner: it.owner, status: it.status, importance: it.importance,
                               due: it.due, prev_status: it.prevStatus, source: it.source });
    });
  });
  Object.keys(meta).forEach(function (k) {
    var m = meta[k];
    if (seedRow(k)) { return; }   /* the shared list already has edits for this rock — keep them */
    jobs.push(function () {
      return api('PUT', '', { seed_key: k, fields: { status: m.status, importance: m.importance, due: m.due, prev_status: m.prevStatus } });
    });
  });
  return jobs.reduce(function (p, job) { return p.then(job); }, Promise.resolve())
    .then(function () { lsSet(MIGRATED_KEY, new Date().toISOString()); return jobs.length ? load() : null; });
}

/* ── turning rows into table items ────────────────────────────────────── */
function seedRow(title) { return ROWS.filter(function (r) { return r.seed_key === title; })[0]; }
function l10Status(title) {
  var r = L10.rows.filter(function (x) { return x[0] === title; })[0];
  return r ? r[r.length - 1].text : '';
}
function extras(r) {
  r = r || {};
  return { notes: r.notes || '', isEvent: !!r.is_event, eventDate: r.event_date || '', eventAddress: r.event_address || '',
           eventTime: r.event_time || '', eventDuration: r.event_duration || 60, attendees: r.attendees || '' };
}
function seedItems() {
  return L10.rows.map(function (r) {
    var m = seedRow(r[0]) || {}, cur = r[r.length - 1];
    return Object.assign({ ref: 'seed:' + r[0], title: r[0], owner: 'Brian Reinhart', status: m.status || cur.text,
             statusOverride: m.status || '', importance: m.importance || '', due: m.due || '', prevStatus: m.prev_status || '',
             source: 'L10 dashboard · ' + L10.asOf, seed: true }, extras(m));
  });
}
function customItems() {
  return ROWS.filter(function (r) { return !r.seed_key; }).map(function (r) {
    return Object.assign({ ref: 'row:' + r.id, id: r.id, title: r.title, owner: r.owner || '', status: r.status || 'On-track',
             importance: r.importance || '', due: r.due || '', prevStatus: r.prev_status || '',
             source: r.source || 'added here', seed: false }, extras(r));
  });
}
function itemByRef(ref) {
  return seedItems().concat(customItems()).filter(function (x) { return x.ref === ref; })[0];
}
/* save one or more fields on either kind of item */
function saveFields(ref, fields) {
  if (ref.indexOf('seed:') === 0) { return api('PUT', '', { seed_key: ref.slice(5), fields: fields }); }
  return api('PATCH', '?id=' + encodeURIComponent(ref.slice(4)), fields);
}

function isDone(status) { return /^(done|complete)/i.test(status || ''); }
function tagFor(status) {
  var s = status.toLowerCase().split(' (')[0];
  if (s.indexOf('off') === 0) { return 'lo'; }
  if (s === 'on-track' || s === 'complete' || s === 'done') { return 'hi'; }
  return 'eq';
}
function fmtDate(iso) {
  if (!iso) { return ''; }
  var d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function mapLink(addr) {
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(addr);
}

function chips(items) {
  var counts = {};
  items.forEach(function (i) { var k = i.status.split(' (')[0]; counts[k] = (counts[k] || 0) + 1; });
  var hot = items.filter(function (i) { return i.importance === 'Hot' && !isDone(i.status); }).length;
  var done = items.filter(function (i) { return isDone(i.status); }).length;
  var events = items.filter(function (i) { return i.isEvent && !isDone(i.status); }).length;
  var s = '<div class="chips"><span class="c">' + items.length + ' items</span>' +
          '<span class="c">' + (items.length - done) + ' open · ' + done + ' done</span>' +
          (hot ? '<span class="c" style="color:#C0492B">' + hot + ' Hot</span>' : '') +
          (events ? '<span class="c">' + events + ' upcoming event' + (events === 1 ? '' : 's') + '</span>' : '');
  STATUSES.concat(['Done']).forEach(function (st) {
    if (counts[st]) { s += '<span class="c">' + counts[st] + ' ' + esc(st) + '</span>'; }
  });
  return s + '</div>';
}

function rowsHtml(items) {
  var s = '';
  items.forEach(function (it) {
    var ref = esc(it.ref), done = isDone(it.status), dis = BUSY ? ' disabled' : '';
    var checkCell = '<input type="checkbox" class="donechk" data-ref="' + ref + '"' + (done ? ' checked' : '') + dis +
      ' aria-label="Mark ' + esc(it.title) + ' done">';
    var item = '<button type="button" class="ptitle" data-edit="' + ref + '">' + esc(it.title) + '</button>';
    if (it.notes) { item += '<div class="pnotes">' + esc(it.notes) + '</div>'; }
    var nC = commentsFor(it.ref).length, nA = attachmentsFor(it.ref).length;
    if (nC || nA) {
      item += '<div class="pmeta">' + (nC ? '<button type="button" class="pmeta-b" data-edit="' + ref + '" data-tab="disc">' +
        nC + ' comment' + (nC === 1 ? '' : 's') + '</button>' : '') +
        (nA ? '<button type="button" class="pmeta-b" data-edit="' + ref + '" data-tab="files">' + nA + ' file' +
        (nA === 1 ? '' : 's') + ' &amp; link' + (nA === 1 ? '' : 's') + '</button>' : '') + '</div>';
    }
    if (it.isEvent) {
      var invited = emailList(it.attendees).length;
      item += '<div class="pevent"><span class="tag eq">Event' + (it.eventDate ? ' · ' + esc(fmtDate(it.eventDate)) : '') +
        (it.eventTime ? ' · ' + esc(fmtTime(it.eventTime)) : '') + '</span>' +
        (invited ? ' <span class="pinv">' + invited + ' invited</span>' : '') +
        (it.eventAddress ? ' <a href="' + esc(mapLink(it.eventAddress)) + '" target="_blank" rel="noopener">' + esc(it.eventAddress) + '</a>' : '') +
        (it.eventDate && it.eventTime ? ' · <a href="' + esc(teamsLink(itemMeeting(it))) + '" target="_blank" rel="noopener">Teams invite</a>' : '') +
        '</div>';
    }
    s += '<tr class="' + (done ? 'pdone' : '') + '">' +
      '<td class="pchk">' + checkCell + '</td>' +
      '<td class="pitem">' + item + '</td>' +
      '<td>' + esc(it.owner || '—') + '</td>' +
      '<td><span class="tag ' + tagFor(it.status) + '">' + esc(it.status) + '</span></td>' +
      '<td>' + (it.importance ? '<span class="tag ' + it.importance.toLowerCase() + '">' + esc(it.importance) + '</span>' : '—') + '</td>' +
      '<td style="white-space:nowrap">' + (it.due ? esc(fmtDate(it.due)) : '—') + '</td>' +
      '<td><button type="button" class="btn ghost pedit" data-edit="' + ref + '"' + dis + '>Edit</button></td>' +
    '</tr>';
  });
  return s;
}

/* ── Teams / Outlook hand-off ──────────────────────────────────────────────
   Both buttons open Microsoft's own "new meeting" form already filled in;
   the person reviews it and clicks Send there, so invites go out from their
   own calendar under their own login. Nothing is sent from this site.
   Times use this browser's time zone (Phoenix for the team).              */
var DURATIONS = [15, 30, 45, 60, 90, 120, 180, 240];
function pad(n) { return (n < 10 ? '0' : '') + n; }
/* local date + time (+ minutes) → ISO 8601 with this browser's UTC offset */
function isoLocal(date, time, plusMin) {
  var d = new Date(date + 'T' + time + ':00');
  d = new Date(d.getTime() + (plusMin || 0) * 60000);
  var off = -d.getTimezoneOffset(), sign = off >= 0 ? '+' : '-';
  off = Math.abs(off);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' +
         pad(d.getMinutes()) + ':00' + sign + pad(Math.floor(off / 60)) + ':' + pad(off % 60);
}
function emailList(s) {
  var seen = {};
  return String(s || '').split(/[\s,;]+/).filter(function (a) {
    var k = a.toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(a) || seen[k]) { return false; }
    seen[k] = 1; return true;
  });
}
function meetingBody(m) {
  var body = (m.notes || '').slice(0, 1200);
  if (m.address) { body = 'Location: ' + m.address + (body ? '\n\n' + body : ''); }
  return body;
}
function teamsLink(m) {
  var start = isoLocal(m.date, m.time), end = isoLocal(m.date, m.time, m.duration);
  return 'https://teams.microsoft.com/l/meeting/new?subject=' + encodeURIComponent(m.title) +
    '&startTime=' + encodeURIComponent(start) + '&endTime=' + encodeURIComponent(end) +
    (m.attendees.length ? '&attendees=' + encodeURIComponent(m.attendees.join(',')) : '') +
    '&content=' + encodeURIComponent(meetingBody(m));
}
function outlookLink(m) {
  var q = 'path=%2Fcalendar%2Faction%2Fcompose&rru=addevent&subject=' + encodeURIComponent(m.title) +
    (m.address ? '&location=' + encodeURIComponent(m.address) : '') +
    '&body=' + encodeURIComponent(meetingBody(m)) +
    (m.attendees.length ? '&to=' + encodeURIComponent(m.attendees.join(',')) : '');
  if (m.time) {
    q += '&startdt=' + encodeURIComponent(isoLocal(m.date, m.time)) + '&enddt=' + encodeURIComponent(isoLocal(m.date, m.time, m.duration));
  } else {
    q += '&allday=true&startdt=' + m.date + '&enddt=' + m.date;
  }
  return 'https://outlook.office.com/calendar/0/deeplink/compose?' + q;
}
function itemMeeting(it) {
  return { title: it.title, date: it.eventDate, time: it.eventTime, duration: it.eventDuration || 60,
           address: it.eventAddress, notes: it.notes, attendees: emailList(it.attendees) };
}
function fmtTime(t) {
  if (!t) { return ''; }
  var h = +t.slice(0, 2), m = t.slice(3);
  return (h % 12 || 12) + ':' + m + (h < 12 ? ' AM' : ' PM');
}

/* ── the add / edit popover ───────────────────────────────────────────── */
var MODAL_REF = null;   /* null = adding a new project */

function modalEl() {
  var d = document.getElementById('pmodal');
  if (!d) {
    d = document.createElement('dialog');
    d.id = 'pmodal';
    d.setAttribute('aria-labelledby', 'pm-title');
    document.body.appendChild(d);
    /* click on the dimmed backdrop closes it */
    d.addEventListener('click', function (e) { if (e.target === d) { closeModal(); } });
  }
  return d;
}
function openModal(ref, tab) {
  MODAL_REF = ref || null;
  var it = ref ? itemByRef(ref) : { title: '', owner: '', status: 'On-track', importance: '', due: '', notes: '',
                                    isEvent: false, eventDate: '', eventAddress: '', seed: false };
  var seed = !!it.seed;
  var statusOpts = seed
    ? '<option value="">L10 status: ' + esc(l10Status(it.title)) + '</option>' +
      STATUSES.map(function (s) { return '<option' + (s === it.statusOverride ? ' selected' : '') + '>' + s + '</option>'; }).join('')
    : STATUSES.map(function (s) { return '<option' + (s === it.status ? ' selected' : '') + '>' + s + '</option>'; }).join('');
  var d = modalEl();
  d.innerHTML =
    '<div class="pm">' +
      '<div class="pm-head"><h3 id="pm-title">' + (ref ? esc(it.title) : 'New project') + '</h3>' +
        '<button type="button" class="pm-x" id="pm-close" aria-label="Close">×</button></div>' +
      (seed ? '<p class="pm-sub">L10 rock · ' + esc(it.source) + '. The title and owner come from the L10 dashboard.</p>' : '') +
      (ref ? '<div class="pm-tabs" role="tablist">' +
        '<button type="button" role="tab" class="pm-tab" data-pane="details" aria-selected="true">Details</button>' +
        '<button type="button" role="tab" class="pm-tab" data-pane="disc" aria-selected="false">Discussion <span id="pm-nc"></span></button>' +
        '<button type="button" role="tab" class="pm-tab" data-pane="files" aria-selected="false">Files &amp; links <span id="pm-na"></span></button>' +
        '</div>' : '') +
    '<form method="dialog" id="pm-form" novalidate>' +
      '<div class="pm-grid">' +
        '<label class="pm-f pm-wide">Project / item' +
          '<input type="text" id="pm-t" maxlength="300" value="' + esc(it.title) + '"' + (seed ? ' readonly' : '') +
          ' placeholder="e.g. Q4 video content calendar" required></label>' +
        '<label class="pm-f">Owner<input type="text" id="pm-o" maxlength="120" value="' + esc(it.owner) + '"' +
          (seed ? ' readonly' : '') + ' placeholder="e.g. Brian Reinhart"></label>' +
        '<label class="pm-f">Status<select id="pm-s">' + statusOpts + '</select></label>' +
        '<label class="pm-f">Importance<select id="pm-i"><option value="">—</option>' +
          IMPORTANCE.map(function (v) { return '<option' + (v === it.importance ? ' selected' : '') + '>' + v + '</option>'; }).join('') +
        '</select></label>' +
        '<label class="pm-f">Due date<input type="date" id="pm-d" value="' + esc(it.due) + '"></label>' +
        '<label class="pm-f pm-wide">Notes &amp; details<textarea id="pm-n" rows="5" maxlength="4000" ' +
          'placeholder="Anything the team should know — scope, next steps, contacts, links…">' + esc(it.notes) + '</textarea></label>' +
        '<label class="pm-check pm-wide"><input type="checkbox" id="pm-e"' + (it.isEvent ? ' checked' : '') + '> This is an event or meeting</label>' +
        '<div class="pm-event pm-wide" id="pm-ev"' + (it.isEvent ? '' : ' hidden') + '>' +
          '<label class="pm-f">Event date<input type="date" id="pm-ed" value="' + esc(it.eventDate) + '"></label>' +
          '<label class="pm-f">Start time<input type="time" id="pm-et" step="900" value="' + esc(it.eventTime) + '"></label>' +
          '<label class="pm-f">Length<select id="pm-du">' +
            DURATIONS.map(function (n) {
              return '<option value="' + n + '"' + (n === (it.eventDuration || 60) ? ' selected' : '') + '>' +
                (n < 60 ? n + ' min' : (n / 60) + ' hr' + (n > 60 ? 's' : '')) + '</option>';
            }).join('') + '</select></label>' +
          '<label class="pm-f pm-ev-wide">Address<input type="text" id="pm-ea" maxlength="300" value="' + esc(it.eventAddress) + '" ' +
            'placeholder="e.g. Desert Willow Conference Center, 4340 E Cotton Center Blvd, Phoenix — or Teams"></label>' +
          '<label class="pm-f pm-ev-wide">Invitees<textarea id="pm-at" rows="2" maxlength="4000" ' +
            'placeholder="name@sanctuaryrc.com, partner@example.org — separate with commas">' + esc(it.attendees) + '</textarea></label>' +
          '<div class="pm-ev-wide pm-meet">' +
            '<button type="button" class="btn pm-teams" id="pm-teams">Schedule Teams meeting</button>' +
            '<button type="button" class="btn pm-cancel" id="pm-outlook">Add to Outlook calendar</button>' +
            '<p class="pm-hint">Opens Teams or Outlook with everything filled in. Review it and click <b>Send</b> there — ' +
            'invites go out from your own calendar. Save here too so the team sees the event.</p>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="pm-err" id="pm-err" role="alert" hidden></div>' +
      '<div class="pm-foot">' +
        (ref && !seed ? '<button type="button" class="btn ghost" id="pm-del">Remove project</button>' : '<span></span>') +
        '<div><button type="button" class="btn pm-cancel" id="pm-cancel">Cancel</button> ' +
        '<button type="submit" class="btn" id="pm-save">' + (ref ? 'Save changes' : 'Add project') + '</button></div>' +
      '</div>' +
    '</form>' +
    (ref ? '<div class="pm-pane" id="pm-disc" hidden></div><div class="pm-pane" id="pm-files" hidden></div>' : '') +
    '</div>';

  document.getElementById('pm-e').addEventListener('change', function () {
    document.getElementById('pm-ev').hidden = !this.checked;
    if (this.checked) { document.getElementById('pm-ed').focus(); }
  });
  document.getElementById('pm-form').addEventListener('input', function () { modalError(''); });
  document.getElementById('pm-teams').addEventListener('click', function () { openMeeting('teams'); });
  document.getElementById('pm-outlook').addEventListener('click', function () { openMeeting('outlook'); });
  document.getElementById('pm-close').addEventListener('click', closeModal);
  document.getElementById('pm-cancel').addEventListener('click', closeModal);
  document.getElementById('pm-form').addEventListener('submit', function (e) { e.preventDefault(); saveModal(); });
  var del = document.getElementById('pm-del');
  if (del) {
    del.addEventListener('click', function () {
      if (!confirm('Remove this project for everyone?')) { return; }
      modalWork(api('DELETE', '?id=' + encodeURIComponent(it.id)));
    });
  }
  [].forEach.call(d.querySelectorAll('.pm-tab'), function (b) {
    b.addEventListener('click', function () { showPane(this.getAttribute('data-pane')); });
  });
  if (typeof d.showModal === 'function') { d.showModal(); } else { d.setAttribute('open', ''); }
  if (ref) { renderDisc(); renderFiles(); }
  if (ref && tab && tab !== 'details') { showPane(tab); } else { document.getElementById(seed ? 'pm-s' : 'pm-t').focus(); }
}

/* ── discussion + files tabs inside the popover ───────────────────────── */
function commentsFor(ref) { return THREADS ? THREADS.comments.filter(function (c) { return c.project_key === ref; }) : []; }
function attachmentsFor(ref) { return THREADS ? THREADS.attachments.filter(function (a) { return a.project_key === ref; }) : []; }
function myName() { return lsGet(NAME_KEY) || ''; }
function when(ts) {
  var d = new Date(ts);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ', ' +
         d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}
function fileSize(n) {
  if (!n) { return ''; }
  return n < 1024 * 1024 ? Math.max(1, Math.round(n / 1024)) + ' KB' : (n / 1048576).toFixed(1) + ' MB';
}
function showPane(name) {
  var d = document.getElementById('pmodal');
  [].forEach.call(d.querySelectorAll('.pm-tab'), function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-pane') === name)); });
  document.getElementById('pm-form').hidden = name !== 'details';
  document.getElementById('pm-disc').hidden = name !== 'disc';
  document.getElementById('pm-files').hidden = name !== 'files';
  var focus = { details: 'pm-o', disc: 'pd-body', files: 'pf-url' }[name];
  var el = document.getElementById(focus);
  if (el && !el.readOnly) { el.focus(); }
}
function tabCounts() {
  var nc = commentsFor(MODAL_REF).length, na = attachmentsFor(MODAL_REF).length;
  var c = document.getElementById('pm-nc'), a = document.getElementById('pm-na');
  if (c) { c.textContent = nc ? '(' + nc + ')' : ''; }
  if (a) { a.textContent = na ? '(' + na + ')' : ''; }
}
function notReady(el) {
  el.innerHTML = '<div class="pm-note">Discussion and files need two new tables and a storage bucket in Supabase. ' +
    'Run the setup SQL from the top of <code>api/projects.js</code>, then reload.</div>';
}
/* run a thread/file action, refresh the data, redraw the pane and the table behind */
function paneWork(promise, redraw, errEl) {
  return promise.then(load).then(function () { redraw(); tabCounts(); render(); }, function (e) {
    if (e.code === 'password') { closeModal(); fail(e); return; }
    if (errEl) { errEl.textContent = e.message; errEl.hidden = false; }
  });
}

function renderDisc() {
  var el = document.getElementById('pm-disc');
  if (!el) { return; }
  if (!THREADS) { notReady(el); tabCounts(); return; }
  var list = commentsFor(MODAL_REF);
  el.innerHTML =
    '<div class="thread" id="pd-list">' + (list.length ? list.map(function (c) {
      return '<div class="msg"><div class="msg-h"><b>' + esc(c.author || 'Someone') + '</b><span>' + esc(when(c.created_at)) + '</span>' +
        '<button type="button" class="msg-x" data-cdel="' + esc(c.id) + '" aria-label="Delete comment">×</button></div>' +
        '<div class="msg-b">' + esc(c.body) + '</div></div>';
    }).join('') : '<p class="pm-empty">No messages yet. Ask a question, flag missing information, or post an update.</p>') + '</div>' +
    '<form class="composer" id="pd-form">' +
      (myName() ? '' : '<label class="pm-f">Your name<input type="text" id="pd-name" maxlength="80" placeholder="Shown with your messages"></label>') +
      '<label class="pm-f">Message<textarea id="pd-body" rows="3" maxlength="4000" placeholder="e.g. Not enough info to start — who is the contact at AzCA?"></textarea></label>' +
      '<div class="pm-err" id="pd-err" hidden></div>' +
      '<div class="composer-f"><span class="fine">' + (myName() ? 'Posting as <b>' + esc(myName()) + '</b> · ' +
        '<a href="#" id="pd-rename">change</a>' : 'Everyone with the team password can see this thread.') + '</span>' +
      '<button type="submit" class="btn" id="pd-send">Send</button></div>' +
    '</form>';
  var listEl = document.getElementById('pd-list');
  listEl.scrollTop = listEl.scrollHeight;
  var err = document.getElementById('pd-err');
  document.getElementById('pd-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var nameEl = document.getElementById('pd-name');
    if (nameEl) {
      if (!nameEl.value.trim()) { err.textContent = 'Add your name so the team knows who wrote it.'; err.hidden = false; nameEl.focus(); return; }
      lsSet(NAME_KEY, nameEl.value.trim());
    }
    var body = document.getElementById('pd-body').value.trim();
    if (!body) { document.getElementById('pd-body').focus(); return; }
    document.getElementById('pd-send').disabled = true;
    paneWork(api('POST', '?resource=comment', { project_key: MODAL_REF, author: myName(), body: body }), function () {
      renderDisc(); document.getElementById('pd-body').focus();
    }, err).then(function () { var b = document.getElementById('pd-send'); if (b) { b.disabled = false; } });
  });
  document.getElementById('pd-body').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); document.getElementById('pd-send').click(); }
  });
  var rn = document.getElementById('pd-rename');
  if (rn) { rn.addEventListener('click', function (e) { e.preventDefault(); lsDel(NAME_KEY); renderDisc(); document.getElementById('pd-name').focus(); }); }
  [].forEach.call(el.querySelectorAll('[data-cdel]'), function (b) {
    b.addEventListener('click', function () {
      if (!confirm('Delete this message for everyone?')) { return; }
      paneWork(api('DELETE', '?resource=comment&id=' + encodeURIComponent(this.getAttribute('data-cdel'))), renderDisc, err);
    });
  });
  tabCounts();
}

function renderFiles() {
  var el = document.getElementById('pm-files');
  if (!el) { return; }
  if (!THREADS) { notReady(el); tabCounts(); return; }
  var list = attachmentsFor(MODAL_REF);
  el.innerHTML =
    '<ul class="files">' + (list.length ? list.map(function (a) {
      var meta = [a.kind === 'file' ? fileSize(a.size_bytes) : '', a.added_by || '', when(a.created_at)].filter(Boolean).join(' · ');
      var open = a.kind === 'link'
        ? '<a href="' + esc(a.url) + '" target="_blank" rel="noopener noreferrer">' + esc(a.title || a.url) + '</a>'
        : '<button type="button" class="file-dl" data-dl="' + esc(a.id) + '">' + esc(a.title) + '</button>';
      return '<li><span class="ftype">' + (a.kind === 'link' ? 'Link' : 'File') + '</span><div class="fmain">' + open +
        '<span class="fmeta">' + esc(meta) + '</span></div>' +
        '<button type="button" class="msg-x" data-adel="' + esc(a.id) + '" aria-label="Remove">×</button></li>';
    }).join('') : '<li class="pm-empty">Nothing attached yet. Add a link (Drive, Canva, a brief) or upload a file.</li>') + '</ul>' +
    '<div class="pm-err" id="pf-err" hidden></div>' +
    '<form class="addlink" id="pf-link">' +
      '<label class="pm-f">Link<input type="url" id="pf-url" maxlength="2000" placeholder="https://…"></label>' +
      '<label class="pm-f">Label (optional)<input type="text" id="pf-title" maxlength="200" placeholder="e.g. Event brief in Drive"></label>' +
      '<button type="submit" class="btn">Add link</button>' +
    '</form>' +
    '<div class="upload"><label class="btn pm-cancel" for="pf-file">Upload a file</label>' +
      '<input type="file" id="pf-file" class="vh"><span class="fine" id="pf-status">Up to 25 MB. Files are private to the team.</span></div>';
  var err = document.getElementById('pf-err');
  document.getElementById('pf-link').addEventListener('submit', function (e) {
    e.preventDefault();
    var url = document.getElementById('pf-url').value.trim();
    if (!/^https?:\/\//i.test(url)) { err.textContent = 'Links must start with http:// or https://'; err.hidden = false; return; }
    paneWork(api('POST', '?resource=link', { project_key: MODAL_REF, url: url, title: document.getElementById('pf-title').value.trim(), added_by: myName() || null }),
      renderFiles, err);
  });
  document.getElementById('pf-file').addEventListener('change', function () {
    var f = this.files[0], status = document.getElementById('pf-status');
    if (!f) { return; }
    if (f.size > 25 * 1024 * 1024) { err.textContent = 'That file is ' + fileSize(f.size) + '; the limit is 25 MB.'; err.hidden = false; return; }
    status.textContent = 'Uploading ' + f.name + '…';
    var job = api('POST', '?resource=upload', { project_key: MODAL_REF, filename: f.name, size: f.size }).then(function (sig) {
      var fd = new FormData();
      fd.append('cacheControl', '3600');
      fd.append('', f);
      return fetch(sig.uploadUrl, { method: 'PUT', headers: { 'x-upsert': 'false' }, body: fd }).then(function (r) {
        if (!r.ok) { throw new Error('Upload failed (' + r.status + '). Check the project-files bucket exists in Supabase.'); }
        return api('POST', '?resource=file', { project_key: MODAL_REF, title: f.name, storage_path: sig.path, size_bytes: f.size, added_by: myName() || null });
      });
    });
    paneWork(job, renderFiles, err).then(function () { var s2 = document.getElementById('pf-status'); if (s2 && /Uploading/.test(s2.textContent)) { s2.textContent = 'Upload failed.'; } });
  });
  [].forEach.call(el.querySelectorAll('[data-dl]'), function (b) {
    b.addEventListener('click', function () {
      /* the signed URL is sent as an attachment, so following it downloads the
         file without leaving this page */
      api('GET', '?resource=download&id=' + encodeURIComponent(this.getAttribute('data-dl'))).then(function (j) {
        var a = document.createElement('a');
        a.href = j.url; a.rel = 'noopener';
        document.body.appendChild(a); a.click(); a.remove();
      }, function (e) { err.textContent = e.message; err.hidden = false; });
    });
  });
  [].forEach.call(el.querySelectorAll('[data-adel]'), function (b) {
    b.addEventListener('click', function () {
      if (!confirm('Remove this for everyone?')) { return; }
      paneWork(api('DELETE', '?resource=attachment&id=' + encodeURIComponent(this.getAttribute('data-adel'))), renderFiles, err);
    });
  });
  tabCounts();
}
function closeModal() {
  var d = document.getElementById('pmodal');
  if (d && d.open) { if (typeof d.close === 'function') { d.close(); } else { d.removeAttribute('open'); } }
}
function modalError(msg) {
  var el = document.getElementById('pm-err');
  el.textContent = msg; el.hidden = !msg;
}
/* run a save from the popover: on success close and refresh, on failure keep it open with the message */
function modalWork(promise) {
  var btn = document.getElementById('pm-save');
  btn.disabled = true; btn.textContent = 'Saving…';
  modalError('');
  return promise.then(load).then(function () { closeModal(); render(); }, function (e) {
    if (e.code === 'password') { closeModal(); fail(e); return; }
    btn.disabled = false; btn.textContent = MODAL_REF ? 'Save changes' : 'Add project';
    modalError(e.message);
  });
}
/* build the hand-off from what is in the popover right now (saved or not) */
function openMeeting(kind) {
  var v = function (id) { return document.getElementById(id).value.trim(); };
  var title = v('pm-t'), date = v('pm-ed'), time = v('pm-et');
  var raw = v('pm-at'), list = emailList(raw);
  var bad = raw.split(/[\s,;]+/).filter(Boolean).filter(function (a) { return !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(a); });
  if (!title) { modalError('Give it a title first.'); document.getElementById('pm-t').focus(); return; }
  if (!date) { modalError('Add the event date first.'); document.getElementById('pm-ed').focus(); return; }
  if (kind === 'teams' && !time) { modalError('A Teams meeting needs a start time.'); document.getElementById('pm-et').focus(); return; }
  if (bad.length) { modalError('These don\'t look like email addresses: ' + bad.slice(0, 3).join(', ')); document.getElementById('pm-at').focus(); return; }
  modalError('');
  var m = { title: title, date: date, time: time, duration: +v('pm-du') || 60, address: v('pm-ea'), notes: v('pm-n'), attendees: list };
  window.open(kind === 'teams' ? teamsLink(m) : outlookLink(m), '_blank', 'noopener');
}
function saveModal() {
  var v = function (id) { return document.getElementById(id).value.trim(); };
  var isEvent = document.getElementById('pm-e').checked;
  var title = v('pm-t');
  if (!title) { modalError('Give the project a title.'); document.getElementById('pm-t').focus(); return; }
  if (isEvent && !v('pm-ed')) { modalError('Add the event date, or untick "This is an event".'); document.getElementById('pm-ed').focus(); return; }
  var fields = {
    importance: v('pm-i'), due: v('pm-d'), notes: v('pm-n'),
    is_event: isEvent, event_date: isEvent ? v('pm-ed') : null, event_address: isEvent ? v('pm-ea') : null,
    event_time: isEvent ? v('pm-et') : null, event_duration: isEvent ? (+v('pm-du') || 60) : null,
    attendees: isEvent ? v('pm-at') : null
  };
  var it = MODAL_REF ? itemByRef(MODAL_REF) : null;
  if (it && it.seed) {
    fields.status = v('pm-s') || null;           /* blank = follow the L10 status */
    return modalWork(saveFields(MODAL_REF, fields));
  }
  fields.status = v('pm-s');
  fields.owner = v('pm-o');
  if (it) { return modalWork(saveFields(MODAL_REF, fields)); }
  fields.title = title;
  fields.source = 'added here · ' + new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  return modalWork(api('POST', '', fields));
}

/* ── page states ──────────────────────────────────────────────────────── */
function passwordPanel() {
  return '<section>' +
    '<div class="eyebrow">Project tracker</div>' +
    '<h2 style="font-size:26px;margin:6px 0 0">Team password</h2>' +
    '<p class="lead">The project list is shared by the whole team. Enter the team password once — this browser will remember it.</p>' +
    (ERROR ? '<div class="warn">' + esc(ERROR) + '</div>' : '') +
    '<div class="card"><form class="addform" id="pwform" style="grid-template-columns:2fr auto">' +
      '<div class="f"><label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password" ' +
      'style="font-family:inherit;font-size:13.5px;padding:9px 11px;border:1px solid var(--line);border-radius:8px"></div>' +
      '<button class="btn" type="submit">Open projects</button>' +
    '</form></div></section>';
}
function messagePanel(title, body) {
  return '<section><div class="eyebrow">Project tracker</div>' +
    '<h2 style="font-size:26px;margin:6px 0 0">' + title + '</h2>' + body + '</section>';
}

function render() {
  var sub = 'Shared team list · L10 statuses as of the ' + esc(L10.asOf) + ' meeting';
  var body;
  if (STATE === 'loading') {
    body = messagePanel('Loading projects…', '<p class="lead">Fetching the shared list.</p>');
  } else if (STATE === 'password') {
    body = passwordPanel();
  } else if (STATE === 'error') {
    body = messagePanel('Projects unavailable',
      '<div class="warn">' + esc(ERROR) + '</div>' +
      '<p class="lead"><button class="btn" id="retry">Try again</button></p>');
  } else {
    /* open items first, ticked-off items sink to the bottom */
    var items = seedItems().concat(customItems()).sort(function (a, b) { return isDone(a.status) - isDone(b.status); });
    body =
      '<section>' +
        '<div class="eyebrow">Project tracker</div>' +
        '<h2 style="font-size:26px;margin:6px 0 0">Rocks &amp; projects</h2>' +
        '<p class="lead">Every marketing rock from the L10 dashboard with its latest reported status, plus the team\'s own ' +
        'projects. Click a title or <b>Edit</b> to add notes, a due date or event details; tick the box to mark it done. ' +
        'This list is shared — everyone with the team password sees the same items.' +
        (BUSY ? ' <b>Saving…</b>' : '') + '</p>' +
        '<div class="ptools">' + chips(items) +
          '<button type="button" class="btn" id="np-open"' + (BUSY ? ' disabled' : '') + '>+ New project</button></div>' +
        '<div class="tw"><table class="ptable"><thead><tr><th>Done</th><th>Item</th><th>Owner</th><th>Status</th>' +
        '<th>Importance</th><th>Due</th><th><span class="vh">Edit</span></th></tr></thead>' +
        '<tbody>' + rowsHtml(items) + '</tbody></table></div>' +
        '<p class="sub" style="margin-top:14px"><a href="#" id="signout">Forget the team password on this browser</a></p>' +
      '</section>';
  }

  document.getElementById('sheet').innerHTML =
    pageHeader('Project Tracking', 'Marketing rocks &amp; projects &nbsp;·&nbsp; Internal / Confidential', sub, 'projects') +
    body +
    pageFooter('L10 Leadership dashboard (Rocks sheet), ' + L10.asOf + ' meeting column · shared project list');
  applyDataLabels();
  wire();
}

/* ── event wiring ─────────────────────────────────────────────────────── */
function on(sel, ev, fn) {
  document.querySelectorAll(sel).forEach(function (el) { el.addEventListener(ev, fn); });
}
function wire() {
  on('#pwform', 'submit', function (e) {
    e.preventDefault();
    lsSet(PW_KEY, document.getElementById('pw').value);
    ERROR = ''; STATE = 'loading'; render(); start();
  });
  on('#retry', 'click', function () { STATE = 'loading'; render(); start(); });
  on('#signout', 'click', function (e) { e.preventDefault(); lsDel(PW_KEY); ERROR = ''; STATE = 'password'; render(); });

  on('#np-open', 'click', function () { openModal(null); });
  on('[data-edit]', 'click', function () { openModal(this.getAttribute('data-edit'), this.getAttribute('data-tab')); });
  on('.donechk', 'change', function () {
    var ref = this.getAttribute('data-ref'), it = itemByRef(ref);
    if (!it) { return; }
    if (this.checked) {
      act(saveFields(ref, { prev_status: it.status, status: 'Complete' }));
    } else if (it.seed) {
      /* untick a rock: fall back to its L10 status, or In Progress if L10 itself says Done */
      act(saveFields(ref, { status: isDone(l10Status(it.title)) ? 'In Progress' : null }));
    } else {
      act(saveFields(ref, { status: (!it.prevStatus || isDone(it.prevStatus)) ? 'In Progress' : it.prevStatus }));
    }
  });
}

function start() {
  if (lsGet(PW_KEY) === null) { STATE = 'password'; render(); return; }
  load().then(migrateOld).then(function () { render(); }, fail);
}
render();
start();
</script>
</body></html>
