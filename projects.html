<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanctuary Recovery Centers — Project Tracking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="report.css">
<style>
/* ── projects table ── */
.ptools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0 8px}
.ptools .chips{margin:0}
.ptable td{vertical-align:top}
.ptable .pchk input{width:18px;height:18px;cursor:pointer;margin-top:2px}
.ptable .pitem{min-width:240px;max-width:460px}
.ptitle{all:unset;cursor:pointer;font-weight:600;color:var(--ink);line-height:1.35}
.ptitle:hover{color:var(--blue);text-decoration:underline}
.ptitle:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:3px}
.pnotes{font-size:12.5px;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.pby{font-size:11.5px;color:var(--muted);margin-top:4px}
.pevent{font-size:12.5px;margin-top:6px}
.pevent a{color:var(--blue)}
.pdone{opacity:.6}
.pcancel{opacity:.5}
.pcancel .ptitle{text-decoration:line-through}
.ptable .pgrip{width:46px;white-space:nowrap;padding-right:0}
.pgrab{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:5px;cursor:grab;touch-action:none;user-select:none;
 padding:4px 6px;border-radius:6px;color:var(--muted);font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
.pgrab::before{content:"⋮⋮";letter-spacing:-3px;font-size:14px;color:#9fb0ba}
.pgrab:hover{background:var(--paper);color:var(--ink)}
.pgrab:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
tr.pdrag{background:#e8f4fb !important;box-shadow:0 6px 18px rgba(22,38,59,.18);position:relative;z-index:2}
tr.pdrag .pgrab{cursor:grabbing}
body.pdragging{cursor:grabbing;user-select:none}
.porder-msg{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
#pm-cancelproj{color:#C0492B}
.pdone .ptitle{text-decoration:line-through}
.pedit{color:var(--teal)!important}
.pedit:hover{background:#eef5f8!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ── add / edit popover ── */
#pmodal{border:0;padding:0;border-radius:16px;width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 32px);
  box-shadow:0 24px 60px rgba(22,38,59,.28);color:var(--ink);background:#fff}
#pmodal::backdrop{background:rgba(22,38,59,.42);backdrop-filter:blur(2px)}
.pm{padding:22px 24px 20px;font-family:Inter,sans-serif}
.pm-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pm-head h3{font-family:Fraunces,serif;font-size:22px;font-weight:600;margin:0}
.pm-x{all:unset;cursor:pointer;font-size:26px;line-height:1;color:var(--muted);padding:2px 8px;border-radius:8px}
.pm-x:hover{background:#f1f5f7;color:var(--ink)}
.pm-sub{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.pm-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin-top:18px}
.pm-wide{grid-column:1/-1}
.pm-f{display:flex;flex-direction:column;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.pm-f input,.pm-f select,.pm-f textarea{font-family:inherit;font-size:14px;text-transform:none;letter-spacing:0;font-weight:400;
  color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.pm-f textarea{resize:vertical;min-height:96px;line-height:1.45}
.pm-f input[readonly]{background:#f6f9fa;color:var(--muted)}
.pm-f input:focus,.pm-f select:focus,.pm-f textarea:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:transparent}
.pm-check{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;cursor:pointer;padding:10px 12px;
  border:1px solid var(--line);border-radius:10px;background:#fbfdfe}
.pm-check input{width:18px;height:18px;cursor:pointer}
.pm-event{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px 16px;padding:14px;border-radius:10px;background:#f3f8fb;border:1px solid #dbe8ef}
.pm-event[hidden]{display:none}
.pm-ev-wide{grid-column:1/-1}
.pm-meet{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pm-teams{background:#5B5FC7!important}
.pm-teams:hover{background:#4a4eb0!important}
.pm-hint{flex-basis:100%;margin:2px 0 0;font-size:12px;color:var(--muted);line-height:1.45}
.pinv{font-size:12px;color:var(--muted)}
.pm-err{margin-top:14px;padding:10px 12px;border-radius:9px;background:#fbeae6;color:#8f2f1b;font-size:13px}
.pm-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.pm-foot > div{display:flex;gap:8px}
.pm-cancel{background:transparent!important;color:var(--ink)!important;border:1px solid var(--line)!important}
.pm-cancel:hover{background:#f1f5f7!important}
/* ── messages in the popover ── */
#pmodal.wchat{width:min(1060px,calc(100vw - 32px))}
.pm-wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px}
.pm-chat{border-left:1px solid var(--line);background:#f8fbfc;display:flex;flex-direction:column;min-height:420px;max-height:calc(100vh - 32px)}
.pc-head{padding:22px 18px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pc-head h4{font-family:Fraunces,serif;font-size:18px;font-weight:600;margin:0}
.pc-head span{font-size:12px;color:var(--muted)}
.pc-list{flex:1;overflow:auto;padding:4px 18px 12px;display:flex;flex-direction:column;gap:10px}
.pc-empty{margin:auto 0;text-align:center;color:var(--muted);font-size:13px;line-height:1.5;padding:20px 6px}
.pc-m{max-width:88%;align-self:flex-start}
.pc-m.me{align-self:flex-end}
.pc-b{background:#fff;border:1px solid var(--line);border-radius:12px 12px 12px 4px;padding:8px 11px;font-size:14px;line-height:1.45;
  white-space:pre-wrap;overflow-wrap:anywhere}
.pc-m.me .pc-b{background:#2C5468;border-color:#2C5468;color:#fff;border-radius:12px 12px 4px 12px}
.pc-meta{font-size:11px;color:var(--muted);margin:3px 4px 0;display:flex;gap:8px}
.pc-m.me .pc-meta{justify-content:flex-end}
.pc-meta button{all:unset;cursor:pointer;color:var(--muted);text-decoration:underline}
.pc-tag{font-weight:700;color:#1C6E9A;background:#e4f1f8;border-radius:4px;padding:0 3px}
.pc-m.me .pc-tag{color:#fff;background:rgba(255,255,255,.18)}
.pc-m.atme .pc-b{border-color:#E17F55;box-shadow:0 0 0 2px rgba(225,127,85,.18)}
.pc-form{position:relative}
.pc-at{all:unset;box-sizing:border-box;cursor:pointer;height:38px;min-width:38px;padding:0 10px;border:1px solid var(--line);border-radius:8px;
  font-weight:700;color:var(--muted);text-align:center;font-size:15px}
.pc-at:hover{color:var(--blue);border-color:var(--blue)}
.pc-at:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.pc-pick{position:absolute;left:14px;right:14px;bottom:calc(100% - 4px);background:#fff;border:1px solid var(--line);border-radius:10px;
  box-shadow:0 8px 24px rgba(1,23,59,.14);padding:4px;margin:0;list-style:none;max-height:220px;overflow:auto;z-index:5}
.pc-pick li{padding:7px 10px;border-radius:7px;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:8px}
.pc-pick li[aria-selected="true"],.pc-pick li:hover{background:#eef5f9}
.pc-pick .av{width:22px;height:22px;border-radius:50%;background:#2C5468;color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;flex:none}
.pc-pick .none{color:var(--muted);cursor:default;background:none!important}
.pc-sent{font-size:12px;color:#1d7a4d;padding:0 16px 10px;background:#fff}
.pc-form{border-top:1px solid var(--line);padding:12px 14px;display:flex;gap:8px;align-items:flex-end;background:#fff}
.pc-form textarea{flex:1;font-family:Inter,sans-serif;font-size:14px;line-height:1.4;resize:none;border:1px solid var(--line);
  border-radius:10px;padding:9px 11px;min-height:42px;max-height:140px}
.pc-form textarea:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:transparent}
.pc-note{padding:14px 18px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);background:#fff}
.pc-note a{color:var(--blue);font-weight:600}
.pmsg{display:inline-flex;align-items:center;gap:4px;margin-left:8px;font-size:11.5px;font-weight:700;color:var(--muted);
  padding:1px 8px;border-radius:20px;background:#eef3f6;vertical-align:2px}
.pmsg.new{background:#E17F55;color:#fff}
@media (max-width:860px){
  .pm-wrap{grid-template-columns:1fr}
  .pm-chat{border-left:0;border-top:1px solid var(--line);max-height:none;min-height:0}
  .pc-list{max-height:340px}
}
@media (max-width:600px){
  .pm{padding:18px 16px}
  .pm-grid,.pm-event{grid-template-columns:1fr}
  .pm-foot{flex-direction:column-reverse;align-items:stretch}
  .pm-foot > div{justify-content:flex-end}
}
/* ── Tracker | Analytics tabs ── */
.pv-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0}
.pv-tabs button{all:unset;cursor:pointer;font-size:12.5px;font-weight:700;padding:7px 16px;border-radius:20px;border:1px solid var(--line);background:var(--paper);color:var(--muted)}
.pv-tabs button[aria-selected="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.pv-tabs button:focus-visible,.an-row:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.an-filters{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 4px}
.an-filters .f{display:flex;flex-direction:column;gap:4px}
.an-filters label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.an-k{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:16px 0 6px}
.an-head{font-size:15px;margin:10px 0 0}
.an-bars{display:flex;flex-direction:column;gap:6px;margin:8px 0 4px}
.an-row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(150px,230px) 1fr 64px;gap:12px;align-items:center;cursor:pointer;padding:5px 6px;border-radius:7px}
.an-row:hover{background:#fff}
.an-row[aria-pressed="true"]{background:#fff;box-shadow:inset 3px 0 0 var(--coral)}
.an-row .lab{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.an-row .lab i{width:10px;height:10px;border-radius:2px;flex:0 0 auto}
.an-row .track{display:flex;height:22px;border-radius:4px;overflow:hidden;background:var(--line)}
.an-row .track span{display:block;height:100%}
.an-row .n{font-size:13px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.an-row .n small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.an-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0 0}
.an-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.an-list{list-style:none;padding:0;margin:8px 0 0}
.an-list li{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:baseline}
.an-list li:last-child{border-bottom:0}
.an-list .meta{font-size:12px;color:var(--muted);white-space:nowrap}
@media (max-width:900px){.an-k{grid-template-columns:repeat(3,1fr)}}
@media (max-width:720px){.an-k{grid-template-columns:1fr 1fr}.an-row{grid-template-columns:1fr 56px}.an-row .track{grid-column:1/-1;grid-row:2}.an-list li{grid-template-columns:1fr}}
@media (max-width:720px), (pointer:coarse){.pv-tabs button{min-height:40px;display:inline-flex;align-items:center}}
</style>

<body><div class="sheet" id="sheet"></div>
<script src="data.js"></script>
<script src="ui.js"></script>
<script src="project-themes.js"></script>
<script src="account.js"></script>
<script src="chat.js" defer></script>
<script>
/* ── project tracker ──────────────────────────────────────────────────────
   One shared list for the whole team, stored in Supabase through
   /api/projects (see api/projects.js). People sign in with their own
   account (account.js / account.html); the old shared team password still
   works as a fallback. Each project's popover carries a message thread
   (/api/messages) — new messages ring everyone else's bell.

   L10 rocks come from data.js (the L10 object — last column is the current
   status). Edits made here to a rock (tick-off, importance, date) are stored
   as a separate row keyed by the rock's title, so a new L10 import never
   loses them. Projects added here are ordinary rows.

   The first time a browser connects, anything it saved under the old
   browser-only tracker (localStorage) is copied up once.                  */
var STATUSES = ['On-track', 'Off Track', 'In Progress', 'On Hold', 'New', 'Complete', 'Cancelled'];
var IMPORTANCE = ['Hot', 'Med', 'Cold'];
var API = '/api/projects';
var PW_KEY = 'src_projects_pw';
var OLD_LIST_KEY = 'src_projects_v1';       /* old browser-only store */
var OLD_META_KEY = 'src_projects_meta_v1';
var MIGRATED_KEY = 'src_projects_migrated_v1';

var ROWS = [];          /* rows from the server */
var STAFF = false;      /* staff (no Reports access) see only their own requests, read-only */
var STATE = 'loading';  /* loading | signin | password | error | ready */
var MSGS = {};          /* ref → { total, unread } from /api/messages?summary=1 */
var CHAT_POLL = null;   /* refreshes the open popover's thread */
var ERROR = '';
var BUSY = false;
var PVIEW = location.hash === '#analytics' ? 'analytics' : 'tracker';   /* Tracker | Analytics */
var AN = { owner: '', period: 'all', theme: '' };                       /* analytics filters */

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* private mode */ } }

/* ── server calls ─────────────────────────────────────────────────────── */
function api(method, query, body) {
  return fetch(API + (query || ''), {
    method: method,
    credentials: 'same-origin',
    headers: lsGet(PW_KEY) !== null ? { 'Content-Type': 'application/json', 'X-Projects-Password': lsGet(PW_KEY) }
                                    : { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (!r.ok) { var e = new Error(j.message || ('Request failed (' + r.status + ')')); e.code = j.error; e.status = r.status; throw e; }
      return j;
    });
  });
}
function load() {
  return Promise.all([api('GET'), loadMsgSummary()]).then(function (r) { ROWS = r[0].rows || []; STAFF = !!r[0].staff; STATE = 'ready'; });
}
/* message counts per project — only for people signed in with an account */
function loadMsgSummary() {
  if (!SM.me) { MSGS = {}; return Promise.resolve(); }
  return SM.api('GET', '/api/messages?summary=1').then(function (j) {
    MSGS = {};
    (j.summary || []).forEach(function (m) { MSGS[m.project_ref] = { total: +m.total, unread: +m.unread }; });
  }, function () { MSGS = {}; });
}
function fail(e) {
  if (e.code === 'password' || e.code === 'signin') {
    var hadPw = lsGet(PW_KEY) !== null;
    lsDel(PW_KEY);
    STATE = 'signin';
    ERROR = hadPw ? 'That team password didn\'t work — sign in with your account instead.' : '';
  }
  else { STATE = 'error'; ERROR = e.message; }
  render();
}
/* run a change, then re-read the list so everyone's edits show */
function act(promise) {
  BUSY = true; render();
  return promise.then(load).then(function () { BUSY = false; render(); }, function (e) { BUSY = false; fail(e); });
}

/* ── one-time copy of the old browser-only data ───────────────────────── */
function migrateOld() {
  if (lsGet(MIGRATED_KEY)) { return Promise.resolve(); }
  var list = [], meta = {};
  try { list = JSON.parse(lsGet(OLD_LIST_KEY)) || []; } catch (e) { /* none */ }
  try { meta = JSON.parse(lsGet(OLD_META_KEY)) || {}; } catch (e) { /* none */ }
  var have = {};
  ROWS.forEach(function (r) { if (!r.seed_key) { have[r.title + '|' + (r.owner || '')] = 1; } });
  var jobs = [];
  list.forEach(function (it) {
    if (!it.title || have[it.title + '|' + (it.owner || '')]) { return; }   /* already copied by another tab */
    jobs.push(function () {
      return api('POST', '', { title: it.title, owner: it.owner, status: it.status, importance: it.importance,
                               due: it.due, prev_status: it.prevStatus, source: it.source });
    });
  });
  Object.keys(meta).forEach(function (k) {
    var m = meta[k];
    if (seedRow(k)) { return; }   /* the shared list already has edits for this rock — keep them */
    jobs.push(function () {
      return api('PUT', '', { seed_key: k, fields: { status: m.status, importance: m.importance, due: m.due, prev_status: m.prevStatus } });
    });
  });
  return jobs.reduce(function (p, job) { return p.then(job); }, Promise.resolve())
    .then(function () { lsSet(MIGRATED_KEY, new Date().toISOString()); return jobs.length ? load() : null; });
}

/* ── turning rows into table items ────────────────────────────────────── */
function seedRow(title) { return ROWS.filter(function (r) { return r.seed_key === title; })[0]; }
function l10Status(title) {
  var r = L10.rows.filter(function (x) { return x[0] === title; })[0];
  return r ? r[r.length - 1].text : '';
}
function extras(r) {
  r = r || {};
  var who = { addedBy: r.created_by_name || '', addedAt: r.created_at || '', editedBy: r.updated_by_name || '', editedAt: r.updated_at || '' };
  return Object.assign(who, { notes: r.notes || '', isEvent: !!r.is_event, eventDate: r.event_date || '', eventAddress: r.event_address || '',
           eventTime: r.event_time || '', eventDuration: r.event_duration || 60, attendees: r.attendees || '' });
}
/* "Added by Kim Aycock · Oct 21 · last change by Brian Reinhart, 2:14 PM" */
function whoLine(it, short) {
  var bits = [];
  if (it.addedBy && !it.seed) { bits.push('Added by ' + it.addedBy + (it.addedAt ? ' · ' + msgTime(it.addedAt) : '')); }
  var changed = it.editedBy && it.editedAt && Math.abs(Date.parse(it.editedAt) - Date.parse(it.addedAt || 0)) > 60000;
  if (changed && (it.seed || !short || it.editedBy !== it.addedBy)) {
    bits.push((bits.length ? 'last change by ' : 'Last change by ') + it.editedBy + (short ? '' : ', ' + msgTime(it.editedAt)));
  }
  return bits.join(short ? ' · ' : ' — ');
}
function seedItems() {
  return L10.rows.map(function (r) {
    var m = seedRow(r[0]) || {}, cur = r[r.length - 1];
    return Object.assign({ ref: 'seed:' + r[0], title: r[0], owner: 'Brian Reinhart', status: m.status || cur.text,
             statusOverride: m.status || '', importance: m.importance || '', due: m.due || '', prevStatus: m.prev_status || '',
             source: 'L10 dashboard · ' + L10.asOf, seed: true, rank: m.rank == null ? null : +m.rank }, extras(m));
  });
}
function customItems() {
  return ROWS.filter(function (r) { return !r.seed_key; }).map(function (r) {
    return Object.assign({ ref: 'row:' + r.id, id: r.id, title: r.title, owner: r.owner || '', status: r.status || 'On-track',
             importance: r.importance || '', due: r.due || '', prevStatus: r.prev_status || '',
             source: r.source || 'added here', seed: false, rank: r.rank == null ? null : +r.rank }, extras(r));
  });
}
function itemByRef(ref) {
  return seedItems().concat(customItems()).filter(function (x) { return x.ref === ref; })[0];
}
/* save one or more fields on either kind of item */
function saveFields(ref, fields) {
  if (ref.indexOf('seed:') === 0) { return api('PUT', '', { seed_key: ref.slice(5), fields: fields }); }
  return api('PATCH', '?id=' + encodeURIComponent(ref.slice(4)), fields);
}

function isDone(status) { return /^(done|complete)/i.test(status || ''); }
function isCancelled(status) { return /^cancel/i.test(status || ''); }
function isClosed(status) { return isDone(status) || isCancelled(status); }
/* tracker order: open items by priority (rank; unranked after, in list order), then done, then cancelled */
function byPriority(list) {
  return list.map(function (it, i) { return { it: it, i: i }; }).sort(function (a, b) {
    var ca = isCancelled(a.it.status) ? 2 : isDone(a.it.status) ? 1 : 0, cb = isCancelled(b.it.status) ? 2 : isDone(b.it.status) ? 1 : 0;
    if (ca !== cb) { return ca - cb; }
    if (!ca) {
      var ra = a.it.rank == null ? Infinity : +a.it.rank, rb = b.it.rank == null ? Infinity : +b.it.rank;
      if (ra !== rb) { return ra - rb; }
    }
    return a.i - b.i;
  }).map(function (x) { return x.it; });
}
function tagFor(status) {
  var s = status.toLowerCase().split(' (')[0];
  if (s.indexOf('off') === 0) { return 'lo'; }
  if (s === 'on-track' || s === 'complete' || s === 'done') { return 'hi'; }
  if (s.indexOf('cancel') === 0) { return 'eq'; }
  return 'eq';
}
function fmtDate(iso) {
  if (!iso) { return ''; }
  var d = new Date(iso + 'T12:00:00');

/* ── Teams / Outlook hand-off ──────────────────────────────────────────────
   Both buttons open Microsoft's own "new meeting" form already filled in;

/* ── @tagging ─────────────────────────────────────────────────────────────

        '<div class="an-legend"><span><i style="background:#2C5468"></i>Added</span><span><i style="background:#2E8B6F"></i>Finished</span></div>' +
        '<p class="an-head" style="font-size:13.5px"><b>' + esc(busiest ? monthLabel(busiest) + ' was the busiest month, with ' + months[busiest].added + ' items added.' : '') + '</b></p>'
        : '<div class="empty">Dates appear once items are added on this page.</div>', 'L10 rocks have no added date, so they count only toward totals, not months. "Finished" uses the date an item was last changed.')) +
    card('By theme', table(['Theme', 'Items', 'Share', 'Done', 'In progress', 'To do', 'Cancelled', 'Hot and open'], themes.map(function (t) {
      return ['<span style="display:inline-flex;align-items:center;gap:7px"><i style="width:9px;height:9px;border-radius:2px;display:inline-block;background:' + t.theme.color + '"></i>' + esc(t.theme.name) + '</span>',
        String(t.total), pct(t.total, n) + '%', String(t.done), String(t.doing), String(t.todo), String(t.cancelled), String(t.hot)];
    }), { numeric: function (i) { return i > 0; } }), 'Themes come from project-themes.js. To move an item, add a word to its title; to change a rule, edit that file.') +
    '</section>';
}
function kpiBox(lab, num, note) {
  return '<div class="kpi"><div class="lab">' + esc(lab) + '</div><div class="num">' + esc(String(num)) + '</div><div class="note">' + esc(note) + '</div></div>';
}

/* ── event wiring ─────────────────────────────────────────────────────── */
function on(sel, ev, fn) {
  document.querySelectorAll(sel).forEach(function (el) { el.addEventListener(ev, fn); });
}
function wire() {
  on('[data-pview]', 'click', function () {
    PVIEW = this.getAttribute('data-pview');
    history.replaceState(null, '', location.pathname + (PVIEW === 'analytics' ? '#analytics' : ''));
    render();
  });
  on('#an-owner', 'change', function () { AN.owner = this.value; AN.theme = ''; render(); });
  on('#an-period', 'change', function () { AN.period = this.value; AN.theme = ''; render(); });
  on('[data-antheme]', 'click', function () { var k = this.getAttribute('data-antheme'); AN.theme = AN.theme === k ? '' : k; render(); });
  on('#pwform', 'submit', function (e) {
    e.preventDefault();
    lsSet(PW_KEY, document.getElementById('pw').value);
    ERROR = ''; STATE = 'loading'; render(); start();
  });
  on('#retry', 'click', function () { STATE = 'loading'; render(); start(); });
  on('#signout', 'click', function (e) { e.preventDefault(); lsDel(PW_KEY); ERROR = ''; STATE = SM.me ? 'ready' : 'signin'; render(); });
  on('#siform', 'submit', function (e) {
    e.preventDefault();
    var btn = document.getElementById('si-go');
    btn.disabled = true; btn.textContent = 'Signing in…';
    SM.login(document.getElementById('si-email').value.trim(), document.getElementById('si-pw').value).then(function (u) {
      if (u.must_change_password) { location.href = 'account.html?next=projects.html#password'; return; }
      ERROR = ''; STATE = 'loading'; render(); start();
    }, function (err) { ERROR = err.message; render(); });
  });
  on('#use-pw', 'click', function (e) { e.preventDefault(); ERROR = ''; STATE = 'password'; render(); });
  on('#use-acct', 'click', function (e) { e.preventDefault(); ERROR = ''; STATE = 'signin'; render(); });

  on('#np-open', 'click', function () { openModal(null); });
  on('[data-edit]', 'click', function () { openModal(this.getAttribute('data-edit')); });
  wireReorder();
  on('.donechk', 'change', function () {
    var ref = this.getAttribute('data-ref'), it = itemByRef(ref);
    if (!it) { return; }
    if (this.checked) {
      act(saveFields(ref, { prev_status: it.status, status: 'Complete' }));
    } else if (it.seed) {
      /* untick a rock: fall back to its L10 status, or In Progress if L10 itself says Done */
      act(saveFields(ref, { status: isDone(l10Status(it.title)) ? 'In Progress' : null }));
    } else {
      act(saveFields(ref, { status: (!it.prevStatus || isDone(it.prevStatus)) ? 'In Progress' : it.prevStatus }));
    }
  });
}

/* ── drag-and-drop priority ─────────────────────────────────────────────
   Pointer events, so it works with a mouse, a finger or a pen. The row
   moves as you drag; letting go saves the order of the open rows for
   everyone. Keyboard: focus a handle and press the up/down arrows.        */
var DRAGGING = false;
function openRows() { return [].slice.call(document.querySelectorAll('#ptbody tr[data-open]')); }
function saveOrder() {
  var order = openRows().map(function (tr) { return tr.getAttribute('data-row'); });
  var msg = document.getElementById('porder-msg');
  if (msg) { msg.textContent = 'Saving the new order…'; }
  act(api('PUT', '?action=order', { order: order }));
}
function renumber() {
  openRows().forEach(function (tr, i) {
    var g = tr.querySelector('.pgrab');
    if (g) { g.textContent = i + 1; }
  });
}
function wireReorder() {
  document.querySelectorAll('.pgrab').forEach(function (h) {
    h.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') { return; }
      e.preventDefault();
      var tr = h.closest('tr'), rows = openRows(), i = rows.indexOf(tr);
      var j = e.key === 'ArrowUp' ? i - 1 : i + 1;
      if (j < 0 || j >= rows.length) { return; }
      if (e.key === 'ArrowUp') { rows[j].parentNode.insertBefore(tr, rows[j]); } else { rows[j].parentNode.insertBefore(tr, rows[j].nextSibling); }
      renumber(); h.focus();
      clearTimeout(wireReorder.t);
      wireReorder.t = setTimeout(function () { var ref = h.getAttribute('data-grip'); saveOrder(); wireReorder.refocus = ref; }, 700);
    });
    h.addEventListener('pointerdown', function (e) {
      if (e.button !== 0 || h.disabled) { return; }
      e.preventDefault();
      var tr = h.closest('tr'), startOrder = openRows().map(function (r) { return r.getAttribute('data-row'); }).join('|');
      DRAGGING = true; tr.classList.add('pdrag'); document.body.classList.add('pdragging');
      /* listen on the window, not the handle: moving the row in the page would
         drop a pointer capture on the handle and strand the drag */
      var id = e.pointerId;
      var move = function (ev) {
        if (ev.pointerId !== id) { return; }
        ev.preventDefault();
        var rows = openRows().filter(function (r) { return r !== tr; });
        var y = ev.clientY, before = null;
        for (var k = 0; k < rows.length; k++) {
          var b = rows[k].getBoundingClientRect();
          if (y < b.top + b.height / 2) { before = rows[k]; break; }
        }
        var tbody = tr.parentNode;
        if (before) { if (before !== tr.nextSibling) { tbody.insertBefore(tr, before); } }
        else if (rows.length) { var last = rows[rows.length - 1]; if (last.nextSibling !== tr) { tbody.insertBefore(tr, last.nextSibling); } }
        renumber();
        /* keep the row in view near the window edges */
        if (y < 60) { window.scrollBy(0, -12); } else if (y > innerHeight - 60) { window.scrollBy(0, 12); }
      };
      var up = function (ev) {
        if (ev && ev.pointerId !== id) { return; }
        window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
        tr.classList.remove('pdrag'); document.body.classList.remove('pdragging'); DRAGGING = false;
        var now = openRows().map(function (r) { return r.getAttribute('data-row'); }).join('|');
        if (now !== startOrder) { saveOrder(); }
      };
      window.addEventListener('pointermove', move, { passive: false }); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
    });
  });
  if (wireReorder.refocus) {
    var g = document.querySelector('.pgrab[data-grip="' + wireReorder.refocus.replace(/"/g, '\\"') + '"]');
    wireReorder.refocus = null;
    if (g) { g.focus(); }
  }
}

function start() {
  SM.ready.then(function (u) {
    if (!u && lsGet(PW_KEY) === null) { STATE = 'signin'; render(); return; }
    return load().then(migrateOld).then(function () { render(); openFromHash(); }, fail);
  });
}
/* alerts link to projects.html#open=<ref> */
function openFromHash() {
  var m = /^#open=(.+)$/.exec(location.hash);
  if (!m || STATE !== 'ready') { return; }
  var ref = decodeURIComponent(m[1]);
  history.replaceState(null, '', location.pathname);
  if (itemByRef(ref)) { openModal(ref); }
}
addEventListener('hashchange', function () {
  var v = location.hash === '#analytics' ? 'analytics' : (location.hash === '#tracker' ? 'tracker' : PVIEW);
  if (v !== PVIEW) { PVIEW = v; render(); }
  openFromHash();
});
/* refresh the row badges when the bell rings for a message */
setInterval(function () {
  if (STATE === 'ready' && SM.me && document.visibilityState === 'visible' && !(document.getElementById('pmodal') || {}).open) {
    loadMsgSummary().then(function () { if (!BUSY && !DRAGGING) { render(); } });
  }
}, 30000);
render();
start();
</script>
