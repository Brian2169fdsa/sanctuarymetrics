<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Sanctuary Recovery Centers — CP-AO Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="report.css">
<style>
.ca-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px}
.ca-tab{all:unset;box-sizing:border-box;cursor:pointer;padding:8px 15px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:13.5px;font-weight:600;color:var(--ink)}
.ca-tab[aria-selected="true"]{background:#16263B;border-color:#16263B;color:#fff}
.ca-tab:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ca-tab small{opacity:.7;font-weight:500;margin-left:4px}
.warnbox{border:1px solid #f1dca6;background:#fffaf0;border-radius:12px;padding:12px 16px;margin:0 0 16px;font-size:13.5px;line-height:1.55}
.warnbox b{color:#7a4b00}
.warnbox ul{margin:6px 0 0;padding-left:18px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;background:#eef3f6;color:#2C5468;white-space:nowrap}
.pill.p-invited,.pill.p-in_progress{background:#eef3f6;color:#2C5468}
.pill.p-needs_fix,.pill.p-cpao_correction_requested{background:#fff4e5;color:#8a5200}
.pill.p-ready_for_countersign{background:#fdeee6;color:#a8461c}
.pill.p-countersigned,.pill.p-queued_for_batch,.pill.p-remove_requested{background:#ece9fb;color:#4a3aa8}
.pill.p-sent_to_cpao,.pill.p-approved_training_assigned,.pill.p-training_complete{background:#e8f3fb;color:#14628a}
.pill.p-active{background:#e6f4ee;color:#1f6b4f}
.pill.p-denied,.pill.p-removed{background:#f1f1f1;color:#666}
.pill.ai-pass{background:#e6f4ee;color:#1f6b4f}.pill.ai-admin_review{background:#fff4e5;color:#8a5200}.pill.ai-fix_required{background:#fbeae6;color:#a3301a}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.filters button{all:unset;cursor:pointer;font-size:12px;font-weight:600;padding:5px 10px;border-radius:14px;border:1px solid var(--line);background:#fff}
.filters button[aria-pressed="true"]{background:#2C5468;color:#fff;border-color:#2C5468}
.tbl td,.tbl th{font-size:13px;vertical-align:top}
.tbl a.nm{font-weight:700;color:var(--ink);text-decoration:none}
.tbl a.nm:hover{text-decoration:underline}
.tbl .sm{font-size:12px;color:var(--muted)}
.tbl .next{font-weight:600;color:#a8461c}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 0;font-size:13px}
.bulk[hidden]{display:none}
.f2{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 14px}
.fl{display:flex;flex-direction:column;gap:5px;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fl input,.fl select,.fl textarea{font:400 14px Inter,sans-serif;text-transform:none;letter-spacing:0;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.fl.wide{grid-column:1/-1}
.ck{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink);font-weight:500}
.ck[hidden]{display:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.alt:hover{background:#f3f7fa}
.btn.warm{background:#C0572B}
.btn.warm:hover{background:#9c4522}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.note{padding:10px 12px;border-radius:9px;font-size:13.5px;margin:10px 0 0}
.note.err{background:#fbeae6;color:#8f2f1b}.note.ok{background:#e9f5ee;color:#1f5a37}
.note[hidden]{display:none}
.det{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;margin:0}
.dl dt{color:var(--muted)}.dl dd{margin:0;font-weight:600;word-break:break-word}
.reveal{all:unset;cursor:pointer;color:#14628a;font-size:12.5px;font-weight:700;margin-left:6px}
.reveal:focus-visible{outline:2px solid var(--blue)}
.sigimg{max-width:100%;height:60px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:4px}
.ai li{margin:0 0 6px;font-size:13.5px}
.linkbox{display:flex;gap:8px;margin-top:8px}
.linkbox input{flex:1;font:400 13px Inter,sans-serif;border:1px solid var(--line);border-radius:8px;padding:8px}
.sigpad{border:2px dashed #9fb3bf;border-radius:12px;background:#fff;max-width:560px;touch-action:none}
.sigpad canvas{display:block;width:100%;height:150px}
.dir{grid-column:1/-1;position:relative}
.dir input[type=search]{width:100%;box-sizing:border-box;font:400 15px Inter,sans-serif;border:1px solid #b9c7cf;border-radius:10px;padding:10px 12px;background:#fff}
.dir-list{list-style:none;margin:6px 0 0;padding:0;border:1px solid var(--line);border-radius:10px;background:#fff;max-height:300px;overflow:auto}
.dir-list li{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13.5px}
.dir-list li:last-child{border-bottom:0}
.dir-list li.on{opacity:.55}
.dir-list button{all:unset;cursor:pointer;flex:1;min-width:0}
.dir-list button:focus-visible{outline:2px solid var(--blue)}
.dir-list b{display:block}
.dir-list .sm{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.dir-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:13px}
.dir-bar[hidden]{display:none}
.back{display:inline-block;font-size:13px;font-weight:600;color:var(--blue);text-decoration:none;margin-bottom:10px}
.audit td{font-size:12.5px}
.fh{display:block;font:400 12px/1.4 Inter,sans-serif;text-transform:none;letter-spacing:0;color:var(--muted);margin-top:-1px}
.ck .fh{margin:2px 0 0}
.stg{min-width:150px}
.stg .sm{display:block}
.mini{display:flex;gap:2px;margin:5px 0 3px;max-width:150px}
.mini i{flex:1;height:5px;border-radius:2px;background:#dfe7ec}
.mini i.on{background:#2E8B6F}.mini i.now{background:#2C5468}
.next-btn{margin:0 0 4px}
.fu{list-style:none;margin:0 0 10px;padding:0}
.fu li{border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px 10px;margin:0 0 6px;font-size:13.5px}
.fu .sm{font-size:12px;color:var(--muted)}
.how{margin-top:26px}
dialog.gate{border:0;border-radius:16px;padding:0;max-width:560px;width:calc(100% - 32px);box-shadow:0 24px 60px rgba(22,38,59,.35)}
dialog.gate::backdrop{background:rgba(22,38,59,.55)}
.gate-in{padding:22px 24px}
.gate-in h3{font-family:Fraunces,serif;font-size:22px;margin:0 0 6px}
.gate-in .sigpad canvas{height:160px}
.gate-steps{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px;font-size:12.5px;font-weight:700;color:var(--muted)}
.gate-steps span{background:#eef3f6;border-radius:12px;padding:3px 10px}
.gate-steps span.done{background:#e6f4ee;color:#1f6b4f}
@media (max-width:760px){ .det{grid-template-columns:1fr} }
</style>
</head>
<body><div class="sheet" id="sheet"></div>
<script>var LOGO = 'print/sanctuary-logo.png';  /* this page skips data.js */</script>
<script src="ui.js"></script>
<script src="account.js"></script>
<script src="cpao/process.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/signature_pad/5.0.4/signature_pad.umd.min.js"
  integrity="sha384-sAvQstqOmAfqxD54T2ZBU8/E8IQJJuNT4hEHwUULkoBRze+eTQ7tZNcXEA5yPzhE" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>document.head.insertAdjacentHTML('beforeend', '<style>' + CPAO_PROCESS_CSS + '</style>');</script>
<script>
/* ── CP-AO portal: the site administrator's side ──────────────────────────
   Admins only (middleware.js + api/cpao.js). Views by hash:
     #roster (default)  everyone, with status, last and next action
     #staff=<id>        one person: application, AI check, countersign
     #batches           the weekly Org form + bundle, Mark as Sent
     #settings          phone, signature, batch day, retention, key rotation
     #audit             the audit log
   SSN, date of birth and home address stay hidden until "Show", which is
   logged. Downloads are 5-minute links. See CPAO.md. */
var DATA = null, FILTER = 'open', SEL = {}, PAD = null;
var LABEL = {
  invited: 'Invited', in_progress: 'Filling it in', needs_fix: 'Needs a fix', ready_for_countersign: 'Ready to countersign',
  countersigned: 'Countersigned', queued_for_batch: 'Queued for batch', sent_to_cpao: 'Sent to CPAO',
  cpao_correction_requested: 'CPAO wants a correction', approved_training_assigned: 'Approved — training assigned',
  training_complete: 'Certificates turned in', certs_sent_to_cpao: 'Certificates sent to CPAO', final_approved: 'Final approval — create account',
  active: 'Active', denied: 'Denied', remove_requested: 'Removal requested', removed: 'Removed'
};
var NEXT = {
  invited: 'Waiting on them to start', in_progress: 'Waiting on them to finish', needs_fix: 'Waiting on their fix',
  ready_for_countersign: 'You: countersign', countersigned: 'Goes in the next batch', queued_for_batch: 'Goes in the next batch',
  sent_to_cpao: 'Background check with CPAO', cpao_correction_requested: 'You: fix and resend to CPAO', approved_training_assigned: 'They do the AZLearns courses',
  training_complete: 'You: send their certificates to CPAO', certs_sent_to_cpao: 'Waiting on CPAO final approval',
  final_approved: 'You: create their HEAplus account', active: '—', denied: '—', remove_requested: 'Goes in the next batch (remove)', removed: '—'
};
/* the statuses Brian sets by hand once the application is with CPAO */
var AFTER_CPAO = ['sent_to_cpao', 'cpao_correction_requested', 'approved_training_assigned', 'training_complete', 'certs_sent_to_cpao',
                  'final_approved', 'active', 'denied', 'remove_requested', 'removed'];
/* the one-click "next step" for each status */
var NEXT_STEP = {
  sent_to_cpao: ['approved_training_assigned', 'CPAO approved — training assigned'],
  cpao_correction_requested: ['sent_to_cpao', 'Correction re-sent to CPAO'],
  approved_training_assigned: ['training_complete', 'Certificates received'],
  training_complete: ['certs_sent_to_cpao', 'Certificates sent to CPAO'],
  certs_sent_to_cpao: ['final_approved', 'Final approval received'],
  final_approved: ['active', 'HEAplus account created']
};
function stageDate(s, st) {
  var d = s.stage_dates || {}, best = '';
  st.statuses.concat(st.key === 'org_form' ? ['org_form'] : []).forEach(function (k) { if (d[k] && d[k] > best) { best = d[k]; } });
  if (!best && st.key === 'invited') { best = s.created_at; }
  return best;
}
function stageCell(s) {
  var st = cpaoStageOf(s.status);
  if (!st) { return pill(s.status); }
  var since = stageDate(s, st);
  return '<div class="stg">' + pill(s.status) + '<div class="mini" aria-hidden="true">' + CPAO_STAGES.map(function (x) {
      return '<i class="' + (x.n < st.n ? 'on' : x.n === st.n ? 'now' : '') + '"></i>'; }).join('') + '</div>' +
    '<span class="sm">Step ' + st.n + ' of 10' + (since ? ' · since ' + day(since) : '') + '</span></div>';
}
var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

function $(id) { return document.getElementById(id); }
function api(method, action, body) { return SM.api(method, '/api/cpao?action=' + action, body); }
function when(iso) { return iso ? new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: 'America/Phoenix' }) : ''; }
function day(d) { return d ? new Date(d.length === 10 ? d + 'T12:00:00' : d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : ''; }
function pill(s) { return '<span class="pill p-' + s + '">' + esc(LABEL[s] || s) + '</span>'; }
function note(id, kind, text) { var n = $(id); if (!n) { return; } n.className = 'note ' + kind; n.hidden = !text; n.textContent = text || ''; }
function openFile(action) {
  return api('GET', action).then(function (j) { window.open(j.url, '_blank', 'noopener'); });
}

function shell(inner) {
  var st = DATA ? DATA.staff : [];
  var n = function (f) { return st.filter(f).length; };
  var view = location.hash.replace(/^#/, '').split('=')[0] || 'roster';
  var tab = function (id, label, count) {
    return '<button class="ca-tab" role="tab" data-tab="' + id + '" aria-selected="' + (view === id || (id === 'roster' && view === 'staff')) + '">' + label +
      (count ? '<small>' + count + '</small>' : '') + '</button>';
  };
  $('sheet').innerHTML = pageHeader('CP-AO Portal', 'AHCCCS HEAplus access · Site Administrator', 'Admins only', 'cpao') +
    '<section><div class="eyebrow">CP-AO Assistor Portal</div><h2 style="font-size:26px;margin:6px 0 10px">HEAplus access</h2>' +
    setupWarnings() +
    '<div class="ca-tabs" role="tablist">' +
      tab('roster', 'Roster', n(function (s) { return s.status === 'ready_for_countersign'; }) ? n(function (s) { return s.status === 'ready_for_countersign'; }) + ' to sign' : '') +
      tab('batches', 'Weekly batches', '') + tab('settings', 'Settings', '') + tab('audit', 'Audit log', '') +
    '</div>' + inner + '</section>' + pageFooter('CP-AO portal');
  document.querySelectorAll('[data-tab]').forEach(function (b) {
    b.addEventListener('click', function () { location.hash = b.getAttribute('data-tab'); });
  });
}
function setupWarnings() {
  if (!DATA) { return ''; }
  var s = DATA.setup, w = [];
  if (!s.pii_key) { w.push('<b>CPAO_PII_KEY</b> isn\'t set in Vercel. You can invite people now, but they can\'t fill in the form, and you can\'t countersign, until it is (see CPAO.md).'); }
  if (!DATA.settings.has_signature) { w.push('Draw your <b>signature</b> under Settings — countersigning and the Org form need it.'); }
  if (!DATA.settings.site_admin_phone) { w.push('Add your <b>office phone</b> under Settings — it goes on the Org form.'); }
  if (!s.ai) { w.push('<b>ANTHROPIC_API_KEY</b> isn\'t set — every application will come to you for a manual check.'); }
  if (!s.cron) { w.push('<b>CRON_SECRET</b> isn\'t set — the weekly batch won\'t build itself (use "Build the batch now").'); }
  if (s.wet) { w.push('Pen-signature mode is on (CPAO_REQUIRE_WET_SIGNATURE): staff print, sign and upload a scan.'); }
  return w.length ? '<div class="warnbox"><b>Finish setting up</b><ul><li>' + w.join('</li><li>') + '</li></ul></div>' : '';
}

/* ── roster ───────────────────────────────────────────────────────────── */
var FILTERS = [['open', 'Open'], ['waiting', 'Filling out'], ['ready_for_countersign', 'To countersign'], ['queued', 'Add/Remove form'],
               ['cpao', 'Background check'], ['training', 'Training & certificates'], ['account', 'Create account'], ['active', 'Active'], ['all', 'All']];
function matches(s) {
  switch (FILTER) {
    case 'open': return ['active', 'denied', 'removed'].indexOf(s.status) < 0;
    case 'waiting': return ['invited', 'in_progress', 'needs_fix'].indexOf(s.status) >= 0;
    case 'queued': return ['countersigned', 'queued_for_batch', 'remove_requested'].indexOf(s.status) >= 0;
    case 'cpao': return ['sent_to_cpao', 'cpao_correction_requested'].indexOf(s.status) >= 0;
    case 'training': return ['approved_training_assigned', 'training_complete', 'certs_sent_to_cpao'].indexOf(s.status) >= 0;
    case 'account': return s.status === 'final_approved';
    case 'all': return true;
    default: return s.status === FILTER;
  }
}
function rosterView() {
  var list = DATA.staff.filter(matches);
  shell('<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">' +
      '<div class="filters" role="group" aria-label="Show">' + FILTERS.map(function (f) {
        return '<button type="button" data-f="' + f[0] + '" aria-pressed="' + (FILTER === f[0]) + '">' + f[1] + '</button>'; }).join('') + '</div>' +
      '<button class="btn" id="inv-open">+ Invite someone</button></div>' +
    '<div class="card" id="inv-card" hidden><form id="inv" class="f2" novalidate>' +
      '<div class="dir"><label class="fl" for="d-q">Pick from Microsoft 365</label>' +
        '<input type="search" id="d-q" placeholder="Loading the staff list…" autocomplete="off" aria-describedby="d-note">' +
        '<p class="sub" id="d-note" style="margin:6px 0 0">Click a name to fill the form, or tick several and invite them together.</p>' +
        '<ul class="dir-list" id="d-list" hidden></ul>' +
        '<div class="dir-bar" id="d-bar" hidden><b id="d-n"></b><button type="button" class="btn" id="d-go">Invite selected</button>' +
          '<button type="button" class="btn alt" id="d-clear">Clear</button></div><div id="d-out"></div></div>' +
      '<label class="fl">First name<input id="i-first" maxlength="40"><span class="fh">Legal name — they confirm it matches their license.</span></label>' +
      '<label class="fl">Last name<input id="i-last" maxlength="40"><span class="fh">Legal last name, as on their license.</span></label>' +
      '<label class="fl">Work email<input id="i-email" type="email" maxlength="200" placeholder="name@sanctuaryrecoverycenters.com"><span class="fh">The invite only opens for this Microsoft account.</span></label>' +
      '<label class="fl">Title<select id="i-title"><option value="">—</option>' + DATA.titles.map(function (t) { return '<option>' + esc(t) + '</option>'; }).join('') + '</select><span class="fh">Their role on the CP-101. They can change it.</span></label>' +
      '<label class="fl">Worker type<select id="i-type"><option>Employee</option><option>Contractor</option><option>Volunteer</option></select><span class="fh">Goes on the Add/Remove form.</span></label>' +
      '<label class="fl">Hire date<input id="i-hire" type="date"><span class="fh">Required on the Add/Remove form.</span></label>' +
      '<label class="fl wide">Work address<input id="i-addr" maxlength="200" value="' + esc(DATA.constants.default_work_address) + '"><span class="fh">Where they work — goes on the Add/Remove form. Change it for Cave Creek staff.</span></label>' +
      '<label class="ck" style="grid-column:1/-1;align-items:flex-start"><input type="checkbox" id="i-sa" style="margin-top:3px"><span>Also a Site Administrator (Add-SA)' +
        '<span class="fh">Only tick this if they will also be a CP-AO Site Administrator like you. Most staff are plain "Add".</span></span></label>' +
      '<div class="btnrow" style="grid-column:1/-1"><button class="btn" type="submit" id="i-go">Send invite</button><button type="button" class="btn alt" id="inv-close">Cancel</button>' +
        '<span class="sub" style="margin:0">Makes their personal link (14 days). It\'s step 1 of 10 below.</span></div>' +
      '<div style="grid-column:1/-1"><div class="note" id="i-note" hidden></div><div id="i-link"></div></div>' +
    '</form></div>' +
    (list.length ? '<table class="tbl"><thead><tr><th><input type="checkbox" id="selall" aria-label="Select all"></th><th>Name</th><th>Stage</th><th>Last action</th><th>Next</th><th>Check</th></tr></thead><tbody>' +
      list.map(function (s) {
        return '<tr><td><input type="checkbox" data-sel="' + s.id + '"' + (SEL[s.id] ? ' checked' : '') + ' aria-label="Select ' + esc(s.first_name + ' ' + s.last_name) + '"></td>' +
          '<td><a class="nm" href="#staff=' + s.id + '">' + esc(s.first_name + ' ' + s.last_name) + '</a>' + (s.is_site_admin ? ' <span class="pill">SA</span>' : '') +
            '<div class="sm">' + esc(s.title_position || '') + (s.title_position ? ' · ' : '') + esc(s.email) + '</div></td>' +
          '<td>' + stageCell(s) + '</td>' +
          '<td>' + esc(s.last_action || '') + '<div class="sm">' + when(s.last_action_at) +
            ((s.followups || []).length ? ' · ' + s.followups.length + ' follow-up' + (s.followups.length === 1 ? '' : 's') : '') + '</div></td>' +
          '<td class="' + (/^You/.test(NEXT[s.status]) ? 'next' : '') + '">' + esc(NEXT[s.status] || '') + '</td>' +
          '<td>' + (s.app && s.app.ai_status ? '<span class="pill ai-' + s.app.ai_status + '">' + esc(s.app.ai_status.replace('_', ' ')) + '</span>' : '') + '</td></tr>';
      }).join('') + '</tbody></table>'
      : '<div class="placeholder">' + (DATA.staff.length ? 'No one in this view.' : 'No one yet — press <b>+ Invite someone</b> to send the first application.') + '</div>') +
    '<div class="bulk" id="bulk" hidden><b id="bulk-n"></b>' +
      '<button class="btn alt" id="b-sa">Mark Add-SA</button>' +
      '<label class="ck"><input type="checkbox" id="b-conf"> Their HEAplus accounts are already deactivated</label>' +
      '<button class="btn warm" id="b-rm">Mark for removal</button><span class="note" id="b-note" hidden></span></div>' +
    '<div class="how"><h3 style="font-family:Fraunces,serif;font-size:21px;margin:0 0 4px">How it works, start to finish</h3>' +
      '<p class="sub" style="margin:0 0 14px">Every person moves through these 10 steps. Their stage and the date each step happened show on the roster and on their page.</p>' +
      cpaoProcessHtml() + '</div>');
  wireRoster();
}
function wireRoster() {
  document.querySelectorAll('[data-f]').forEach(function (b) { b.addEventListener('click', function () { FILTER = b.getAttribute('data-f'); rosterView(); }); });
  $('inv-open').addEventListener('click', function () { $('inv-card').hidden = false; loadDir(); $('d-q').focus(); });
  wireDir();
  $('inv-close').addEventListener('click', function () { $('inv-card').hidden = true; });
  $('inv').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('i-go'); btn.disabled = true;
    api('POST', 'invite', { first_name: $('i-first').value, last_name: $('i-last').value, email: $('i-email').value,
      title_position: $('i-title').value, worker_type: $('i-type').value, hire_date: $('i-hire').value,

    var to = $('st-to').value;
    if (!to) { return; }
    if (to === 'removed' && !confirm('Mark as removed? This deletes their SSN, birth date, address and signature now.')) { return; }
    api('POST', 'status', { id: s.id, status: to, confirm_deactivated: $('st-conf').checked, heaplus_username: $('u-user').value })
      .then(function () { refresh(false); staffView(s.id); }, function (e) { note('s-note', 'err', e.message); });
  });
}

/* ── batches ──────────────────────────────────────────────────────────── */
function batchesView(open) {
  var b = DATA.batches;
  var queued = DATA.staff.filter(function (s) { return s.status === 'queued_for_batch' || s.status === 'remove_requested'; });
  shell('<div class="card"><b>Next batch:</b> every ' + DAYS[DATA.settings.batch_weekday] + ' at 8:00 am. ' +
      (queued.length ? queued.length + ' waiting: ' + queued.map(function (s) { return esc(s.first_name + ' ' + s.last_name) + (s.status === 'remove_requested' ? ' (remove)' : ''); }).join(', ') + '.' : 'Nobody waiting right now.') +
      '<div class="btnrow"><button class="btn" id="build"' + (queued.length ? '' : ' disabled') + '>Build the batch now</button>' +
      '<span class="sub" style="margin:0">Re-running replaces a batch you haven\'t marked sent yet.</span></div><div class="note" id="b-note" hidden></div></div>' +
    (b.length ? '<table class="tbl"><thead><tr><th>Week of</th><th>Who</th><th>Status</th><th>Files</th><th></th></tr></thead><tbody>' + b.map(function (x) {
      return '<tr' + (open === x.id ? ' style="background:#fffaf0"' : '') + '><td>' + day(x.week_of) + '</td>' +
        '<td>' + (x.rows || []).map(function (r) { return esc(r.name) + ' <span class="sm">' + esc(r.action) + '</span>'; }).join('<br>') + '</td>' +
        '<td>' + (x.status === 'draft' ? '<span class="pill p-ready_for_countersign">Ready to send</span>' : '<span class="pill p-sent_to_cpao">Sent ' + day(x.sent_at) + '</span>') + '</td>' +
        '<td>' + (x.bundle_storage_key ? '<button class="btn alt" data-file="' + esc(x.bundle_storage_key) + '">Bundle</button> <button class="btn alt" data-file="' + esc(x.org_form_storage_key) + '">Org form</button>' : '<span class="sm">Removed (retention)</span>') + '</td>' +
        '<td>' + (x.status === 'draft' ? '<button class="btn" data-sent="' + x.id + '">Mark as Sent</button>' : '') + '</td></tr>';
    }).join('') + '</tbody></table>' : '<div class="placeholder">No batches yet.</div>') +
    '<p class="sub" style="margin-top:12px">Send the bundle to <b>' + esc(DATA.constants.cpao_ops_email) + '</b> from your own mailbox — only the site administrator may email CPAO. Then press Mark as Sent.</p>');
  $('build').addEventListener('click', function () {
    var btn = $('build'); btn.disabled = true; btn.textContent = 'Building…';
    api('POST', 'batch', {}).then(function (j) { return refresh(false).then(function () { batchesView(j.batch_id); note('b-note', 'ok', j.empty ? 'Nobody to send.' : 'Built: ' + j.add + ' add, ' + j.remove + ' remove. A task is on your Projects page.'); }); },
      function (e) { btn.disabled = false; btn.textContent = 'Build the batch now'; note('b-note', 'err', e.message); });
  });
  document.querySelectorAll('[data-file]').forEach(function (x) {
    x.addEventListener('click', function () { openFile('file&key=' + encodeURIComponent(x.getAttribute('data-file'))).catch(function (e) { note('b-note', 'err', e.message); }); });
  });
  document.querySelectorAll('[data-sent]').forEach(function (x) {
    x.addEventListener('click', function () {
      if (!confirm('Mark this batch as sent to CPAO? Adds move to "Sent to CPAO" and removals to "Removed".')) { return; }
      api('POST', 'mark_sent', { id: x.getAttribute('data-sent') }).then(function () { return refresh(false).then(function () { batchesView(); }); },
        function (e) { note('b-note', 'err', e.message); });
    });
  });
}

/* ── settings ─────────────────────────────────────────────────────────── */
function settingsView() {
  var st = DATA.settings;
  shell('<div class="card"><form id="set" class="f2">' +
      '<label class="fl">Office phone (for the Org form)<input id="s-phone" maxlength="40" value="' + esc(st.site_admin_phone) + '" placeholder="602-555-0100 ext 12"></label>' +
      '<label class="fl">Build the batch every<select id="s-day">' + DAYS.map(function (d, i) { return '<option value="' + i + '"' + (st.batch_weekday === i ? ' selected' : '') + '>' + d + '</option>'; }).join('') + '</select></label>' +
      '<label class="fl">Keep generated PDFs (days)<input id="s-keep" type="number" min="30" max="3650" value="' + st.pdf_retention_days + '"></label>' +
      '<div class="btnrow" style="grid-column:1/-1;margin:0"><button class="btn" type="submit">Save</button></div></form><div class="note" id="set-note" hidden></div></div>' +
    '<div class="card"><div style="font-family:Fraunces,serif;font-size:17px;font-weight:600;margin:0 0 6px">Your signature</div>' +
      '<p class="sub" style="margin:0 0 10px">' + (st.has_signature ? 'Saved. Draw a new one to replace it.' : 'Draw it once — it\'s stamped on every CP-101 you countersign and on the Org form.') + '</p>' +
      '<div class="sigpad"><canvas id="sig" aria-label="Signature pad"></canvas></div>' +
      '<div class="btnrow"><button class="btn" id="sig-save">Save signature</button><button class="btn alt" id="sig-clear">Clear</button></div><div class="note" id="sig-note" hidden></div></div>' +
    '<div class="card"><div style="font-family:Fraunces,serif;font-size:17px;font-weight:600;margin:0 0 6px">Housekeeping</div>' +
      '<p class="sub" style="margin:0 0 10px">These also run on their own every morning. Re-encrypt after rotating CPAO_PII_KEY (CPAO.md).</p>' +
      '<div class="btnrow" style="margin:0"><button class="btn alt" id="purge">Run the retention purge</button><button class="btn alt" id="rotate">Re-encrypt with the new key</button></div>' +
      '<div class="note" id="hk-note" hidden></div></div>');
  $('set').addEventListener('submit', function (e) {
    e.preventDefault();
    api('POST', 'settings', { site_admin_phone: $('s-phone').value, batch_weekday: +$('s-day').value, pdf_retention_days: +$('s-keep').value })
      .then(function () { note('set-note', 'ok', 'Saved.'); refresh(false); }, function (er) { note('set-note', 'err', er.message); });
  });
  var c = $('sig');
  if (typeof SignaturePad !== 'undefined') {
    var ratio = Math.max(window.devicePixelRatio || 1, 1);
    c.width = c.offsetWidth * ratio; c.height = c.offsetHeight * ratio; c.getContext('2d').scale(ratio, ratio);
    PAD = new SignaturePad(c, { penColor: '#0b1f3a', backgroundColor: 'rgba(0,0,0,0)', minWidth: 0.8, maxWidth: 2.4 });
  } else { note('sig-note', 'err', 'The signature pad didn\'t load — check your connection and reload.'); }
  $('sig-clear').addEventListener('click', function () { if (PAD) { PAD.clear(); } });
  $('sig-save').addEventListener('click', function () {
    if (!PAD || PAD.isEmpty()) { note('sig-note', 'err', 'Draw your signature first.'); return; }
    api('POST', 'settings', { signature: PAD.toDataURL('image/png') }).then(function () { note('sig-note', 'ok', 'Signature saved.'); refresh(false); },
      function (er) { note('sig-note', 'err', er.message); });
  });
  $('purge').addEventListener('click', function () {
    api('POST', 'purge', {}).then(function (j) { note('hk-note', 'ok', 'Done: ' + j.purged_applications + ' applications\' personal data and ' + j.purged_pdfs + ' old PDFs removed.'); },
      function (er) { note('hk-note', 'err', er.message); });
  });
  $('rotate').addEventListener('click', function () {
    api('POST', 'rotate', {}).then(function (j) { note('hk-note', 'ok', 'Re-encrypted ' + j.resealed + ' of ' + j.total + ' applications.'); },
      function (er) { note('hk-note', 'err', er.message); });
  });
}

/* ── audit ────────────────────────────────────────────────────────────── */
function auditTable(list) {
  if (!list.length) { return '<p class="sub">Nothing yet.</p>'; }
  var names = {};
  (DATA ? DATA.staff : []).forEach(function (s) { names[s.id] = s.first_name + ' ' + s.last_name; });
  return '<table class="tbl audit"><thead><tr><th>When</th><th>Who</th><th>What</th><th>About</th><th>IP</th></tr></thead><tbody>' + list.map(function (e) {
    var d = e.detail || {};
    var extra = d.to ? '→ ' + (LABEL[d.to] || d.to) : d.step ? 'step ' + d.step : d.result ? d.result.status : d.file ? d.file : '';
    return '<tr><td>' + when(e.at) + '</td><td>' + esc(e.actor) + '</td><td>' + esc(e.action.replace(/_/g, ' ')) + (extra ? ' <span class="sm">' + esc(extra) + '</span>' : '') + '</td>' +
      '<td>' + esc(names[e.staff_id] || '') + '</td><td class="sm">' + esc(e.ip || '') + '</td></tr>';
  }).join('') + '</tbody></table>';
}
function auditView() {
  shell('<div id="a-all"><p class="sub">Loading…</p></div>');
  api('GET', 'audit').then(function (x) { $('a-all').innerHTML = '<p class="sub">The last 200 entries. Every look at an SSN, birth date or address, every download and every signature is here.</p>' + auditTable(x.entries); });
}

/* ── routing ──────────────────────────────────────────────────────────── */
/* ── first-time setup: until Brian's signature is saved, a pop-up asks for it
   every time the CP-AO tab opens (and on each view except Settings). The
   signature goes on every countersigned CP-101 and the weekly Add/Remove form. */
var GATE_PAD = null;
function setupGate(view) {
  var old = $('gate');
  if (old) { old.remove(); }
  if (!DATA || DATA.settings.has_signature || view === 'settings') { return; }
  document.body.insertAdjacentHTML('beforeend',
    '<dialog class="gate" id="gate" aria-labelledby="gate-h"><div class="gate-in">' +
      '<div class="gate-steps"><span>1. Your signature</span><span class="' + (DATA.settings.site_admin_phone ? 'done' : '') + '">2. Office phone</span></div>' +
      '<h3 id="gate-h">Set up your signature first</h3>' +
      '<p class="sub" style="margin:0 0 12px">As CP-AO Site Administrator, your signature goes at the bottom of every CP-101 you countersign and on the weekly Add/Remove form. ' +
        'Draw it once — it\'s reused each time, and you can redraw it under Settings.</p>' +
      '<div class="sigpad" style="max-width:none"><canvas id="gate-sig" aria-label="Draw your signature"></canvas></div>' +
      '<div class="btnrow" style="margin-top:8px"><button type="button" class="btn alt" id="gate-clear">Clear</button></div>' +
      '<label class="fl" style="margin-top:12px">Office phone (for the Add/Remove form)<input id="gate-phone" maxlength="40" placeholder="602-555-0100 ext 12" value="' + esc(DATA.settings.site_admin_phone || '') + '"></label>' +
      '<div class="note" id="gate-note" hidden></div>' +
      '<div class="btnrow" style="margin-top:16px"><button type="button" class="btn" id="gate-save">Save and continue</button>' +
        '<button type="button" class="btn alt" id="gate-later">Not now</button></div>' +
      '<p class="sub" style="margin:10px 0 0">Until it\'s saved you can invite people, but you can\'t countersign or send the weekly batch — and this will keep popping up.</p>' +
    '</div></dialog>');
  var d = $('gate');
  d.showModal();
  var c = $('gate-sig');
  if (typeof SignaturePad === 'undefined') { note('gate-note', 'err', 'The signature pad didn\'t load — check your connection and reload.'); }
  else {
    var ratio = Math.max(window.devicePixelRatio || 1, 1);
    c.width = c.offsetWidth * ratio; c.height = c.offsetHeight * ratio; c.getContext('2d').scale(ratio, ratio);
    GATE_PAD = new SignaturePad(c, { penColor: '#0b1f3a', backgroundColor: 'rgba(0,0,0,0)', minWidth: 0.8, maxWidth: 2.4 });
  }
  $('gate-clear').addEventListener('click', function () { if (GATE_PAD) { GATE_PAD.clear(); } });
  $('gate-later').addEventListener('click', function () { d.close(); d.remove(); });
  d.addEventListener('cancel', function () { d.remove(); });
  $('gate-save').addEventListener('click', function () {
    if (!GATE_PAD || GATE_PAD.isEmpty()) { note('gate-note', 'err', 'Draw your signature in the box first.'); return; }
    var b = $('gate-save'); b.disabled = true; b.textContent = 'Saving…';
    var body = { signature: GATE_PAD.toDataURL('image/png') };
    if ($('gate-phone').value.trim()) { body.site_admin_phone = $('gate-phone').value.trim(); }
    api('POST', 'settings', body).then(function () {
      d.close(); d.remove(); refresh(true);
    }, function (e) { b.disabled = false; b.textContent = 'Save and continue'; note('gate-note', 'err', e.message); });
  });
}
function route() {
  var h = location.hash.replace(/^#/, ''), k = h.split('=')[0], v = h.split('=')[1];
  setupGate(k);
  if (k === 'staff' && v) { return staffView(v); }
  if (k === 'batches' || k === 'batch') { return batchesView(v); }
  if (k === 'settings') { return settingsView(); }
  if (k === 'audit') { return auditView(); }
  rosterView();
}
function refresh(redraw) {
  return api('GET', 'roster').then(function (j) { DATA = j; if (redraw) { route(); } });
}
window.addEventListener('hashchange', function () { if (DATA) { route(); window.scrollTo(0, 0); } });
SM.ready.then(function (me) {
  if (!me) { $('sheet').innerHTML = SM.signInCard('cpao-admin.html'); return; }
  refresh(true).catch(function (e) {
    $('sheet').innerHTML = pageHeader('CP-AO Portal', 'AHCCCS HEAplus access', '', '') + '<section><div class="note err">' + esc(e.message) + '</div></section>';
  });
});
</script>
</body></html>
