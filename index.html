<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanctuary Recovery Centers — Performance Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="report.css">
</head>
<body><div class="sheet" id="sheet"></div>
<script src="data.js"></script>
<script src="ui.js"></script>
<script>
/* ── channel section renderers ───────────────────────────────────────── */
function renderWebsite(c) {
  var meta = CHANNEL_META.website;
  if (!c.measured) { return mutedSection('website', c); }
  return '<section>' + sechead(meta.name, meta.color, c.source, c.window) +
    kpis(c.kpis) +
    grid2(
      card(c.weekly.title, vbar(c.weekly.series, meta.color), c.weekly.note),
      card(c.sources.title, table(c.sources.head, c.sources.rows))
    ) +
    card(c.topPages.title, table(c.topPages.head, c.topPages.rows)) +
    '<p class="sub">' + c.footnote + '</p>' +
  '</section>';
}

function renderFacebook(c) {
  var meta = CHANNEL_META.facebook;
  if (!c.measured) { return mutedSection('facebook', c); }
  return '<section>' + sechead(meta.name, meta.color, c.source, c.window) +
    kpis(c.kpis) +
    grid2(
      card(c.weekly.title, vbar(c.weekly.series, meta.color)),
      card(c.formats.title, hbar(c.formats.series, { barX: c.formats.barX, color: meta.color }), c.formats.note)
    ) +
    grid2(
      card(c.topPosts.title, table(c.topPosts.head, c.topPosts.rows)),
      card(c.peers.title, table(c.peers.head, c.peers.rows, { numeric: function (i) { return i === 1 || i === 2; } }), c.peers.note)
    ) +
    '<div class="warn">' + c.warn + '</div>' +
  '</section>';
}

function renderInstagram(c) {
  var meta = CHANNEL_META.instagram;
  if (!c.measured) { return mutedSection('instagram', c); }
  return '<section>' + sechead(meta.name, meta.color, c.source, c.window) +
    kpis(c.kpis) +
    grid2(
      card(c.weekly.title, vbar(c.weekly.series, meta.color)),
      card(c.viewSources.title, table(c.viewSources.head, c.viewSources.rows), c.viewSources.note)
    ) +
  '</section>';
}

function renderLinkedIn(c) {
  var meta = CHANNEL_META.linkedin;
  if (!c.measured) { return mutedSection('linkedin', c); }
  var s = '<section>' + sechead(meta.name, meta.color, c.source, c.window) + kpis(c.kpis);

  if (c.weekly && c.visitors) {
    s += grid2(
      card(c.weekly.title, vbar(c.weekly.series, meta.color), c.weekly.note),
      card(c.visitors.title, table(c.visitors.head, c.visitors.rows))
    );
  } else if (c.monthly) {
    s += grid2(
      card(c.monthly.title, vbar(c.monthly.series, meta.color), c.monthly.note),
      card(c.monthlyFollowers.title, vbar(c.monthlyFollowers.series, meta.color), c.monthlyFollowers.note)
    );
    s += grid2(
      card(c.visitors.title, table(c.visitors.head, c.visitors.rows)),
      card(c.search.title, table(c.search.head, c.search.rows, { numeric: function (i) { return i === 1; } }))
    );
  }

  s += card(c.topPosts.title, table(c.topPosts.head, c.topPosts.rows,
        { numeric: function (i) { return i > (c.topPosts.head[1] === 'Posted' ? 1 : 0); } }));

  if (c.industry) {
    s += grid2(card(c.industry.title, table(c.industry.head, c.industry.rows)),
               card(c.location.title, table(c.location.head, c.location.rows)));
  } else {
    s += card(c.location.title, table(c.location.head, c.location.rows));
  }
  if (c.warn) { s += '<div class="warn">' + c.warn + '</div>'; }
  if (c.footnote) { s += '<p class="sub" style="margin-top:16px">' + c.footnote + '</p>'; }
  return s + '</section>';
}

function mutedSection(key, c) {
  var meta = CHANNEL_META[key];
  return '<section class="muted">' +
    '<div class="sechead"><span class="dot" style="background:' + meta.color + '"></span><h2>' + meta.name + '</h2></div>' +
    '<p class="sub">No export available for this reporting period</p>' +
    noExport(c.lastWindow) +
  '</section>';
}

/* ── executive summary ───────────────────────────────────────────────── */
function renderSummary(snap) {
  var s = snap.summary;
  var legend = '<div class="legend">';
  s.reach.forEach(function (d) { legend += '<span><i style="background:' + d.color + '"></i>' + esc(d.label) + '</span>'; });
  legend += '</div>';

  return '<section>' +
    '<div class="eyebrow">Executive summary</div>' +
    '<h2 style="font-size:26px;margin:6px 0 0">Growth at a glance</h2>' +
    '<p class="lead">' + s.lead + '</p>' +
    kpis(s.kpis) +
    '<div class="card"><h3>Reach volume by platform</h3>' + legend + hbar(s.reach, { barX: 150 }) +
      (s.reachNote ? '<p class="note" style="font-size:11.5px;color:var(--muted);margin:6px 0 0">' + s.reachNote + '</p>' : '') +
    '</div>' +
    table(s.rollup.head, s.rollup.rows, { numeric: function (i) { return i > 0 && i < 5; } }) +
  '</section>';
}

function renderRecommendations(snap) {
  var s = '<section><div class="eyebrow">What to act on</div>' +
          '<h2 style="font-size:22px;margin:6px 0 14px">Recommendations</h2><ol class="flags">';
  snap.recommendations.forEach(function (r) { s += '<li>' + r + '</li>'; });
  return s + '</ol></section>';
}

/* ── BizIQ campaign report (vendor report — not period-scoped) ───────── */
function renderBizIQ() {
  return '<section>' +
  '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap">' +
    '<div>' +
      '<div class="sechead"><span class="dot" style="background:var(--gold)"></span><h2>BizIQ Campaign Report</h2></div>' +
      '<p class="sub">source: BizIQ &nbsp;·&nbsp; reporting period: {{FILL IN DATES}}</p>' +
    '</div>' +
    '<!-- paste BizIQ logo here if available -->' +
    '<!-- <img src="" alt="BizIQ" style="height:36px;width:auto;display:block;flex:0 0 auto"> -->' +
    '<div class="placeholder" style="flex:0 0 auto;padding:10px 20px;border-radius:9px;font-size:11px;font-weight:700;letter-spacing:.16em">BIZIQ</div>' +
  '</div>' +
  '<p class="lead">Current campaign standings for review. Next comprehensive campaign call: <b>October 2, 2026 at 2:00 PM</b>' +
  ' &mdash; this call will cover all business locations together, so please disregard any automated per-location appointment emails.</p>' +
  card('Listings & visibility',
    table(['Item', 'Now', 'At start (May)', 'Status'], [
      ['Total listings managed', '77', '39', { tag: 'hi', text: 'Higher' }],
      ['GMB posts', 'On schedule', '—', { tag: 'hi', text: 'On track' }]
    ], { numeric: function (i) { return i === 1 || i === 2; } })) +
  '<h3 style="font-size:15px;margin:18px 0 0;font-family:Inter,sans-serif;font-weight:700;letter-spacing:0">GMB insights</h3>' +
  kpis([
    { lab: 'Website clicks', num: '397', note: 'from Google Business Profile' },
    { lab: 'Call clicks', num: '206', note: 'tap-to-call actions' },
    { lab: 'Direction requests', num: '29', note: 'navigation to location' }
  ], 3) +
  grid2(
    '<div class="card"><h3>Rankings</h3>' +
      table(['Keyword / area', 'Rank'], [
        ['Partial Hospitalization Program — ZIP 85020', '<span class="tag hi">#1 organic desktop</span>'],
        ['Detox Center — ZIP 85020', '<span class="tag hi">#1 local pack</span> <span class="tag eq">#2 organic desktop</span>']
      ], { numeric: function () { return false; } }) +
      '<h3 style="margin-top:16px">Keyword distribution</h3>' +
      table(['Position', 'Keywords'], [['#1', '13'], ['#2', '31'], ['#6 – #10', '17']]) +
    '</div>',
    '<div class="card"><h3>Reputation management</h3>' +
      table(['Metric', 'Value'], [
        ['Average rating', '4.56 stars'],
        ['Review volume', 'Steady — a handful of new reviews monthly']
      ]) +
      '<div class="warn"><b>Follow-up:</b> discuss and optimize the client\'s review-request process.</div>' +
    '</div>'
  ) +
  '</section>';
}

function renderL10() {
  return '<section><div class="eyebrow">L10 meeting</div>' +
    '<h2 style="font-size:22px;margin:6px 0 14px">Updates &amp; action items</h2>' +
    '<div class="placeholder">Reserved for L10 meeting content — send it over and it will be added here.</div>' +
  '</section>';
}

/* ── period selector + full render ───────────────────────────────────── */
function periodBar(currentId) {
  var s = '<div class="periodbar"><label for="period">Reporting period</label>' +
          '<select id="period" aria-label="Reporting period">';
  REPORT_ORDER.forEach(function (id) {
    s += '<option value="' + id + '"' + (id === currentId ? ' selected' : '') + '>' + esc(REPORTS[id].label) + '</option>';
  });
  s += '</select><span class="meta">Each channel below shows its own source window — windows are not assumed to match.</span></div>';
  return s;
}

function render(id) {
  var snap = REPORTS[id];
  var ch = snap.channels;
  document.getElementById('sheet').innerHTML =
    pageHeader('Performance Report',
      'Report date: ' + esc(snap.reportDate) + ' &nbsp;·&nbsp; Internal / Confidential',
      'Source windows: ' + esc(snap.dataLine), 'report') +
    periodBar(id) +
    renderSummary(snap) +
    renderWebsite(ch.website) +
    renderFacebook(ch.facebook) +
    renderInstagram(ch.instagram) +
    renderLinkedIn(ch.linkedin) +
    renderRecommendations(snap) +
    renderBizIQ() +
    renderL10() +
    pageFooter(snap.dataLine);

  applyDataLabels();
  document.getElementById('period').addEventListener('change', function () {
    render(this.value);
    document.getElementById('period').focus();
  });
  document.title = 'Sanctuary Recovery Centers — ' + snap.label;
}

render(REPORT_ORDER[0]);
</script>
</body></html>
