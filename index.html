<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanctuary Recovery Centers — Performance Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="report.css">
</head>
<body><div class="sheet" id="sheet"></div>
<script src="data.js"></script>
<script src="ui.js"></script>
<script>
/* ── channel section renderers ───────────────────────────────────────── */
function renderWebsite(c) {
  var meta = CHANNEL_META.website;
  if (!c.measured) { return mutedSection('website', c); }
  var s = '<section>' + sechead(meta.name, meta.color, c.source, c.window) +
    (c.windowNote ? '<div class="warn" style="margin:0 0 16px"><b>Two source windows:</b> ' + esc(c.windowNote) + '</div>' : '') +
    kpis(c.kpis, c.kpis.length === 3 ? 3 : null);

  if (c.weekly) {
    s += grid2(
      card(c.weekly.title, vbar(c.weekly.series, meta.color, chartW(true)), c.weekly.note),
      card(c.sources.title, table(c.sources.head, c.sources.rows), c.sources.note)
    );
  } else {
    s += grid2(
      card(c.sources.title, table(c.sources.head, c.sources.rows), c.sources.note),
      card(c.seo.title, table(c.seo.head, c.seo.rows))
    );
  }
  if (c.topPages) { s += card(c.topPages.title, table(c.topPages.head, c.topPages.rows)); }
  if (c.crawlers) { s += card(c.crawlers.title, table(c.crawlers.head, c.crawlers.rows), c.crawlers.note); }
  if (c.pending) {
    s += card('Not captured this period',
      table(['Metric', 'Status'], c.pending.map(function (x) { return [x, 'Pending — available on request']; })),
      c.pendingNote);
  }
  if (c.footnote) { s += '<p class="sub">' + c.footnote + '</p>'; }
  return s + '</section>';
}

function renderFacebook(c) {
  var meta = CHANNEL_META.facebook;
  if (!c.measured) { return mutedSection('facebook', c); }
  var s = '<section>' + sechead(meta.name, meta.color, c.source, c.window) + kpis(c.kpis);

  s += grid2(
    card(c.weekly.title, vbar(c.weekly.series, meta.color, chartW(true)), c.weekly.note),
    c.formats
      ? card(c.formats.title, hbar(c.formats.series, { barX: c.formats.barX, color: meta.color, W: chartW(true) }), c.formats.note)
      : card(c.supporting.title, table(c.supporting.head, c.supporting.rows))
  );
  s += c.peers
    ? grid2(card(c.topPosts.title, table(c.topPosts.head, c.topPosts.rows)),
            card(c.peers.title, table(c.peers.head, c.peers.rows), c.peers.note))
    : card(c.topPosts.title, table(c.topPosts.head, c.topPosts.rows));
  if (c.warn) { s += '<div class="warn">' + c.warn + '</div>'; }
  if (c.footnote) { s += '<p class="sub" style="margin-top:16px">' + c.footnote + '</p>'; }
  return s + '</section>';
}

function renderInstagram(c) {
  var meta = CHANNEL_META.instagram;
  if (!c.measured) { return mutedSection('instagram', c); }
  return '<section>' + sechead(meta.name, meta.color, c.source, c.window) +
    kpis(c.kpis) +
    grid2(
      card(c.weekly.title, vbar(c.weekly.series, meta.color, chartW(true))),
      card(c.viewSources.title, table(c.viewSources.head, c.viewSources.rows), c.viewSources.note)
    ) +
  '</section>';
}

function renderLinkedIn(c) {
  var meta = CHANNEL_META.linkedin;
  if (!c.measured) { return mutedSection('linkedin', c); }
  var s = '<section>' + sechead(meta.name, meta.color, c.source, c.window) + kpis(c.kpis);

  if (c.weekly) {
    s += grid2(card(c.weekly.title, vbar(c.weekly.series, meta.color, chartW(true)), c.weekly.note),
               card(c.visitors.title, table(c.visitors.head, c.visitors.rows)));
  } else if (c.monthly) {
    s += grid2(card(c.monthly.title, vbar(c.monthly.series, meta.color, chartW(true)), c.monthly.note),
               card(c.monthlyFollowers.title, vbar(c.monthlyFollowers.series, meta.color, chartW(true)), c.monthlyFollowers.note));
    s += grid2(card(c.visitors.title, table(c.visitors.head, c.visitors.rows)),
               card(c.search.title, table(c.search.head, c.search.rows)));
  }

  s += card(c.topPosts.title, table(c.topPosts.head, c.topPosts.rows));

  if (c.showCompetitors) {
    s += card(COMPETITORS.title + ' — ' + COMPETITORS.window,
      table(COMPETITORS.head, COMPETITORS.rows, { highlight: COMPETITORS.youIndex }),
      COMPETITORS.note);
  }

  if (c.industry) {
    s += grid2(card(c.industry.title, table(c.industry.head, c.industry.rows)),
               card(c.location.title, table(c.location.head, c.location.rows)));
  } else {
    s += grid2(card(c.location.title, table(c.location.head, c.location.rows)),
               card(c.jobFunction.title, table(c.jobFunction.head, c.jobFunction.rows)));
    s += grid2(card(c.visitorFunction.title, table(c.visitorFunction.head, c.visitorFunction.rows)),
               card(c.searchingCompanies.title, table(c.searchingCompanies.head, c.searchingCompanies.rows)));
  }
  if (c.warn) { s += '<div class="warn">' + c.warn + '</div>'; }
  if (c.footnote) { s += '<p class="sub" style="margin-top:16px">' + c.footnote + '</p>'; }
  return s + '</section>';
}

function mutedSection(key, c) {
  var meta = CHANNEL_META[key];
  return '<section class="muted">' +
    '<div class="sechead"><span class="dot" style="background:' + meta.color + '"></span><h2>' + meta.name + '</h2></div>' +
    '<p class="sub">' + (c.pending ? 'Verified export pending' : 'No export available for this reporting period') + '</p>' +
    (c.pending ? pendingExport(c.plannedWindow, c.lastWindow) : noExport(c.lastWindow)) +
  '</section>';
}

/* ── executive summary ───────────────────────────────────────────────── */
function renderSummary(snap) {
  var s = snap.summary;
  var legend = '<div class="legend">';
  s.reach.forEach(function (d) { legend += '<span><i style="background:' + d.color + '"></i>' + esc(d.label) + '</span>'; });
  legend += '</div>';

  return '<section>' +
    '<div class="eyebrow">Executive summary</div>' +
    '<h2 style="font-size:26px;margin:6px 0 0">Growth at a glance</h2>' +
    '<p class="lead">' + s.lead + '</p>' +
    kpis(s.kpis) +
    '<div class="card"><h3>Reach volume by platform</h3>' + legend + hbar(s.reach, { barX: 150, W: chartW(false) }) +
      (s.reachNote ? '<p class="note" style="font-size:11.5px;color:var(--muted);margin:6px 0 0">' + s.reachNote + '</p>' : '') +
    '</div>' +
    table(s.rollup.head, s.rollup.rows, { numeric: function (i) { return i > 0 && i < 5; } }) +
  '</section>';
}

function renderRecommendations(snap) {
  var s = '<section><div class="eyebrow">What to act on</div>' +
          '<h2 style="font-size:22px;margin:6px 0 14px">Recommendations</h2><ol class="flags">';
  snap.recommendations.forEach(function (r) { s += '<li>' + r + '</li>'; });
  return s + '</ol></section>';
}

/* ── BizIQ campaign report (vendor report — not period-scoped) ───────── */
function renderBizIQ() {
  var B = BIZIQ;
  return '<section>' +
  '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap">' +
    '<div>' +
      '<div class="sechead"><span class="dot" style="background:var(--gold)"></span><h2>' + esc(B.title) + '</h2></div>' +
      '<p class="sub">' + esc(B.source) + ' &nbsp;·&nbsp; reporting period: <span class="win-chip">' + esc(B.window) + '</span></p>' +
    '</div>' +
    '<img src="logo.png" alt="BizIQ — smart local marketing" style="height:44px;width:auto;display:block;flex:0 0 auto">' +
  '</div>' +
  '<p class="lead">' + B.intro + '</p>' +
  card(B.listings.title, table(B.listings.head, B.listings.rows)) +
  '<h3 style="font-size:15px;margin:18px 0 0;font-family:Inter,sans-serif;font-weight:700;letter-spacing:0">GMB insights</h3>' +
  kpis(B.gmb, 3) +
  grid2(
    '<div class="card"><h3>' + esc(B.rankings.title) + '</h3>' +
      table(B.rankings.head, B.rankings.rows, { numeric: function () { return false; } }) +
      '<h3 style="margin-top:16px">' + esc(B.distribution.title) + '</h3>' +
      table(B.distribution.head, B.distribution.rows) +
    '</div>',
    '<div class="card"><h3>' + esc(B.reputation.title) + '</h3>' +
      table(B.reputation.head, B.reputation.rows) +
      '<div class="warn">' + B.followUp + '</div>' +
    '</div>'
  ) +
  '<div class="warn">' + B.warn + '</div>' +
  '</section>';
}

function renderL10() {
  return '<section><div class="eyebrow">L10 meeting</div>' +
    '<h2 style="font-size:22px;margin:6px 0 4px">Updates &amp; action items</h2>' +
    '<p class="sub">' + esc(L10.source) + '</p>' +
    card(L10.owner, table(L10.head, L10.rows, { numeric: function () { return false; } })) +
    '<div class="placeholder" style="padding:16px">Other owners\' L10 items can be added here from the same dashboard on request.</div>' +
  '</section>';
}

/* ── period selector + full render ───────────────────────────────────── */
function periodBar(currentId) {
  var s = '<div class="periodbar"><label for="period">Reporting period</label>' +
          '<select id="period" aria-label="Reporting period">';
  REPORT_ORDER.forEach(function (id) {
    s += '<option value="' + id + '"' + (id === currentId ? ' selected' : '') + '>' + esc(REPORTS[id].label) + '</option>';
  });
  s += '</select><span class="meta">Each channel below shows its own source window — windows are not assumed to match.</span></div>';
  return s;
}

function render(id) {
  _current = id;
  var snap = REPORTS[id];
  var ch = snap.channels;
  document.getElementById('sheet').innerHTML =
    pageHeader('Performance Report',
      'Report date: ' + esc(snap.reportDate) + ' &nbsp;·&nbsp; Internal / Confidential',
      'Source windows: ' + esc(snap.dataLine), 'report') +
    periodBar(id) +
    renderSummary(snap) +
    renderWebsite(ch.website) +
    renderFacebook(ch.facebook) +
    renderInstagram(ch.instagram) +
    renderLinkedIn(ch.linkedin) +
    renderRecommendations(snap) +
    renderBizIQ() +
    renderL10() +
    pageFooter(snap.dataLine);

  applyDataLabels();
  document.getElementById('period').addEventListener('change', function () {
    render(this.value);
    document.getElementById('period').focus();
  });
  document.title = 'Sanctuary Recovery Centers — ' + snap.label;
}

var _current = REPORT_ORDER[0], _w = 0, _t;
function renderCurrent() { _w = chartW(false); render(_current); }
window.addEventListener('resize', function () {
  clearTimeout(_t);
  _t = setTimeout(function () { if (chartW(false) !== _w) { renderCurrent(); } }, 180);
});
renderCurrent();
</script>
</body></html>
