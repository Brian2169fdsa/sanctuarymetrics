<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCI Fundraising — Sanctuary CI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="report.css">
<style>
/* view tabs: the same pill as the sanctuaryci.org period chips */
.fr-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 0}
.fr-tabs button{all:unset;cursor:pointer;font-size:12px;font-weight:700;padding:7px 14px;border-radius:20px;
  border:1px solid var(--line);background:var(--paper);color:var(--muted)}
.fr-tabs button[aria-selected="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.fr-tabs button:focus-visible,.fr-btn:focus-visible,.fr-chip:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.fr-tabs small{opacity:.75;font-weight:600;margin-left:5px}
/* one bold headline under every chart */
.fr-head{font-size:13.5px;margin:8px 0 0;color:var(--ink)}
.fr-head b{font-weight:700}
.fr-k{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}
.fr-k .kpi .num{font-size:30px}
.fr-k .kpi .of{font-family:Inter,sans-serif;font-size:13px;color:var(--muted);font-weight:600;margin-left:4px}
.fr-k .kpi .meter-track{margin-top:8px;height:7px}
.tag{white-space:nowrap}
.tag.held{background:#fbeae6;color:#B23A1B}
.tag.ph{background:#fdf3e0;color:#B06F14}
.fr-tags{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 0}
.fr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px;align-items:start}
.fr-grid .card{margin:0}
.fr-meta{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.fr-meta b{color:var(--ink);font-weight:600}
.fr-card h3{font-family:Fraunces,serif;font-size:18px;font-weight:600;margin:2px 0 0}
.fr-eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--coral);font-weight:700}
details.fr-more{margin:12px 0 0;font-size:13px}
details.fr-more summary{cursor:pointer;font-weight:700;color:var(--teal);font-size:12.5px}
details.fr-more dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:10px 0 0}
details.fr-more dt{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding-top:2px}
details.fr-more dd{margin:0}
.fr-sw{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;margin:0 4px 4px 0;border:1px solid var(--line);background:#fff;color:var(--muted)}
.fr-sw.on{background:#e6f4ee;border-color:#cfe8dc;color:#2E8B6F;font-weight:700}
.fr-attn{list-style:none;padding:0;margin:0}
.fr-attn li{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.fr-attn li:last-child{border-bottom:0}
.fr-attn .tag{flex:0 0 auto}
.fr-live{border-left:4px solid var(--coral)}
.fr-big{font-family:Fraunces,serif;font-size:28px;line-height:1.1}
.fr-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fr-field{display:flex;flex-direction:column;gap:4px;flex:1 1 200px;min-width:0}
.fr-field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.fr-field input,.fr-field textarea,.fr-field select{font-family:inherit;font-size:13px;color:var(--ink);background:#fff;
  border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
.fr-field textarea{min-height:60px;resize:vertical}
.fr-field input:focus,.fr-field textarea:focus{outline:2px solid var(--blue);outline-offset:1px}
.fr-btn{font-family:inherit;font-size:12px;font-weight:700;color:var(--teal);background:#fff;border:1px solid var(--line);
  border-radius:8px;padding:6px 12px;cursor:pointer}
.fr-btn:hover{border-color:#cfdbe2;background:var(--paper)}
.fr-btn.solid{background:var(--teal);border-color:var(--teal);color:#fff}
.fr-btn.danger{color:#C0492B}
.fr-list{list-style:none;padding:0;margin:0}
.fr-list li{display:grid;grid-template-columns:1fr auto auto;gap:10px 14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.fr-list li:last-child{border-bottom:0}
.fr-list .due{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.fr-board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.fr-board .col{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.fr-board .col h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.fr-board .item{font-size:13px;padding:8px 0;border-top:1px solid var(--line)}
.fr-board .item b{display:block;font-weight:600}
.fr-board .item span{color:var(--muted);font-size:12px}
.fr-post{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin:0 0 14px}
.fr-post.blocked{border-left:4px solid #C0492B}
.fr-post .copytext{white-space:pre-wrap;font-size:13.5px;line-height:1.55;background:var(--paper);border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;margin:10px 0}
.fr-post .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.fr-post .when{font-weight:700;font-size:14px}
.fr-msg{font-size:12px;margin:6px 0 0;color:#C0492B}
.fr-msg.ok{color:#2E8B6F}
.fr-filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 14px}
.fr-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.fr-cal .dow{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:2px 4px}
.fr-cal .day{background:#fff;border:1px solid var(--line);border-radius:7px;min-height:86px;padding:5px;font-size:11px}
.fr-cal .day.out{background:transparent;border-style:dashed;opacity:.5}
.fr-cal .day.today{border-color:var(--coral);box-shadow:0 0 0 1px var(--coral) inset}
.fr-cal .day .n{font-weight:700;color:var(--muted);font-size:11px}
.fr-chip{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;margin:3px 0 0;padding:3px 6px;border-radius:5px;
  font-size:11px;line-height:1.3;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr-st-draft{background:#8796A0}.fr-st-in-review{background:#D98A1F}.fr-st-approved{background:#1C9AD6}
.fr-st-scheduled{background:#2C5468}.fr-st-posted{background:#2E8B6F}.fr-st-skipped{background:#B9C4CA}
.fr-st-held{background:#C0492B}
.fr-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--muted);margin:10px 0 0}
.fr-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.fr-auto.red{border-color:#f0c7bc;background:#fdf5f3}
.fr-auto.red h3{color:#B23A1B}
.fr-auto ul{margin:6px 0 0;padding-left:18px;font-size:13px}
.fr-calc input[type=range]{width:100%;accent-color:var(--teal)}
.fr-cost{display:grid;grid-template-columns:110px 1fr 90px;gap:8px;align-items:center;font-size:13px;margin:8px 0}
.fr-cost .bar{height:20px;border-radius:3px}
.fr-cost .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.fr-ref dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0;font-size:13.5px}
.fr-ref dt{color:var(--muted);font-weight:600}
.fr-ref dd{margin:0}
.fr-tl text{font-family:Inter,sans-serif}
@media (max-width:900px){.fr-board{grid-template-columns:1fr 1fr}.fr-k{grid-template-columns:1fr 1fr}}
@media (max-width:720px){
  .fr-cal{grid-template-columns:1fr}
  .fr-cal .dow,.fr-cal .day.out,.fr-cal .day.empty{display:none}
  .fr-cal .day{min-height:0}
  .fr-grid{grid-template-columns:1fr}
  .fr-list li{grid-template-columns:1fr}
  .fr-cost{grid-template-columns:80px 1fr 76px}
}
@media (max-width:480px){.fr-board,.fr-k{grid-template-columns:1fr}}
@media (max-width:720px), (pointer:coarse){
  .fr-tabs button{min-height:40px;display:inline-flex;align-items:center}
  .fr-field input,.fr-field select,.fr-field textarea{font-size:15px;min-height:42px}
  .fr-btn{min-height:40px}
}
</style>
</head>
<body><div class="sheet" id="sheet"></div>
<script src="data.js"></script>
<script src="ui.js"></script>
<script src="account.js"></script>
<script>
/* ── SCI Fundraising ───────────────────────────────────────────────────────
   Three sources, none of them holding donor data:
     data/sci-fundraising-data.json   the plan (source of truth for content)
     data/fundraising-metrics.json    live aggregates written by the n8n
                                      metrics sync (f3): totals, counts and
                                      percentages only
     /api/fundraising-state           the team's edits (checklist, decisions,
                                      post statuses) and the automations' run
                                      reports — Supabase, via lib/fundraising.js
   All dates and times are shown in America/Phoenix.                          */
var PLAN_URL = 'data/sci-fundraising-data.json';
var METRICS_URL = 'data/fundraising-metrics.json';
var STATE_URL = '/api/fundraising-state';
var PW_KEY = 'src_projects_pw';    /* same team password as the Projects page */
var TZ = 'America/Phoenix';
var TABS = [['overview', 'Overview'], ['campaigns', 'Campaigns'], ['checklist', 'Build checklist'],
            ['social', 'Social calendar'], ['automations', 'Automations'], ['donorbox', 'Donorbox setup']];
var POST_STATUS = [['draft', 'Draft'], ['in-review', 'In review'], ['approved', 'Approved'], ['scheduled', 'Scheduled'],
                   ['posted', 'Posted'], ['skipped', 'Skipped']];
var APPROVED_UP = { approved: 1, scheduled: 1, posted: 1 };
var CHECK_STATUS = [['not-started', 'Not started'], ['in-progress', 'In progress'], ['done', 'Done']];
/* how often each scheduled automation should run, in minutes; red when it hasn't run in twice that */
var EVERY = { f3: 15, f7: 1440, f8: 1440, f9: 1440, f10: 10080 };
var KEY_DATES = [['2026-12-01', 'Giving Tuesday'], ['2026-12-31', 'Dec 31: year-end'], ['2027-04-06', 'Arizona Gives Day'],
                 ['2027-04-15', 'Tax credit deadline'], ['2027-11-30', 'Giving Tuesday 2027']];
var COLORS = { 'always-on': '#2C5468', seasonal: '#E17F55' };

var PLAN = null, M = null, ITEMS = {}, ADMIN = false;
var STATE_OK = false, STATE_MSG = '';
var VIEW = 'overview';
var SOC = { view: 'list', campaign: '', channel: '', theme: '', status: '', when: 'next30', month: '', open: '' };
var FEE_VOL = 5000;

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function h(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

/* ── dates, in Phoenix ─────────────────────────────────────────────────── */
function phxDate(d) { return new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d); }
var TODAY = phxDate(new Date());
function dn(iso) { var p = iso.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]) / 864e5; }
function nd(n) { return new Date(n * 864e5).toISOString().slice(0, 10); }
function dayLabel(iso, opts) {
  return new Date(iso + 'T12:00:00Z').toLocaleDateString('en-US', Object.assign({ timeZone: 'UTC', month: 'short', day: 'numeric' }, opts || {}));
}
function longDay(iso) { return dayLabel(iso, { weekday: 'short', year: 'numeric' }); }
function stamp(isoTime) {
  if (!isoTime) { return '—'; }
  return new Date(isoTime).toLocaleString('en-US', { timeZone: TZ, month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + ' Phoenix';
}
function timeLabel(t) { if (!t) { return ''; } var p = t.split(':'); var hh = +p[0]; return (hh % 12 || 12) + ':' + p[1] + (hh < 12 ? ' a.m.' : ' p.m.'); }
function monday(iso) { var n = dn(iso); var dow = (new Date(n * 864e5).getUTCDay() + 6) % 7; return nd(n - dow); }

/* ── formatting ────────────────────────────────────────────────────────── */
function money(n) { return n == null ? '—' : '$' + fmt(Math.round(n)); }
function pctOf(a, b) { return b ? Math.round(a / b * 100) : 0; }
function tag(t, cls) { return '<span class="tag ' + (cls || 'eq') + '">' + h(t) + '</span>'; }
var HELD = 'Held: awaiting qualifying charity confirmation';
function isPlaceholder(s) { return /placeholder/i.test(String(s || '')); }
function headline(t) { return '<p class="fr-head"><b>' + t + '</b></p>'; }
function meter(label, val, of, color, note) {
  var p = of ? Math.min(100, val / of * 100) : 0;
  return '<div><div class="meter-top"><span class="meter-lab">' + label + '</span><span class="meter-val"><b>' + h(money(val)) +
    '</b> <span class="meter-of">of ' + h(money(of)) + ' · ' + pctOf(val, of) + '%</span></span></div>' +
    '<div class="meter-track"><div class="meter-fill" style="width:' + p.toFixed(1) + '%;background:' + (color || 'var(--teal)') + '"></div></div>' +
    (note ? '<p class="meter-note">' + note + '</p>' : '') + '</div>';
}

/* ── state ─────────────────────────────────────────────────────────────── */
function item(id) { return (ITEMS[id] && ITEMS[id].data) || {}; }
function checkStatus(id) { return item('check:' + id).status || 'not-started'; }
function decisionStatus(d) { return item('decision:' + d.id).status || d.status || 'open'; }
function postState(id) { return item('post:' + id); }
function postStatus(id) { return postState(id).status || 'draft'; }
function qco() { return item('setting:qco'); }
function qcoReady() { var q = qco(); return !!(q.confirmed && /^\d{5}$/.test(String(q.code || ''))); }
function autopostOn() { return item('setting:autopost').on === true; }

/* the plan posts plus the team's dated copies of template posts */
function allPosts() {
  var list = PLAN.socialPosts.map(function (p) { return p; });
  Object.keys(ITEMS).forEach(function (k) {
    if (ITEMS[k].kind !== 'copy') { return; }
    var c = ITEMS[k].data, tpl = PLAN.socialPosts.filter(function (p) { return p.id === c.template; })[0];
    if (!tpl) { return; }
    var copy = Object.assign({}, tpl, { id: k.replace(/^copy:/, ''), date: c.date, copyOf: tpl.id });
    delete copy.schedule;
    list.push(copy);
  });
  return list;
}
function blocker(p, data) {
  if (p.held && !qcoReady()) { return HELD + '. An admin records the confirmation and code below first.'; }
  if (p.needsRelease && !String(data.release || '').trim()) { return 'Record the signed release on this post before approving it.'; }
  if (p.needsApprovalFrom && !String(data.approvedBy || '').trim()) { return 'Record ' + p.needsApprovalFrom + '\'s approval before approving it.'; }
  return '';
}

function api(method, url, body) {
  var headers = body ? { 'Content-Type': 'application/json' } : {};
  if (lsGet(PW_KEY) !== null && !SM.me) { headers['X-Projects-Password'] = lsGet(PW_KEY); }
  return fetch(url, { method: method, headers: headers, credentials: 'same-origin', cache: 'no-store',
                      body: body ? JSON.stringify(body) : undefined })
    .then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) { var e = new Error(j.message || ('Request failed (' + r.status + ')')); e.status = r.status; throw e; }
        return j;
      });
    });
}
function loadState() {
  return api('GET', STATE_URL).then(function (j) {
    ITEMS = j.items || {}; ADMIN = !!j.admin; STATE_OK = true; STATE_MSG = '';
  }, function (e) {
    STATE_OK = false;
    STATE_MSG = e.status === 401 ? 'Sign in to change statuses — you are seeing the plan read-only.' : e.message;
  });
}
function save(id, data) {
  return api('PUT', STATE_URL, { id: id, data: data }).then(function (j) {
    ITEMS[id] = j.row || { data: data };
    return j;
  });
}

/* ── metrics, merged with the automations' own run reports ─────────────── */
function T() { return (M && M.totals) || {}; }
function raisedFor(planId) {
  var out = { raised: 0, donors: 0, donations: 0, plans: 0 };
  ((M && M.campaigns) || []).forEach(function (c) {
    if (c.planId !== planId) { return; }
    out.raised += +c.raisedUsd || 0; out.donors += +c.donors || 0; out.donations += +c.donations || 0; out.plans += +c.recurringPlans || 0;
  });
  return out;
}
function runInfo(id) {
  var m = ((M && M.automations) || []).filter(function (a) { return a.id === id; })[0] || {};
  var r = item('run:' + id);
  var out = { lastRun: m.lastRun || null, lastStatus: m.lastStatus || 'never', runs7d: +m.runs7d || 0, errors7d: +m.errors7d || 0, message: '' };
  if (r.lastRun && (!out.lastRun || Date.parse(r.lastRun) >= Date.parse(out.lastRun))) {
    out.lastRun = r.lastRun; out.lastStatus = r.lastStatus; out.message = r.message || '';
  }
  if (r.recent) {
    var cut = Date.now() - 7 * 864e5;
    var recent = r.recent.filter(function (x) { return Date.parse(x.at) >= cut; });
    out.runs7d = Math.max(out.runs7d, recent.length);
    out.errors7d = Math.max(out.errors7d, recent.filter(function (x) { return !x.ok; }).length);
  }
  var every = EVERY[id];
  out.stale = !!(every && out.lastRun && Date.now() - Date.parse(out.lastRun) > every * 2 * 60000);
  out.red = out.lastStatus === 'error' || out.stale;
  return out;
}

/* ── charts (same geometry and classes as ui.js) ───────────────────────── */
function line(points, color, W, isMoney) {
  var n = points.length; if (n < 2) { return ''; }
  var padX = isCompact(W) ? 22 : 40, base = 176, H = 140;
  var max = 0; points.forEach(function (p) { if (p.value > max) { max = p.value; } }); if (!max) { max = 1; }
  var xs = function (i) { return padX + i * ((W - padX * 2) / (n - 1)); };
  var ys = function (v) { return base - v / max * H; };
  var every = Math.ceil(n / (isCompact(W) ? 5 : 10));
  var s = '<svg viewBox="0 0 ' + W + ' 200" class="chart" role="img" aria-label="trend chart"><line x1="0" y1="176" x2="' + W + '" y2="176" stroke="#E4EBEF"/>';
  var d = '';
  points.forEach(function (p, i) { d += (i ? ' L' : 'M') + r1(xs(i)) + ' ' + r1(ys(p.value)); });
  s += '<path d="' + d + ' L' + r1(xs(n - 1)) + ' 176 L' + r1(xs(0)) + ' 176 Z" fill="' + color + '" opacity=".10"/>' +
       '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  var peak = 0; points.forEach(function (p, i) { if (p.value > points[peak].value) { peak = i; } });
  points.forEach(function (p, i) {
    var x = xs(i), y = ys(p.value), last = i === n - 1;
    if (n <= 14 || last || (i === peak && p.value > 0)) {
      s += '<circle cx="' + r1(x) + '" cy="' + r1(y) + '" r="4" fill="#fff" stroke="' + color + '" stroke-width="2.5"/>' +
           '<text x="' + r1(x) + '" y="' + r1(Math.max(14, y - 11)) + '" text-anchor="' + (last && n > 14 ? 'end' : 'middle') + '" class="bval">' +
           (isMoney ? money(p.value) : fmt(p.value)) + '</text>';
    }
    if ((i % every === 0 && n - 1 - i >= every / 2) || last) {
      s += '<text x="' + r1(x) + '" y="192" text-anchor="' + (last ? 'end' : 'middle') + '" class="blab">' + h(p.label) + '</text>';
    }
  });
  return s + '</svg>';
}
/* two series side by side per group (planned vs posted) */
function vbar2(groups, colors, W) {
  var n = groups.length; if (!n) { return ''; }
  var gap = n > 20 ? 3 : (isCompact(W) ? 6 : 12), gw = (W - gap * (n - 1)) / n, bw = gw / 2, base = 176, H = 140;
  var max = 1; groups.forEach(function (g) { max = Math.max(max, g.a, g.b); });
  var every = Math.ceil(n / (isCompact(W) ? 5 : 12));
  var s = '<svg viewBox="0 0 ' + W + ' 200" class="chart" role="img" aria-label="grouped bar chart"><line x1="0" y1="176" x2="' + W + '" y2="176" stroke="#E4EBEF"/>';
  groups.forEach(function (g, i) {
    var x = i * (gw + gap);
    [[g.a, colors[0]], [g.b, colors[1]]].forEach(function (v, k) {
      var bh = v[0] / max * H;
      s += '<rect x="' + r1(x + k * bw) + '" y="' + r1(base - bh) + '" width="' + r1(Math.max(1, bw - 1)) + '" height="' + r1(bh) + '" rx="2" fill="' + v[1] + '"/>';
    });
    if (n <= 16) { s += '<text x="' + r1(x + gw / 2) + '" y="' + r1(base - Math.max(g.a, g.b) / max * H - 6) + '" text-anchor="middle" class="bval">' + g.a + '</text>'; }
    if (i % every === 0) { s += '<text x="' + r1(i === 0 ? x : x + gw / 2) + '" y="192" text-anchor="' + (i === 0 ? 'start' : 'middle') + '" class="blab">' + h(g.label) + '</text>'; }
  });
  return s + '</svg>';
}

/* ── page chrome ───────────────────────────────────────────────────────── */
function syncLine() {
  return M && M.generatedAt ? 'Live numbers synced ' + stamp(M.generatedAt) : 'Live numbers: awaiting first sync';
}
function render() {
  var y = scrollY;
  var sheet = document.getElementById('sheet');
  if (!PLAN) {
    sheet.innerHTML = pageHeader('SCI Fundraising', 'Sanctuary CI &nbsp;·&nbsp; Internal / Confidential', 'Loading…', 'fundraising') +
      '<section><p class="lead">' + (STATE_MSG || 'Loading the fundraising plan…') + '</p></section>';
    return;
  }

  var svg = '<svg viewBox="0 0 ' + W + ' ' + Hh + '" class="chart" role="img" aria-label="Fee cost by monthly volume">' +
    '<line x1="0" y1="' + base + '" x2="' + W + '" y2="' + base + '" stroke="#E4EBEF"/>' +
    '<line x1="' + r1(xs(0)) + '" y1="' + r1(ys(0)) + '" x2="' + r1(xs(top)) + '" y2="' + r1(ys(top * 0.0295)) + '" stroke="#2C5468" stroke-width="2.5"/>' +
    '<line x1="' + r1(xs(0)) + '" y1="' + r1(ys(150)) + '" x2="' + r1(xs(top)) + '" y2="' + r1(ys(150 + top * 0.0175)) + '" stroke="#E17F55" stroke-width="2.5"/>' +
    '<line x1="' + r1(xs(12500)) + '" y1="10" x2="' + r1(xs(12500)) + '" y2="' + base + '" stroke="#B23A1B" stroke-dasharray="3 3"/>' +
    '<text x="' + r1(xs(12500) + 5) + '" y="20" class="blab">break-even $12,500</text>' +
    '<circle cx="' + r1(xs(Math.min(v, top))) + '" cy="' + r1(ys(Math.min(std, top * 0.0295))) + '" r="4.5" fill="#fff" stroke="#2C5468" stroke-width="2.5"/>' +
    '<circle cx="' + r1(xs(Math.min(v, top))) + '" cy="' + r1(ys(Math.min(pro, top * 0.0295))) + '" r="4.5" fill="#fff" stroke="#E17F55" stroke-width="2.5"/>' +
    '<text x="' + pad + '" y="' + (base + 16) + '" class="blab">$0</text><text x="' + (W - pad) + '" y="' + (base + 16) + '" text-anchor="end" class="blab">$30,000 a month</text></svg>';
  return '<div class="fr-calc"><div class="fr-field"><label for="fee-vol">Monthly donation volume: <b style="color:var(--ink)">' + money(v) + '</b></label>' +
    '<input type="range" id="fee-vol" min="0" max="30000" step="250" value="' + v + '" aria-valuetext="' + money(v) + ' a month"></div>' +
    '<div class="fr-cost"><span>Standard 2.95%</span><div class="bar" style="width:' + (std / max * 100).toFixed(1) + '%;background:#2C5468"></div><span class="v">' + money(std) + '</span></div>' +
    '<div class="fr-cost"><span>Pro $150 + 1.75%</span><div class="bar" style="width:' + (pro / max * 100).toFixed(1) + '%;background:#E17F55"></div><span class="v">' + money(pro) + '</span></div>' +
    svg + '<div class="fr-legend"><span><i style="background:#2C5468"></i>Standard</span><span><i style="background:#E17F55"></i>Pro</span></div>' +
    headline(h(head)) + '<p class="fr-meta">Platform fees only. Card processing (Stripe, PayPal) is the same on both plans, and the $17 Zapier and API add-on is needed either way. ' +
    'Peer-to-peer, ticketing and the Membership Form are ' + PLAN.donorbox.higherFeePct + '% on Standard.</p></div>';
}
function donorbox() {
  var d = PLAN.donorbox;
  var ref = function (rows) { return '<div class="fr-ref"><dl>' + rows.map(function (r) { return '<dt>' + h(r[0]) + '</dt><dd>' + r[1] + '</dd>'; }).join('') + '</dl></div>'; };
  return '<section>' + sechead('Donorbox setup', 'var(--coral)', 'Plan, fees and API reference · campaigns are built by hand in Donorbox', '') +
    grid2(
      card('Plan and fees', ref([
        ['Plan', h(d.plan)], ['Platform fee', d.platformFeePct + '%'],
        ['Higher fee (' + d.higherFeePct + '%)', h(d.higherFeeAppliesTo.join(', '))],
        ['Add-ons', d.addOns.map(function (a) { return h(a.name) + ': $' + a.monthlyUsd + '/month' + (a.required ? ' (required)' : ''); }).join('<br>')],
        ['Pro break-even', money(d.proBreakEvenMonthlyUsd) + ' a month']
      ]) + '<h3 style="margin:16px 0 8px">Processing</h3>' + ref([
        ['Stripe card', h(d.processing.stripeCard)], ['Stripe ACH', h(d.processing.stripeAch)], ['PayPal', h(d.processing.paypal)]
      ])) +
      card('API', ref([
        ['Base URL', '<code>' + h(d.api.baseUrl) + '</code>'], ['Auth', h(d.api.auth)], ['Access', tag(d.api.access, 'cold') + ' never write'],
        ['Endpoints', d.api.endpoints.map(function (e) { return '<code>' + h(e) + '</code>'; }).join(' ')],
        ['Webhooks', h(d.api.webhooks)], ['Docs', '<a href="' + h(d.api.docs) + '" target="_blank" rel="noopener">' + h(d.api.docs) + '</a>']
      ]) + '<p class="fr-meta" style="margin-top:12px">Keys live in n8n credentials only. See automations/README.md.</p>'),
      card('Standard or Pro? Fee calculator', feeCalc())
    ) + '</section>';
}

/* ── events ────────────────────────────────────────────────────────────── */
function flash(id, text, ok) {
  var el = document.querySelector('[data-msg="' + id + '"]');
  if (el) { el.textContent = text; el.className = 'fr-msg' + (ok ? ' ok' : ''); }
}
function copyText(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) { return navigator.clipboard.writeText(t); }
  var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } finally { document.body.removeChild(ta); }
  return Promise.resolve();
}
function wire() {
  document.querySelectorAll('[data-tab]').forEach(function (b) {
    b.addEventListener('click', function () { location.hash = b.getAttribute('data-tab'); });
  });
  document.querySelectorAll('select[data-status]').forEach(function (s) {
    s.addEventListener('change', function () {
      var id = s.getAttribute('data-status'), v = s.value;
      if (id.indexOf('post:') === 0 && APPROVED_UP[v]) {
        var pid = id.slice(5), p = allPosts().filter(function (x) { return x.id === pid; })[0];
        var why = p && blocker(p, postState(pid));
        if (why) { s.value = postStatus(pid); flash(id, why); return; }
      }
      s.disabled = true;
      save(id, { status: v }).then(render, function (e) { s.disabled = false; flash(id, e.message); loadState().then(render); });
    });
  });
  document.querySelectorAll('[data-save]').forEach(function (inp) {
    inp.addEventListener('change', function () {
      var id = inp.getAttribute('data-save'), body = {};
      body[inp.getAttribute('data-key')] = inp.value;
      flash(id, 'Saving…', true);
      save(id, body).then(function () {
        flash(id, 'Saved', true);
        /* a release or approval can unblock a post: refresh its badges */
        if (/^post:/.test(id) && /release|approvedBy|finalLink/.test(inp.getAttribute('data-key'))) { render(); }
      }, function (e) { flash(id, e.message); });
    });
  });
  document.querySelectorAll('[data-copy]').forEach(function (b) {
    b.addEventListener('click', function () {
      var id = b.getAttribute('data-copy'), p = allPosts().filter(function (x) { return x.id === id; })[0];
      copyText(finalCopy(p, postState(id))).then(function () { b.textContent = 'Copied'; setTimeout(function () { b.textContent = 'Copy text'; }, 1500); });
    });
  });
  document.querySelectorAll('[data-mkcopy]').forEach(function (b) {
    b.addEventListener('click', function () {
      var id = b.getAttribute('data-mkcopy'), date = (document.getElementById('cd-' + id) || {}).value;
      if (!date) { flash('post:' + id, 'Pick a date first.'); return; }
      b.disabled = true;
      api('POST', STATE_URL + '?action=copy', { template: id, date: date }).then(function () { return loadState(); }).then(function () {
        flash('post:' + id, 'Copy added for ' + longDay(date) + '.', true); render();
      }, function (e) { b.disabled = false; flash('post:' + id, e.message); });
    });
  });
  document.querySelectorAll('[data-rmcopy]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (!confirm('Remove this dated copy and its status?')) { return; }
      api('DELETE', STATE_URL + '?id=copy:' + encodeURIComponent(b.getAttribute('data-rmcopy'))).then(loadState).then(render, function (e) { alert(e.message); });
    });
  });
  document.querySelectorAll('[data-filter]').forEach(function (s) {
    s.addEventListener('change', function () { SOC[s.getAttribute('data-filter')] = s.value; render(); });
  });
  document.querySelectorAll('[data-socview]').forEach(function (b) {
    b.addEventListener('click', function () { SOC.view = b.getAttribute('data-socview'); render(); });
  });
  document.querySelectorAll('[data-open]').forEach(function (b) {
    b.addEventListener('click', function () {
      SOC.open = b.getAttribute('data-open'); render();
      var el = document.getElementById('post-' + SOC.open); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    });
  });
  var calm = document.getElementById('calm');
  if (calm) { calm.addEventListener('change', function () { SOC.month = calm.value; SOC.open = ''; render(); }); }
  var ap = document.querySelector('[data-autopost]');
  if (ap) {
    ap.addEventListener('click', function () {
      var on = ap.getAttribute('data-autopost') === 'on';
      if (on && !confirm('Turn auto-posting on? The daily queue will send APPROVED posts to the connected scheduler.')) { return; }
      save('setting:autopost', { on: on }).then(render, function (e) { alert(e.message); });
    });
  }
  var qs = document.getElementById('qco-save');
  if (qs) {
    qs.addEventListener('click', function () {
      save('setting:qco', { code: document.getElementById('qco-code').value.trim(), source: document.getElementById('qco-src').value,
                            confirmed: document.getElementById('qco-ok').checked }).then(render, function (e) { flash('setting:qco', e.message); });
    });
  }
  if (document.getElementById('fee-vol')) { wire.fee(); }
}
/* the slider re-wires itself after each redraw of the calculator */
wire.fee = function () {
  var fv = document.getElementById('fee-vol');
  fv.addEventListener('input', function () {
    FEE_VOL = +fv.value;
    fv.closest('.fr-calc').outerHTML = feeCalc();
    var again = document.getElementById('fee-vol'); again.focus(); wire.fee();
  });
};

function route() {
  var t = location.hash.replace('#', '');
  VIEW = TABS.some(function (x) { return x[0] === t; }) ? t : 'overview';
  render();
}
addEventListener('hashchange', function () { scrollTo(0, 0); route(); });
var resizeT, lastW = innerWidth;
addEventListener('resize', function () {
  clearTimeout(resizeT);
  resizeT = setTimeout(function () { if (innerWidth !== lastW) { lastW = innerWidth; render(); } }, 200);
});
/* pick up a teammate's changes when the tab comes back into view */
var lastLoad = Date.now();
document.addEventListener('visibilitychange', function () {
  var typing = document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (document.visibilityState === 'visible' && Date.now() - lastLoad > 15000 && !typing) { lastLoad = Date.now(); loadState().then(render); }
});

render();
var getJSON = function (u) { return fetch(u, { cache: 'no-store', credentials: 'same-origin' }).then(function (r) { if (!r.ok) { throw new Error(u + ': ' + r.status); } return r.json(); }); };
Promise.all([
  getJSON(PLAN_URL),
  getJSON(METRICS_URL).catch(function () { return { generatedAt: null, totals: {}, campaigns: [], automations: [] }; }),
  SM.ready.then(loadState)
]).then(function (r) { PLAN = r[0]; M = r[1]; route(); loadToSend(); }, function (e) { STATE_MSG = 'Could not load the plan: ' + h(e.message); render(); });
</script>
