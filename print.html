<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanctuary Recovery Centers — Print Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Jost:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="report.css">
<style>
/* ── card preview ── */
.po-cards{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:6px 0 18px}
.po-cards figure{margin:0}
.po-cards figcaption{font-size:12px;color:var(--muted);margin-top:6px;text-align:center}
.po-cards img,.bc{width:100%;aspect-ratio:1050/600;border-radius:10px;box-shadow:0 8px 24px rgba(22,38,59,.18);display:block}
/* the live card: blank artwork with the typed details laid over it,
   positioned in % of the 1050×600 artwork so it scales with the page */
.bc{position:relative;background:#01173B url(print/business-card-blank.png) center/cover no-repeat;
  container-type:inline-size;font-family:Jost,Futura,'Century Gothic',sans-serif;color:#fff;overflow:hidden}
.bc-in{position:absolute;left:9.6%;top:25.5%;right:46%}
.bc-name{font-size:3.4cqw;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc-title{font-size:3.05cqw;font-style:italic;margin-top:2.2cqw;padding-bottom:.9cqw;
  border-bottom:.28cqw solid #EE6A2C;display:inline-block;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.bc-row{display:flex;align-items:center;gap:1.8cqw;font-size:2.45cqw;margin-top:2.25cqw;white-space:nowrap}
.bc-row:first-of-type{margin-top:3.1cqw}
.bc-row span{overflow:hidden;text-overflow:ellipsis}
.bc-ic{flex:none;width:3.7cqw;height:3.7cqw;background:#EE6A2C;display:grid;place-items:center}
.bc-ic svg{width:62%;height:62%;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bc-empty{opacity:.45}
/* ── forms ── */
.po-form{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.po-f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.po-f input,.po-f select,.po-f textarea{font-family:Inter,sans-serif;font-size:14px;font-weight:400;text-transform:none;letter-spacing:0;
  color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.po-f textarea{resize:vertical;min-height:84px;line-height:1.45}
.po-f input:focus,.po-f select:focus,.po-f textarea:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:transparent}
.po-wide{grid-column:1/-1}
.po-sec{grid-column:1/-1;font-family:Fraunces,serif;font-size:17px;font-weight:600;margin:8px 0 -4px;color:var(--ink)}
.po-foot{grid-column:1/-1;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:4px}
.po-err{grid-column:1/-1;padding:10px 12px;border-radius:9px;background:#fbeae6;color:#8f2f1b;font-size:13px}
.po-ok{grid-column:1/-1;padding:12px 14px;border-radius:9px;background:#e9f5ee;color:#1f5a37;font-size:14px}
.po-err[hidden],.po-ok[hidden],.po-f[hidden]{display:none}
/* ── the shop: one tile per product ── */
.sh-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.sh-cats{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}
.sh-cat{all:unset;box-sizing:border-box;cursor:pointer;padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:#fff;
  font-size:13px;font-weight:600;color:var(--ink)}
.sh-cat:hover{border-color:#bcd3df}
.sh-cat[aria-pressed="true"]{background:#16263B;border-color:#16263B;color:#fff}
.sh-cat:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sh-cat small{font-weight:500;opacity:.7;margin-left:4px}
.sh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.sh{position:relative;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;
  text-decoration:none;color:var(--ink);transition:box-shadow .15s,transform .15s,border-color .15s}
.sh:hover{box-shadow:0 14px 30px rgba(22,38,59,.14);transform:translateY(-3px);border-color:#cfdde5}
.sh:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sh[hidden]{display:none}
.sh-img{position:relative;height:250px;background:linear-gradient(160deg,#f3f7fa,#e6eef3);display:grid;place-items:center;overflow:hidden}
.sh-img img.fly{height:214px;width:auto;max-width:none;border-radius:4px;box-shadow:0 10px 24px rgba(22,38,59,.22);transition:transform .2s}
.sh:hover .sh-img img.fly{transform:scale(1.04)}
.sh-img .stack{position:relative;width:80%;aspect-ratio:1050/600}
.sh-img .stack img{position:absolute;width:100%;border-radius:6px;box-shadow:0 10px 22px rgba(22,38,59,.25);transition:transform .2s}
.sh-img .stack img:first-child{transform:rotate(-7deg) translate(-6%,-10%)}
.sh-img .stack img:last-child{transform:rotate(4deg) translate(5%,12%)}
.sh:hover .sh-img .stack img:first-child{transform:rotate(-9deg) translate(-9%,-13%)}
.sh-badge{position:absolute;top:12px;left:12px;background:#16263B;color:#fff;font-size:11px;font-weight:700;padding:4px 9px;border-radius:12px}
.sh-badge.or{background:#EE6A2C}
.sh-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.sh-kind{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#c0572b}
.sh-body b{font-family:Fraunces,serif;font-size:18px;font-weight:600;line-height:1.25}
.sh-body p{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
.sh-foot{margin-top:auto;padding-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sh-foot span{font-size:12px;color:var(--muted)}
.sh-foot .sh-go{font-size:13px;font-weight:700;color:#fff;background:#2C5468;padding:7px 12px;border-radius:8px;white-space:nowrap}
.sh:hover .sh-go{background:#16263B}
.sh-new .sh-img{background:repeating-linear-gradient(135deg,#fbf3ee,#fbf3ee 12px,#f7ece5 12px,#f7ece5 24px)}
.sh-new .plus{width:64px;height:64px;border-radius:50%;background:#EE6A2C;color:#fff;font-size:38px;line-height:64px;text-align:center;
  font-weight:500;box-shadow:0 10px 22px rgba(238,106,44,.35)}
.sh-new .sh-go{background:#EE6A2C}
.sh-img img.deck{width:88%;height:auto;max-width:none;border-radius:6px;box-shadow:0 10px 24px rgba(22,38,59,.22);transition:transform .2s}
.sh:hover .sh-img img.deck{transform:scale(1.04)}
.sh-img .deck-none{font-size:13px;color:var(--muted)}
.sh-deck .sh-img{background:linear-gradient(160deg,#16263B,#2C5468)}
.sh-deck .plus{width:64px;height:64px;border-radius:50%;background:#1C9AD6;color:#fff;font-size:30px;line-height:64px;text-align:center;
  box-shadow:0 10px 22px rgba(28,154,214,.35)}
.sh-back{display:inline-block;font-size:13px;font-weight:600;color:var(--blue);text-decoration:none;margin-bottom:8px}
.sh-back:hover{text-decoration:underline}
/* ── order status + hand-out log ── */
.or-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.or-sum{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 16px}
.or-sum div{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 14px;min-width:104px}
.or-sum b{display:block;font-family:Fraunces,serif;font-size:22px;font-weight:600;line-height:1.1}
.or-sum span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.or-list{display:flex;flex-direction:column;gap:10px}
.or{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:start;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:12px 14px}
.or.done{opacity:.7}
.or-th{width:64px;height:82px;border-radius:6px;background:linear-gradient(160deg,#f3f7fa,#e6eef3);display:grid;place-items:center;overflow:hidden}
.or-th img{width:100%;height:100%;object-fit:cover}
.or-th i{font-style:normal;font-size:24px;color:#2C5468}
.or-name{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.or-name b{font-family:Fraunces,serif;font-size:16.5px;font-weight:600}
.or-pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;background:#eef3f6;color:#2C5468;white-space:nowrap}
.or-pill.s-requested{background:#fff4e5;color:#9a5b00}
.or-pill.s-ordered{background:#e8f3fb;color:#14628a}
.or-pill.s-shipped{background:#ece9fb;color:#4a3aa8}
.or-pill.s-delivered{background:#e6f4ee;color:#1f6b4f}
.or-pill.s-handed_out{background:#eef3f6;color:var(--muted)}
.or-pill.s-cancelled{background:#fbeae6;color:#a33a20}
.or-pill.late{background:#fbeae6;color:#a33a20}
.or-meta{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.or-steps{display:flex;margin:10px 0 2px;max-width:460px}
.or-steps span{flex:1;position:relative;font-size:10.5px;font-weight:600;color:#9aa8b0;padding-top:14px;text-align:center}
.or-steps span::before{content:'';position:absolute;top:3px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#d6e0e6;z-index:1}
.or-steps span::after{content:'';position:absolute;top:7px;left:-50%;width:100%;height:2px;background:#d6e0e6}
.or-steps span:first-child::after{display:none}
.or-steps span.on{color:var(--ink)}
.or-steps span.on::before{background:#2E8B6F}
.or-steps span.on::after{background:#2E8B6F}
.or-steps span.now::before{box-shadow:0 0 0 4px rgba(46,139,111,.2)}
.or-stock{margin-top:8px;font-size:12.5px;color:var(--ink)}
.or-bar{height:6px;border-radius:4px;background:#e6eef3;overflow:hidden;margin-top:5px;max-width:460px}
.or-bar i{display:block;height:100%;background:#EE6A2C}
.or-act{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.or-act button{font-family:inherit;font-size:12px;font-weight:700;border-radius:8px;padding:7px 11px;cursor:pointer;white-space:nowrap;
  border:1px solid var(--line);background:#fff;color:var(--ink)}
.or-act button:hover{border-color:#bcd3df}
.or-act button.go{background:#2C5468;border-color:#2C5468;color:#fff}
.or-act button.go:hover{background:#16263B}
.or-edit{grid-column:1/-1;border-top:1px solid var(--line);padding-top:12px;margin-top:2px}
.or-edit[hidden]{display:none}
.or-tabs{display:flex;gap:8px;margin:0 0 12px}
.or-empty{padding:16px;border:2px dashed #cbd8df;border-radius:11px;color:var(--muted);font-size:13px;text-align:center}
.ho-wrap{margin-top:26px}
.ho-tbl td,.ho-tbl th{font-size:13px}
.ho-tbl .x{all:unset;cursor:pointer;color:#a33a20;font-size:12px;font-weight:600}
.ho-tbl .x:hover{text-decoration:underline}
.ho-places{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.ho-places span{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px 10px}
.ho-places b{font-weight:700}
@media (max-width:720px){
  .po-cards,.po-form{grid-template-columns:1fr}
  .sh-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .sh-img{height:190px}
  .sh-img img.fly{height:162px}
  .sh-body b{font-size:16px}
  .sh-foot{flex-direction:column;align-items:flex-start}
  .or-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .or-sum div{min-width:0;padding:8px}
  .or-sum b{font-size:18px}
  .or-sum span{font-size:9.5px;letter-spacing:.04em}
  .or{grid-template-columns:48px 1fr}
  .or-th{width:48px;height:62px}
  .or-act{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}
}
</style>
</head>
<body><div class="sheet" id="sheet"></div>
<script src="data.js"></script>
<script src="ui.js"></script>
<script src="account.js"></script>
<script src="flyers.js"></script>
<script src="chat.js" defer></script>
<script>
/* ── print orders: the print shop ─────────────────────────────────────────
   A shop page: one tile per product. Business cards open the card designer
   (print.html#cards), each flyer opens its editor (flyer.html), and the
   "new flyer" tile opens a brief (print.html#new-flyer). Presentations
   (presentations.html) are listed here too, one tile per deck.

   Staff request business cards and flyers here. Each request is sent to
   /api/requests (see api/requests.js), which files it as a new
   task on the Projects page — that list is where it's tracked and ticked
   off once ordered.

   Business cards: the design is fixed; people only fill in their details.
   Flyers: a small tile for each design (flyers.js). A tile opens the flyer
   full size on flyer.html, where people click any part of it to ask for a
   change and say how many to print. A design that doesn't exist yet is a
   "new flyer" request, at the end of the flyers section.

   Order status (bottom of the shop): every print order and where it is,
   plus the hand-out log — see "order status + hand-out log" below.

   To add a flyer: see the top of flyers.js. */
var CARD_QTY = [250, 500, 1000];
var FLYER_QTY = [0, 25, 50, 100, 250, 500, 1000];
var API = '/api/requests';
var PW_KEY = 'src_projects_pw';   /* same team password as the Projects page */
var ME_KEY = 'src_print_me_v1';   /* remembers the requester's name/email */

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* private mode */ } }
function me() { try { return JSON.parse(lsGet(ME_KEY)) || {}; } catch (e) { return {}; } }

var ICONS = {
  email: '<path d="M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0zm0 0v1.5a2.5 2.5 0 0 0 5 0V12a9 9 0 1 0-4 7.5"/>',
  phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
  web: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>'
};
function icon(k) { return '<span class="bc-ic"><svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[k] + '</svg></span>'; }

/* ── live card preview ────────────────────────────────────────────────── */
function cardInner(c) {
  var line = function (v, ph) {
    return v ? '<span>' + esc(v) + '</span>' : '<span class="bc-empty">' + esc(ph) + '</span>';
  };
  return '<div class="bc-in">' +
    '<div class="bc-name">' + line(c.name, 'Your Name') + '</div>' +
    '<div class="bc-title">' + line(c.title, 'Your Job Title') + '</div>' +
    '<div class="bc-row">' + icon('email') + line(c.email, 'name@sanctuaryrc.com') + '</div>' +
    '<div class="bc-row">' + icon('phone') + line(c.phone, '(480) 000-0000') + '</div>' +
    '<div class="bc-row">' + icon('web') + line(c.website, 'SanctuaryRC.com') + '</div>' +
  '</div>';
}
function cardValues() {
  var v = function (id) { return document.getElementById(id).value.trim(); };
  return { name: v('bc-name'), title: v('bc-title'), email: v('bc-email'), phone: v('bc-phone'), website: v('bc-web') };
}
function refreshCard() { document.getElementById('bc-live').innerHTML = cardInner(cardValues()); }
/* (480) 925-2451 style as people type a 10-digit number */
function fmtPhone(s) {
  var d = s.replace(/\D/g, '');
  if (d.length === 11 && d[0] === '1') { d = d.slice(1); }
  if (d.length !== 10) { return s; }
  return '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6);
}

/* ── shared form bits ─────────────────────────────────────────────────── */
function field(label, id, attrs, wide) {
  return '<label class="po-f' + (wide ? ' po-wide' : '') + '">' + label + '<input id="' + id + '" ' + attrs + '></label>';
}
function qtySelect(id, list, label) {
  return '<label class="po-f">' + label + '<select id="' + id + '">' +
    list.map(function (n, i) { return '<option value="' + n + '"' + (i === 0 ? ' selected' : '') + '>' + (n ? fmt(n) : 'None yet — design first') + '</option>'; }).join('') +
    '</select></label>';
}
function requesterFields(pfx) {
  /* signed in: requests are filed under the account anyway (api/requests.js) */
  var m = SM.me ? { name: SM.me.name, email: SM.me.email } : me();
  return '<div class="po-sec">Who is asking</div>' +
    field('Your name', pfx + '-by', 'type="text" maxlength="120" autocomplete="name" value="' + esc(m.name || '') + '" required') +
    field('Your email', pfx + '-byemail', 'type="email" maxlength="200" autocomplete="email" value="' + esc(m.email || '') + '"') +
    field('Needed by', pfx + '-need', 'type="date"') +
    field('Deliver to', pfx + '-deliver', 'type="text" maxlength="300" placeholder="e.g. Gilbert office front desk"') +
    '<label class="po-f po-wide">Anything else<textarea id="' + pfx + '-notes" rows="2" maxlength="2000" ' +
      'placeholder="Optional"></textarea></label>';
}
function formFoot(pfx, btn) {
  return '<div class="po-err" id="' + pfx + '-err" role="alert" hidden></div>' +
    '<div class="po-ok" id="' + pfx + '-ok" role="status" hidden></div>' +
    '<div class="po-foot"><button type="submit" class="btn" id="' + pfx + '-go">' + btn + '</button></div>';
}

/* ── sections ─────────────────────────────────────────────────────────── */
function passwordCard() {
  if (lsGet(PW_KEY) !== null || SM.me) { return ''; }
  if (SM.microsoft) { return SM.signInCard('print.html', 'Requests are sent under your name. Sign in with your Sanctuary Microsoft account — the same login as Outlook and Teams.'); }
  return '<div class="card"><form class="addform" id="pwform" style="grid-template-columns:2fr auto">' +
    '<div class="f"><label for="pw">Team password</label><input type="password" id="pw" autocomplete="current-password" ' +
    'style="font-family:inherit;font-size:13.5px;padding:9px 11px;border:1px solid var(--line);border-radius:8px"></div>' +
    '<button class="btn" type="submit">Save</button></form>' +
    '<p class="sub" style="margin:8px 0 0">Requests need the team password. Enter it once — this browser will remember it.</p></div>';
}
function cardsSection() {
  return '<section id="cards">' + backLink() +
    '<div class="eyebrow">Business cards</div>' +
    '<h2 style="font-size:26px;margin:6px 0 0">Order business cards</h2>' +
    '<p class="lead">Fill in your details exactly as they should print. The preview updates as you type; the logo side ' +
    'is the same for everyone.</p>' +
    '<div class="po-cards">' +
      '<figure><div class="bc" id="bc-live" role="img" aria-label="Preview of the details side of your card"></div>' +
        '<figcaption>Your details side — live preview</figcaption></figure>' +
      '<figure><img src="print/business-card-front.png" alt="Logo side of the Sanctuary Recovery Centers business card">' +
        '<figcaption>Logo side</figcaption></figure>' +
    '</div>' +
    '<div class="card"><form class="po-form" id="bc-form" novalidate>' +
      '<div class="po-sec" style="margin-top:0">On the card</div>' +
      field('Full name', 'bc-name', 'type="text" maxlength="80" placeholder="e.g. Mimi Annoual" required') +
      field('Job title', 'bc-title', 'type="text" maxlength="80" placeholder="e.g. Human Resources Director" required') +
      field('Email', 'bc-email', 'type="email" maxlength="120" placeholder="name@sanctuaryrc.com"') +
      field('Phone', 'bc-phone', 'type="tel" maxlength="40" placeholder="(480) 925-2451"') +
      field('Website', 'bc-web', 'type="text" maxlength="80" value="SanctuaryRC.com"') +
      qtySelect('bc-qty', CARD_QTY, 'Quantity') +
      requesterFields('bc') +
      formFoot('bc', 'Submit card order') +
    '</form></div></section>';
}
/* ── the shop ─────────────────────────────────────────────────────────── */
var CATS = [['all', 'Everything'], ['cards', 'Business cards'], ['flyers', 'Flyers'], ['decks', 'Presentations'],
            ['custom', 'Something new']];
var CAT = 'all';
var DECKS = null, DECK_ADMIN = false;   /* from /api/presentations — slides stay private there */
function shopTiles() {
  var tiles = [{
    cat: 'cards', href: '#cards', kind: 'Business cards', title: 'Business cards',
    text: 'Your name, title and contact details on the Sanctuary card. See it as you type.',
    meta: '250 · 500 · 1,000 cards', go: 'Design yours',
    img: '<div class="stack"><img src="print/business-card-front.png" alt=""><img src="print/business-card-back.png" alt=""></div>'
  }];
  FLYER_CATALOG.forEach(function (f) {
    var n = f.versions.length;
    tiles.push({
      cat: 'flyers', href: 'flyer.html?id=' + encodeURIComponent(f.id), kind: 'Flyer', title: f.title,
      text: f.audience ? 'For ' + f.audience.charAt(0).toLowerCase() + f.audience.slice(1) + '.' : '',

/* ── order status + hand-out log (bottom of the shop) ─────────────────────
   Orders live in Supabase (supabase/print-orders.sql) and come from
   /api/requests (GET). Admins move an order along (Requested → Ordered →
   Shipped → Delivered); anyone can log where materials were handed out,
   and each delivered order shows how many are left. */
var STEPS = [['requested', 'Requested'], ['ordered', 'Ordered'], ['shipped', 'Shipped'], ['delivered', 'Delivered']];
var STATUS_LABEL = { requested: 'Requested', ordered: 'Ordered', shipped: 'Shipped', delivered: 'Delivered — in stock',
                     handed_out: 'All handed out', cancelled: 'Cancelled' };
var ORD = null, ORD_ERR = '', ORD_FILTER = 'open', ORD_EDIT = null;

function call(method, url, body) {
  var h = { 'Content-Type': 'application/json' };
  if (lsGet(PW_KEY) !== null) { h['X-Projects-Password'] = lsGet(PW_KEY); }
  return fetch(url, { method: method, credentials: 'same-origin', headers: h, body: body ? JSON.stringify(body) : undefined })
    .then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) { var e = new Error(j.message || ('Request failed (' + r.status + ')')); e.code = j.error; throw e; }
        return j;
      });
    });
}
function loadOrders() {
  return call('GET', API).then(function (j) { ORD = j; ORD_ERR = ''; }, function (e) { ORD_ERR = e.message; })
    .then(drawOrders);
}

function todayStr() { return new Date().toLocaleDateString('en-CA', { timeZone: 'America/Phoenix' }); }
function dayLabel(d) {
  if (!d) { return ''; }
  var t = new Date(d + 'T12:00:00');
  return t.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}
function daysFrom(d) { return Math.round((new Date(d + 'T12:00:00') - new Date(todayStr() + 'T12:00:00')) / 864e5); }
function versionById(id) {
  var hit = null;
  FLYER_CATALOG.forEach(function (f) { f.versions.forEach(function (v) { if (v.id === id) { hit = v; } }); });
  return hit;
}
function handedOut(order) {
  return (ORD.handouts || []).filter(function (h) { return h.order_id === order.id; })
    .reduce(function (n, h) { return n + h.quantity; }, 0);
}
function isOpen(o) { return o.status !== 'handed_out' && o.status !== 'cancelled'; }

function orderCard(o) {
  var v = o.item_ref && versionById(o.item_ref);
  var thumb = v ? '<img src="' + esc(flyerThumb(v)) + '" alt="" loading="lazy">'
                : '<i aria-hidden="true">' + (o.kind === 'business_cards' ? '▭' : o.kind === 'presentation' ? '▶' : '▤') + '</i>';
  var meta = [];
  meta.push(o.quantity !== null && o.quantity !== undefined ? fmt(o.quantity) + ' printed' : 'Quantity not set yet');
  if (o.vendor) { meta.push('from ' + esc(o.vendor)); }
  var late = false;
  if (o.status === 'delivered' || o.status === 'handed_out') {
    if (o.delivered_on) { meta.push('delivered ' + dayLabel(o.delivered_on)); }
  } else if (o.expected_on && o.status !== 'cancelled') {
    var n = daysFrom(o.expected_on);
    late = n < 0;
    meta.push('<b>' + (n === 0 ? 'arriving today' : n === 1 ? 'arriving tomorrow' : n < 0 ? 'was due ' : 'arriving ') +
      (n === 0 || n === 1 ? ' · ' : '') + dayLabel(o.expected_on) + '</b>');
  }
  if (o.stored_at) { meta.push('kept at ' + esc(o.stored_at)); }
  if (o.requested_by_name) { meta.push('asked for by ' + esc(o.requested_by_name)); }

  var at = STEPS.map(function (s) { return s[0]; }).indexOf(o.status);
  if (o.status === 'handed_out') { at = STEPS.length; }
  var steps = o.status === 'cancelled' ? '' : '<div class="or-steps" aria-label="Progress">' + STEPS.map(function (s, i) {
    return '<span class="' + (i <= at ? 'on' : '') + (i === at ? ' now' : '') + '">' + s[1] + '</span>';
  }).join('') + '</div>';

  var stock = '';
  var out = handedOut(o);
  if (o.status === 'delivered' || o.status === 'handed_out' || out) {
    if (o.quantity) {
      var left = Math.max(0, o.quantity - out);
      stock = '<div class="or-stock"><b>' + fmt(left) + ' left</b> of ' + fmt(o.quantity) + ' · ' + fmt(out) + ' handed out' +
        '<div class="or-bar"><i style="width:' + Math.min(100, Math.round(out / o.quantity * 100)) + '%"></i></div></div>';
    } else if (out) {
      stock = '<div class="or-stock">' + fmt(out) + ' handed out so far</div>';
    }
  }

  var acts = [];
  if (o.status === 'delivered') {
    acts.push('<button type="button" data-ho="' + o.id + '" class="go">Log hand-out</button>');
  }
  if (ORD.admin) {
    if (o.status === 'requested') { acts.push('<button type="button" class="go" data-to="ordered" data-id="' + o.id + '">Mark ordered</button>'); }
    if (o.status === 'ordered' || o.status === 'shipped') { acts.push('<button type="button" class="go" data-to="delivered" data-id="' + o.id + '">Mark delivered</button>'); }
    acts.push('<button type="button" data-edit="' + o.id + '">Edit</button>');
  }
  return '<div class="or' + (isOpen(o) ? '' : ' done') + '" id="or-' + o.id + '">' +
    '<div class="or-th">' + thumb + '</div>' +
    '<div><div class="or-name"><b>' + esc(o.item) + '</b><span class="or-pill s-' + o.status + (late ? ' late' : '') + '">' +
      (late ? 'Late' : STATUS_LABEL[o.status]) + '</span></div>' +
      '<div class="or-meta">' + meta.join(' · ') + '</div>' + steps + stock +
      (o.notes ? '<div class="or-meta">' + esc(o.notes) + '</div>' : '') + '</div>' +
    '<div class="or-act">' + acts.join('') + '</div>' +
    (ORD.admin ? '<div class="or-edit"' + (ORD_EDIT === o.id ? '' : ' hidden') + '>' + editForm(o) + '</div>' : '') +
  '</div>';
}

function handoutList() {

function drawOrders() {
  var el = document.getElementById('orders-body');
  if (!el) { return; }
  if (ORD_ERR || !ORD) { el.innerHTML = '<div class="po-err">' + esc(ORD_ERR || 'Could not load orders.') + '</div>'; return; }
  var orders = ORD.orders || [];
  var c = function (st) { return orders.filter(function (o) { return o.status === st; }).length; };
  var open = orders.filter(isOpen);
  var shown = ORD_FILTER === 'open' ? open : orders;
  var stock = orders.filter(function (o) { return o.status === 'delivered' && o.quantity; })
    .reduce(function (n, o) { return n + Math.max(0, o.quantity - handedOut(o)); }, 0);
  document.getElementById('or-addbtn').innerHTML = ORD.admin ? '<button type="button" class="btn" data-add="1">+ Add an order</button>' : '';
  el.innerHTML = (ORD.admin ? addOrderForm() : '') +
    '<div class="or-sum">' +

    '</div>' +

      : '<div class="or-empty">' + (orders.length ? 'Nothing open — everything has been handed out.' : 'No orders yet.') + '</div>') + '</div>' +
    '<div class="ho-wrap" id="handouts"><div class="eyebrow">Hand-out log</div>' +
    '<h3 style="font-family:Fraunces,serif;font-size:21px;margin:6px 0 10px">Where materials were handed out</h3>' +
    handoutForm() + handoutList() + '</div>';

/* one listener for the whole section; it survives redraws of #orders-body */
function wireOrders() {
  var sec = document.getElementById('orders');
  if (!sec) { return; }
  sec.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) { return; }
    if (b.hasAttribute('data-of')) { ORD_FILTER = b.getAttribute('data-of'); drawOrders(); return; }
    if (b.hasAttribute('data-add')) { var a = document.getElementById('or-add'); a.hidden = !a.hidden; if (!a.hidden) { a.querySelector('input').focus(); } return; }
    if (b.hasAttribute('data-close')) { ORD_EDIT = null; drawOrders(); return; }
    if (b.hasAttribute('data-edit')) {
      ORD_EDIT = ORD_EDIT === b.getAttribute('data-edit') ? null : b.getAttribute('data-edit'); drawOrders(); return;
    }
    if (b.hasAttribute('data-to')) {
      b.disabled = true;
      call('PATCH', API + '?order=' + b.getAttribute('data-id'), { status: b.getAttribute('data-to') })
        .then(loadOrders, function (err) { b.disabled = false; alert(err.message); });
      return;
    }
    if (b.hasAttribute('data-ho')) {
      document.getElementById('ho-order').value = b.getAttribute('data-ho');
      document.getElementById('ho-item-wrap').hidden = true;
      document.getElementById('ho-card').scrollIntoView({ behavior: 'smooth', block: 'center' });
      document.getElementById('ho-qty').focus({ preventScroll: true });
      return;
    }
    if (b.hasAttribute('data-del')) {
      if (!confirm('Remove this hand-out from the log?')) { return; }
      call('DELETE', API + '?handout=' + b.getAttribute('data-del')).then(loadOrders, function (err) { alert(err.message); });
    }
  });
  sec.addEventListener('change', function (e) {
    if (e.target.id === 'ho-order') { document.getElementById('ho-item-wrap').hidden = e.target.value !== 'other'; }
  });
  sec.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    if (f.id === 'ho-form') { submitHandout(); return; }
    var id = f.getAttribute('data-form');
    if (!id) { return; }
    var body = {};
    Array.prototype.forEach.call(f.elements, function (x) { if (x.name) { body[x.name] = x.value.trim(); } });
    var err = document.getElementById('oe-' + id + '-err');
    var btn = f.querySelector('button[type=submit]');
    btn.disabled = true;
    (id === 'new' ? call('POST', API, { kind: 'order', order: body }) : call('PATCH', API + '?order=' + id, body))
      .then(function () { ORD_EDIT = null; return loadOrders(); },
            function (x) { btn.disabled = false; err.hidden = false; err.textContent = x.message; });
  });
}
function submitHandout() {
  var v = function (id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; };
  var order = v('ho-order');
  if (!order) { msg('ho', 'err', 'Pick what you handed out.'); return; }
  if (order === 'other' && !v('ho-item')) { msg('ho', 'err', 'Say what you handed out.'); return; }
  if (!(+v('ho-qty') >= 1)) { msg('ho', 'err', 'Say how many you handed out.'); return; }
  if (!v('ho-loc')) { msg('ho', 'err', 'Say where you handed them out.'); return; }
  var btn = document.getElementById('ho-go');
  btn.disabled = true; btn.textContent = 'Saving…';
  call('POST', API, {
    kind: 'handout', order_id: order === 'other' ? null : order, item: order === 'other' ? v('ho-item') : '',
    quantity: +v('ho-qty'), handed_out_on: v('ho-date'), location: v('ho-loc'), audience: v('ho-aud'),
    notes: v('ho-notes'), requester_name: v('ho-by')
  }).then(function (j) {
    return loadOrders().then(function () {
      msg('ho', 'ok', 'Logged — ' + fmt(j.handout.quantity) + ' at ' + j.handout.location + '. Thank you!');
    });
  }, function (e) { btn.disabled = false; btn.textContent = 'Log it'; msg('ho', 'err', e.message); });
}

/* ── submitting ───────────────────────────────────────────────────────── */
function msg(pfx, kind, text) {
  var err = document.getElementById(pfx + '-err'), ok = document.getElementById(pfx + '-ok');
  err.hidden = kind !== 'err' || !text; ok.hidden = kind !== 'ok' || !text;
  (kind === 'ok' ? ok : err).textContent = text || '';
}
function send(pfx, body, btnText, done) {
  var btn = document.getElementById(pfx + '-go');
  if (lsGet(PW_KEY) === null && !SM.me) { msg(pfx, 'err', 'Sign in, or enter the team password at the top of the page first.'); return; }
  btn.disabled = true; btn.textContent = 'Sending…'; msg(pfx, 'err', '');
  fetch(API, {
    method: 'POST',
    credentials: 'same-origin',
    headers: lsGet(PW_KEY) !== null ? { 'Content-Type': 'application/json', 'X-Projects-Password': lsGet(PW_KEY) }
                                    : { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (!r.ok) { var e = new Error(j.message || ('Request failed (' + r.status + ')')); e.code = j.error; throw e; }
      return j;
    });
  }).then(function () {
    lsSet(ME_KEY, JSON.stringify({ name: body.requester_name, email: body.requester_email }));
    btn.disabled = false; btn.textContent = btnText;
    done();
  }, function (e) {
    btn.disabled = false; btn.textContent = btnText;
    if (e.code === 'password') { lsDel(PW_KEY); render(); msg(pfx, 'err', 'That team password didn\'t work — enter it again at the top.'); return; }
    msg(pfx, 'err', e.message);
  });
}
function requester(pfx) {
  var v = function (id) { return document.getElementById(pfx + '-' + id).value.trim(); };
  return { requester_name: v('by'), requester_email: v('byemail'), needed_by: v('need'), deliver_to: v('deliver'), notes: v('notes') };
}
function need(pfx, id, text) {
  var el = document.getElementById(id);
  if (el.value.trim() && el.checkValidity()) { return true; }
  msg(pfx, 'err', text); el.focus(); return false;
}

function submitCard() {
  var c = cardValues();
  if (!need('bc', 'bc-name', 'Add the name for the card.') || !need('bc', 'bc-title', 'Add the job title for the card.') ||
      !need('bc', 'bc-by', 'Add your name so we know who asked.')) { return; }
  if (c.email && !document.getElementById('bc-email').checkValidity()) { msg('bc', 'err', 'The card email doesn\'t look right.'); return; }
  var body = Object.assign({ kind: 'business_cards', card: c, quantity: +document.getElementById('bc-qty').value }, requester('bc'));
  send('bc', body, 'Submit card order', function () {
    ['bc-name', 'bc-title', 'bc-email', 'bc-phone', 'bc-need', 'bc-deliver', 'bc-notes'].forEach(function (id) {
      document.getElementById(id).value = '';
    });
    refreshCard();
    msg('bc', 'ok', 'Got it — ' + fmt(body.quantity) + ' cards for ' + c.name + ' are on the order list. You can submit another.');
  });
}
function submitNewFlyer() {
  if (!need('nf', 'nf-topic', 'Say what the flyer is for.') || !need('nf', 'nf-msg', 'Say what the flyer should say or do.') ||
      !need('nf', 'nf-by', 'Add your name so we know who asked.')) { return; }
  var v = function (id) { return document.getElementById(id).value.trim(); };
  var body = Object.assign({ kind: 'new_flyer', topic: v('nf-topic'), audience: v('nf-aud'), message: v('nf-msg'),
                             details: v('nf-det'), quantity: +v('nf-qty') }, requester('nf'));
  send('nf', body, 'Request the flyer', function () {
    ['nf-topic', 'nf-aud', 'nf-msg', 'nf-det', 'nf-need', 'nf-deliver', 'nf-notes'].forEach(function (id) { document.getElementById(id).value = ''; });
    document.getElementById('nf-qty').value = '0';
    msg('nf', 'ok', 'Got it — "' + body.topic + '" is on the marketing list. You\'ll hear back before anything prints.');
  });
}

function wire() {
  var pw = document.getElementById('pwform');
  if (pw) {
    pw.addEventListener('submit', function (e) {
      e.preventDefault();
      var v = document.getElementById('pw').value;
      if (!v) { return; }
      lsSet(PW_KEY, v);
      pw.parentNode.remove();
    });
  }
  var bc = document.getElementById('bc-form');
  if (bc) {
    bc.addEventListener('input', function () { refreshCard(); msg('bc', 'err', ''); });
    document.getElementById('bc-phone').addEventListener('blur', function () { this.value = fmtPhone(this.value); refreshCard(); });
    bc.addEventListener('submit', function (e) { e.preventDefault(); submitCard(); });
  }
  var nf = document.getElementById('nf-form');
  if (nf) {
    nf.addEventListener('input', function () { msg('nf', 'err', ''); });
    nf.addEventListener('submit', function (e) { e.preventDefault(); submitNewFlyer(); });
  }
  document.querySelectorAll('.sh-cat').forEach(function (b) {
    b.addEventListener('click', function () {
      CAT = b.getAttribute('data-cat');
      document.querySelectorAll('.sh-cat').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      document.querySelectorAll('.sh[data-cat]').forEach(function (t) { t.hidden = CAT !== 'all' && CAT !== t.getAttribute('data-cat'); });
    });
  });
}

SM.ready.then(function () { render(); loadDecks(); });
</script>
