<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanctuary Recovery Centers — Website Edits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="report.css">
<style>
/* ── two panes: page list | the chosen page ── */
.ws{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:20px;align-items:start}
.ws-list{position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column;
  border:1px solid var(--line);border-radius:11px;background:var(--paper);overflow:hidden}
.ws-tools{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:#fff}
.ws-tools input{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:9px}
.ws-tools input:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:transparent}
.ws-filt{display:flex;gap:6px;flex-wrap:wrap}
.ws-filt button{all:unset;cursor:pointer;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.ws-filt button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.ws-filt button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ws-count{font-size:12px;color:var(--muted)}
.ws-pages{overflow:auto;flex:1}
.ws-pg{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:10px 12px;border-bottom:1px solid var(--line)}
.ws-pg:hover{background:#eef5f8}
.ws-pg:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.ws-pg[aria-current="true"]{background:#e3f1f9;box-shadow:inset 3px 0 0 var(--blue)}
.ws-pg b{display:block;font-size:13.5px;line-height:1.3;color:var(--ink)}
.ws-pg span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;word-break:break-all}
.ws-pg i{font-style:normal;color:#B23A1B;font-weight:600}
/* ── page detail ── */
.ws-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ws-head h2{font-size:24px;margin:4px 0 0}
.ws-head a{font-size:13px;color:var(--blue);word-break:break-all}
.ws-act{display:flex;gap:8px;flex-wrap:wrap}
.ws-meta{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:13.5px;line-height:1.45}
.ws-meta dt{color:var(--muted);font-weight:600}
.ws-meta dd{margin:0}
.ws-len{font-size:11.5px;color:var(--muted)}
.ws-issues{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.ws-issues li{font-size:12px;padding:3px 9px;border-radius:99px;background:#fbeae6;color:#8f2f1b}
.ws-body{border-left:3px solid var(--line);padding-left:16px}
.ws-blk{position:relative;padding:6px 96px 6px 0;border-radius:6px}
.ws-blk:hover{background:#f3f8fb}
.ws-blk .ws-q{position:absolute;right:4px;top:6px;opacity:0;transition:opacity .12s}
.ws-blk:hover .ws-q,.ws-blk .ws-q:focus{opacity:1}
.ws-blk h1,.ws-blk h2,.ws-blk h3,.ws-blk h4{font-family:Fraunces,serif;margin:6px 0 0;line-height:1.3}
.ws-blk h1{font-size:22px}.ws-blk h2{font-size:19px}.ws-blk h3{font-size:16.5px}.ws-blk h4{font-size:15px}
.ws-blk p{margin:0;font-size:14px;line-height:1.55}
.ws-tag{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-right:6px}
.ws-more{font-size:12.5px;color:var(--muted);margin-top:10px}
.btn.sm{min-height:0;padding:5px 10px;font-size:11.5px}
.btn.lt{background:#fff!important;color:var(--teal)!important;border:1px solid var(--line)!important}
.btn.lt:hover{background:#eef5f8!important}
/* ── request popover ── */
#wmodal{border:0;padding:0;border-radius:16px;width:min(620px,calc(100vw - 32px));max-height:calc(100vh - 32px);
  box-shadow:0 24px 60px rgba(22,38,59,.28);color:var(--ink);background:#fff}
#wmodal::backdrop{background:rgba(22,38,59,.42);backdrop-filter:blur(2px)}
.wm{padding:22px 24px 20px;display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.wm-head{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:12px}
.wm-head h3{font-family:Fraunces,serif;font-size:21px;font-weight:600;margin:0}
.wm-x{all:unset;cursor:pointer;font-size:24px;line-height:1;padding:2px 8px;border-radius:6px;color:var(--muted)}
.wm-x:hover{background:#f1f5f7}
.wm-sub{grid-column:1/-1;margin:-6px 0 0;font-size:13px;color:var(--muted);word-break:break-all}
.wm-f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.wm-f input,.wm-f select,.wm-f textarea{font-family:Inter,sans-serif;font-size:14px;font-weight:400;text-transform:none;letter-spacing:0;
  color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.wm-f textarea{resize:vertical;line-height:1.45}
.wm-f input:focus,.wm-f select:focus,.wm-f textarea:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:transparent}
.wm-wide{grid-column:1/-1}
.wm-err{grid-column:1/-1;padding:10px 12px;border-radius:9px;background:#fbeae6;color:#8f2f1b;font-size:13px}
.wm-err[hidden]{display:none}
.wm-foot{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}
.ws-ok{padding:12px 14px;border-radius:9px;background:#e9f5ee;color:#1f5a37;font-size:14px;margin:0 0 14px}
@media (max-width:860px){
  .ws{grid-template-columns:1fr}
  .ws-list{position:static;max-height:360px}
}
@media (max-width:600px){
  .wm{grid-template-columns:1fr;padding:18px 16px}
  .ws-meta{grid-template-columns:1fr;gap:2px}
  .ws-meta dd{margin-bottom:8px}
  .ws-blk{padding-right:0}
  .ws-blk .ws-q{position:static;opacity:1;margin-top:4px}
}
</style>
</head>
<body><div class="sheet" id="sheet"></div>
<script src="data.js"></script>
<script src="ui.js"></script>
<script src="website-pages.js"></script>
<script src="chat.js" defer></script>
<script>
/* ── website edits ────────────────────────────────────────────────────────
   Every page of sanctuaryrecoverycenters.com, as of the last crawl
   (website-pages.js, built by tools/crawl-website.py), with what is on it
   and a way to ask for a change. Requests go to /api/requests and land as
   tasks on the Projects page.                                            */
var API = '/api/requests';
var PW_KEY = 'src_projects_pw';   /* same team password as the Projects page */
var ME_KEY = 'src_print_me_v1';   /* shared with the print orders page */
var EDIT_TYPES = ['Change text', 'Page title / Google description', 'Images or video', 'Add a section',
                  'Remove something', 'Fix a link or button', 'New page', 'Other'];
var PAGES = WEBSITE.pages;
var Q = '', FILTER = 'all', CUR = null, OK = '';

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* private mode */ } }
function me() { try { return JSON.parse(lsGet(ME_KEY)) || {}; } catch (e) { return {}; } }
function attr(s) { return esc(s).replace(/"/g, '&quot;'); }

function pageName(p) { return p.path === '/' ? 'Home page' : (p.h1[0] || p.title.split(' | ')[0] || p.path); }
function byPath(path) { return PAGES.filter(function (p) { return p.path === path; })[0]; }
function fmtCrawl(iso) {
  return new Date(iso + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

/* ── the page list ────────────────────────────────────────────────────── */
function visible() {
  var q = Q.toLowerCase();
  return PAGES.filter(function (p) {
    if (FILTER === 'issues' && !p.issues.length) { return false; }
    if (FILTER === 'blog' && !p.published) { return false; }
    if (!q) { return true; }
    return (p.path + ' ' + p.title + ' ' + p.h1.join(' ')).toLowerCase().indexOf(q) >= 0 ||
      p.blocks.some(function (b) { return b[1].toLowerCase().indexOf(q) >= 0; });
  });
}
function listHtml() {
  var list = visible();
  return '<div class="ws-count">' + list.length + ' of ' + PAGES.length + ' pages</div>' +
    '</div><div class="ws-pages" id="ws-pages">' +
    (list.length ? list.map(function (p) {
      return '<button type="button" class="ws-pg" data-path="' + attr(p.path) + '"' + (CUR === p.path ? ' aria-current="true"' : '') + '>' +
        '<b>' + esc(pageName(p)) + '</b><span>' + esc(p.path) +
        (p.issues.length ? ' · <i>' + p.issues.length + ' to check</i>' : '') + '</span></button>';
    }).join('') : '<p class="ws-more" style="padding:12px">No pages match.</p>') + '</div>';
}
function listPane() {
  var f = function (k, label) { return '<button type="button" data-f="' + k + '" aria-pressed="' + (FILTER === k) + '">' + label + '</button>'; };
  return '<div class="ws-list"><div class="ws-tools">' +
    '<input type="search" id="ws-q" placeholder="Search pages or text on them…" aria-label="Search pages" value="' + attr(Q) + '">' +
    '<div class="ws-filt">' + f('all', 'All pages') + f('issues', 'Needs a look') + f('blog', 'Dated posts') + '</div>' +
    '<div id="ws-listbody">' + listHtml() + '</div></div>';
}

/* ── the chosen page ──────────────────────────────────────────────────── */
function lenNote(s, max) { return s ? ' <span class="ws-len">(' + s.length + ' chars' + (s.length > max ? ' — Google cuts at ~' + max : '') + ')</span>' : ''; }
function detailPane() {
  var p = byPath(CUR);
  if (!p) {
    return (OK ? '<div class="ws-ok" role="status">' + esc(OK) + '</div>' : '') +
      '<div class="card"><h3>Pick a page</h3><p style="margin:0;font-size:14px;line-height:1.55">Choose a page on the left to see ' +
      'everything on it. Hover any heading or paragraph and click <b>Request edit</b> to ask for a change to that exact text, ' +
      'or use <b>Request an edit</b> for anything else on the page.</p>' +
      '<p style="margin:12px 0 0"><button type="button" class="btn" data-req="new">Request a new page</button></p></div>';
  }
  var blocks = p.blocks.map(function (b, i) {
    var tag = /^h[1-4]$/.test(b[0]) ? b[0] : 'p';
    return '<div class="ws-blk"><' + tag + '>' + (tag !== 'p' ? '<span class="ws-tag">' + tag.toUpperCase() + '</span>' : '') +
      esc(b[1]) + '</' + tag + '>' +
      '<button type="button" class="btn sm lt ws-q" data-quote="' + i + '">Request edit</button></div>';
  }).join('');
  return '<div class="ws-head"><div><div class="eyebrow">' + (p.published ? 'Post · ' + esc(p.published) : 'Page') + '</div>' +
      '<h2>' + esc(pageName(p)) + '</h2>' +
      '<a href="' + attr(p.url) + '" target="_blank" rel="noopener">' + esc(p.url) + ' ↗</a></div>' +
      '<div class="ws-act"><button type="button" class="btn" data-req="page">Request an edit</button></div></div>' +
    (OK ? '<div class="ws-ok" role="status" style="margin-top:14px">' + esc(OK) + '</div>' : '') +
    '<div class="card" style="margin-top:16px"><h3>How it shows in Google</h3><dl class="ws-meta">' +
      '<dt>Page title</dt><dd>' + (p.title ? esc(p.title) + lenNote(p.title, 60) : '—') + '</dd>' +
      '<dt>Description</dt><dd>' + (p.description ? esc(p.description) + lenNote(p.description, 160) : '—') + '</dd>' +
      '<dt>Main heading (H1)</dt><dd>' + (p.h1.length ? p.h1.map(esc).join('<br>') : '—') + '</dd>' +
      '<dt>Size</dt><dd>' + fmt(p.words) + ' words · ' + p.images + ' images</dd>' +
      (p.lastmod ? '<dt>Last updated</dt><dd>' + esc(fmtCrawl(p.lastmod)) + '</dd>' : '') +
      (p.issues.length ? '<dt>Worth a look</dt><dd><ul class="ws-issues">' +
        p.issues.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul></dd>' : '') +
    '</dl></div>' +
    '<div class="card"><h3>What\'s on the page</h3><div class="ws-body">' +
      (blocks || '<p class="ws-more">No text found on this page.</p>') + '</div>' +
      (p.blocks.length >= 80 ? '<p class="ws-more">Showing the first 80 blocks — open the live page for the rest.</p>' : '') +
      '<p class="ws-more">Shared header and footer are left out. Text as of the ' + esc(fmtCrawl(WEBSITE.crawled)) + ' crawl.</p></div>';
}

function render() {
  document.getElementById('sheet').innerHTML =
    pageHeader('Website Edits', 'sanctuaryrecoverycenters.com &nbsp;·&nbsp; Internal',
      PAGES.length + ' pages · crawled ' + esc(fmtCrawl(WEBSITE.crawled)), 'website') +
    '<section><div class="eyebrow">Self-service</div>' +
      '<h2 style="font-size:26px;margin:6px 0 0">Request website edits</h2>' +
      '<p class="lead">Every page on the website and what\'s on it. Find the page, point at the text that needs to change, and ' +
      'say what it should be. Requests go to marketing as tasks — nothing on the live site changes until they make it.</p>' +
      pwCard() +
      '<div class="ws">' + listPane() + '<div id="ws-detail">' + detailPane() + '</div></div>' +
    '</section>' +
    pageFooter('sanctuaryrecoverycenters.com sitemap crawl, ' + fmtCrawl(WEBSITE.crawled));
  wire();
}
function pwCard() {
  if (lsGet(PW_KEY) !== null) { return ''; }
  return '<div class="card" id="pwcard"><form class="addform" id="pwform" style="grid-template-columns:2fr auto">' +
    '<div class="f"><label for="pw">Team password</label><input type="password" id="pw" autocomplete="current-password" ' +
    'style="font-family:inherit;font-size:13.5px;padding:9px 11px;border:1px solid var(--line);border-radius:8px"></div>' +
    '<button class="btn" type="submit">Save</button></form>' +
    '<p class="sub" style="margin:8px 0 0">Requests need the team password. Enter it once — this browser will remember it.</p></div>';
}
function refreshList() { document.getElementById('ws-listbody').innerHTML = listHtml(); wireList(); }
function select(path) {
  CUR = path; OK = '';
  history.replaceState(null, '', '#' + path);
  document.getElementById('ws-detail').innerHTML = detailPane();
  refreshList();
  wireDetail();
  if (window.innerWidth <= 860) { document.getElementById('ws-detail').scrollIntoView({ behavior: 'smooth' }); }
}

/* ── request popover ──────────────────────────────────────────────────── */
function modal() {
  var d = document.getElementById('wmodal');
  if (!d) {
    d = document.createElement('dialog'); d.id = 'wmodal'; d.setAttribute('aria-labelledby', 'wm-title');
    document.body.appendChild(d);
    d.addEventListener('click', function (e) { if (e.target === d) { closeModal(); } });
  }
  return d;
}
function closeModal() { var d = document.getElementById('wmodal'); if (d && d.open) { d.close(); } }
function openRequest(mode, quote) {
  var p = mode === 'new' ? null : byPath(CUR), m = me();
  var type = mode === 'new' ? 'New page' : (quote !== undefined ? 'Change text' : '');
  var d = modal();
  d.innerHTML = '<form class="wm" id="wm-form" novalidate>' +
    '<div class="wm-head"><h3 id="wm-title">' + (p ? 'Request an edit' : 'Request a new page') + '</h3>' +
      '<button type="button" class="wm-x" id="wm-close" aria-label="Close">×</button></div>' +
    (p ? '<p class="wm-sub">' + esc(pageName(p)) + ' · ' + esc(p.path) + '</p>' : '') +
    '<label class="wm-f">What kind of change<select id="wm-type"><option value="">Choose…</option>' +
      EDIT_TYPES.filter(function (t) { return p ? t !== 'New page' : true; }).map(function (t) {
        return '<option' + (t === type ? ' selected' : '') + '>' + t + '</option>';
      }).join('') + '</select></label>' +
    '<label class="wm-f">Priority<select id="wm-pri"><option value="Med">Normal</option><option value="Hot">Urgent</option></select></label>' +
    (p ? '<label class="wm-f wm-wide">Currently says <span style="font-weight:400;text-transform:none;letter-spacing:0">(optional)</span>' +
      '<textarea id="wm-cur" rows="3" maxlength="2000">' + (quote !== undefined ? esc(p.blocks[quote][1]) : '') + '</textarea></label>' : '') +
    '<label class="wm-f wm-wide">' + (p ? 'Change it to / what should change' : 'What should the page be about') +
      '<textarea id="wm-chg" rows="4" maxlength="3000" placeholder="' +
      (p ? 'Write the new wording, or describe the change' : 'Topic, who it\'s for, where it should sit in the menu…') + '"></textarea></label>' +
    '<label class="wm-f">Your name<input id="wm-by" type="text" maxlength="120" autocomplete="name" value="' + attr(m.name || '') + '"></label>' +
    '<label class="wm-f">Your email<input id="wm-em" type="email" maxlength="200" autocomplete="email" value="' + attr(m.email || '') + '"></label>' +
    '<label class="wm-f">Needed by<input id="wm-need" type="date"></label><span></span>' +
    '<div class="wm-err" id="wm-err" role="alert" hidden></div>' +
    '<div class="wm-foot"><button type="button" class="btn lt" id="wm-cancel">Cancel</button>' +
      '<button type="submit" class="btn" id="wm-go">Send request</button></div>' +
  '</form>';
  document.getElementById('wm-close').addEventListener('click', closeModal);
  document.getElementById('wm-cancel').addEventListener('click', closeModal);
  document.getElementById('wm-form').addEventListener('input', function () { err(''); });
  document.getElementById('wm-form').addEventListener('submit', function (e) { e.preventDefault(); send(p); });
  d.showModal();
  document.getElementById(type ? 'wm-chg' : 'wm-type').focus();
}
function err(t) { var e = document.getElementById('wm-err'); e.textContent = t; e.hidden = !t; }
function send(p) {
  var v = function (id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; };
  var body = { kind: 'website_edit', page_url: p ? p.url : '', page_title: p ? pageName(p) : '',
               edit_type: v('wm-type'), priority: v('wm-pri'), current_text: v('wm-cur'), change: v('wm-chg'),
               requester_name: v('wm-by'), requester_email: v('wm-em'), needed_by: v('wm-need') };
  if (lsGet(PW_KEY) === null) { err('Enter the team password on the page first.'); return; }
  if (!body.edit_type) { err('Pick what kind of change it is.'); document.getElementById('wm-type').focus(); return; }
  if (!body.change) { err('Describe the change you want.'); document.getElementById('wm-chg').focus(); return; }
  if (!body.requester_name) { err('Add your name so we know who asked.'); document.getElementById('wm-by').focus(); return; }
  var btn = document.getElementById('wm-go');
  btn.disabled = true; btn.textContent = 'Sending…';
  fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Projects-Password': lsGet(PW_KEY) || '' },
               body: JSON.stringify(body) })
    .then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) { var e = new Error(j.message || ('Request failed (' + r.status + ')')); e.code = j.error; throw e; }
      });
    })
    .then(function () {
      lsSet(ME_KEY, JSON.stringify({ name: body.requester_name, email: body.requester_email }));
      closeModal();
      OK = 'Request sent — "' + body.edit_type + '"' + (p ? ' on ' + pageName(p) : '') + ' is on the marketing task list.';
      document.getElementById('ws-detail').innerHTML = detailPane();
      wireDetail();
    }, function (e) {
      btn.disabled = false; btn.textContent = 'Send request';
      if (e.code === 'password') { lsDel(PW_KEY); closeModal(); render(); alert('That team password didn\'t work — enter it again.'); return; }
      err(e.message);
    });
}

/* ── wiring ───────────────────────────────────────────────────────────── */
function wireList() {
  document.querySelectorAll('.ws-pg').forEach(function (b) {
    b.addEventListener('click', function () { select(this.getAttribute('data-path')); });
  });
}
function wireDetail() {
  document.querySelectorAll('#ws-detail [data-req]').forEach(function (b) {
    b.addEventListener('click', function () { openRequest(this.getAttribute('data-req')); });
  });
  document.querySelectorAll('#ws-detail [data-quote]').forEach(function (b) {
    b.addEventListener('click', function () { openRequest('page', +this.getAttribute('data-quote')); });
  });
}
function wire() {
  var pw = document.getElementById('pwform');
  if (pw) {
    pw.addEventListener('submit', function (e) {
      e.preventDefault();
      var v = document.getElementById('pw').value;
      if (v) { lsSet(PW_KEY, v); document.getElementById('pwcard').remove(); }
    });
  }
  document.getElementById('ws-q').addEventListener('input', function () { Q = this.value.trim(); refreshList(); });
  document.querySelectorAll('[data-f]').forEach(function (b) {
    b.addEventListener('click', function () {
      FILTER = this.getAttribute('data-f');
      document.querySelectorAll('[data-f]').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
      refreshList();
    });
  });
  wireList();
  wireDetail();
}

var start = decodeURIComponent(location.hash.slice(1));
CUR = byPath(start) ? start : null;
render();
</script>
</body></html>
